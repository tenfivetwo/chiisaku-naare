<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffeef5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まめまる">
<meta name="description" content="同じ子どうしがくっつくと小さくなる、不思議な動物パズル。">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>まめまる 〜くっつくと小さくなる〜</title>
<style>
  * {
    box-sizing: border-box; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    position: fixed; inset: 0;              /* iOS の ゴムのような スクロールを とめる */
    overflow: hidden; overscroll-behavior: none;
    background: linear-gradient(180deg, #ffeef5 0%, #eaf4ff 55%, #fff6e8 100%);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "游ゴシック", "Meiryo", sans-serif;
    color: #6b5548;
    touch-action: none;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    padding: calc(6px + env(safe-area-inset-top))  calc(8px + env(safe-area-inset-right))
             calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  }
  button { touch-action: manipulation; }
  canvas { touch-action: none; }
  button { white-space: nowrap; }
  #wrap { overflow: hidden; }
  /* **上の 行の はばを ばんめんに そろえる。**（2026-09-19）
     430px 決め打ちだった ので、ひろい 画面（倍率が 上限 1.1 に 当たる 端末・
     パソコン）では **ばんめんだけ 529px あって 上の 行が 430px** と
     100px ずれて いた。`--rowW` は fitCanvas が 実測して 入れる。
     せまい 画面では もともと 両方 おなじ はば なので 何も 変わらない。 */
  #hud {
    width: 100%; max-width: var(--rowW, 430px);
    display: flex; align-items: stretch; gap: 6px;
  }
  .card {
    flex: 1; background: rgba(255,255,255,.72);
    border: 2px solid #fff; border-radius: 14px;
    padding: 4px 6px; text-align: center;
    box-shadow: 0 2px 0 rgba(190,170,160,.25);
  }
  /* **色は「色あいと あざやかさは そのまま、あかるさ だけ 下げる」で 決めて いる。**
     （2026-09-19・第3回評価の コントラスト指摘）
     HUD の 字は 白い カード（実効 `#fffafc`）の 上に あるので、
     小さい字は 4.5:1、大きい字（24px 以上）は 3:1 が 目安。
     もとの 色は 2.5〜3.0:1 しか なく、**明るい ところで 読めない**。
     HSL の H と S を 変えずに L だけ 下げて いるので、
     **ピンクは ピンク、茶は 茶の まま** 濃く なっただけ。
     新しい 色を 足す ときも この やり方で 合わせる こと
     （`tools/` に 道具は 置いて いない。使い捨ての 計算で よい）。 */
  .card .lbl { font-size: 12px; letter-spacing: .06em; color: #896f63; }   /* 2.99 → 4.50 */
  .card .val { font-size: clamp(24px, 8vw, 34px); font-weight: 700; line-height: 1.05; color: #7a6154; }
  .card .val.long { font-size: clamp(17px, 5.6vw, 26px); }
  .card .sub { font-size: 10px; color: #896f63; line-height: 1.2; margin-top: -1px; }
  #hud .card { min-width: 0; }
  /* **5枚の カードの 字の 高さを そろえる。**（2026-09-22・作者）
     `.card.lv`（連鎖・Lv）だけ たて中央ぞろえに なって いて、
     ラベルの 高さが **13px**、2行目の 高さが **7px** ずれて いた（実測）。
     いまは ぜんぶ 「ラベルは いちばん上・2行目は のこりの まんなか」。
     ずれは 2px と 1px に なる。
     **たては 1px も ふえない。** 行の 高さは もともと いちばん 背の 高い
     カード（見送った・スコア）が 決めて いて、連鎖と Lv は その 中で
     余って いた ── その 余りを つかうだけ。ばんめんも 1px も 変わらない
     （375x553 で 282x437、320x568 で 263x437、3けたでも 同じ。実測）。
     **2行目は flex コンテナに せず auto マージンで 寄せる こと。**
     「次」の 中身は canvas なので、入れ物に できない。 */
  #hud .card { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  #hud .card > :nth-child(2) { margin-top: auto; margin-bottom: auto; }
  .card.hi .val { color: #f06189; }                                        /* 2.56 → 3.00（大きい字） */
  /* ばんめんの みぎに たての しんかの図を ならべる。
     **たてでは なく よこの 予算を つかう**のが みそ。スマホの たては
     いつも 足りて いないが（CLAUDE.md の 縦予算の はなし）、よこは あまって いる。
     ばんめんが たかさで きまって いる 画面（ふつうの スマホ）では、
     図を 足しても ばんめんは 1px も 小さく ならない。 */
  /* **ばんめんと しんかの図を、上の行と 同じ はばに ひろげて 左右の はしに つける。**
     （2026-09-19・作者の 指摘「図の みぎに すきまが 空いて 見える」）
     ばんめんが **たてで きまる** 端末では、ばんめん＋図 が 画面より せまく なり、
     あまりが 左右に 半分ずつ ついて **図が 宙に うかんで 見えて いた**
     （実測 375x553：左あき 25px ／ 図の右あき 25px）。
     `space-between` で 左右の はしに つけると、上の行と 縁が そろう。
     **これで ばんめんは 広がらない。** 大きさは `fitCanvas` が
     たてと はばの 小さい ほうで もう 決めて いて、この 端末では **たて**が 効いて いる
     ── 図を まるごと 消しても 281.5px の まま（実測）。 */
  /* 【2026-09-19 その2】`space-between` は やめて **左づめ**に した
     （作者の 指摘「進化の図は 左詰に しよう」）。
     たてで きまる 端末では 行の はば（--rowW は 430 を 下まわらない）が
     ばんめん＋図 より 広い ので、`space-between` だと
     **ばんめんと 図の あいだに 50px ほどの すきまが 開く**。実機の スクショで
     図だけが ぽつんと はなれて 見えた。左づめなら ばんめんの すぐ みぎに つく。
     あまりは 行の みぎに 出るが、図は ばんめんと ひとかたまりに 見える。
     **ここでも ばんめんは 広がらない**（大きさは fitCanvas が もう 決めて いる）。 */
  #stage { position: relative; display: flex; align-items: flex-start; gap: 6px;
    width: 100%; max-width: var(--rowW, 430px); justify-content: flex-start; }
  /* 進化の図の たて1列（やめる ＋ 図）。はばは どちらも `--ladW`。 */
  #ladCol { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }  /* gap は JS の GIVEUP_GAP と そろえる */
  canvas#ladderCv { display: block; border-radius: 14px;
    box-shadow: 0 6px 16px rgba(180,150,160,.20); }
  canvas#game {
    display: block; border-radius: 20px;
    box-shadow: 0 10px 26px rgba(180,150,160,.28);
    max-width: 100%; max-height: 100%;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 15; border-radius: 0;
    background: rgba(255,250,252,.88);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 8px; text-align: center; backdrop-filter: blur(2px);
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  /* **`justify-content: center` を たてに 戻さない こと。**
     中身が 画面より たかい とき、center は **はみ出しを 上下に 折半する**ので
     上が 画面の そとに 出る。しかも `scrollTop` の 下限は 0 なので
     **スクロールしても 上へ 戻せない**。実測（2026-09-17）：
     375×600 で h1 の 上端が −47px、320×568 で −57px ──
     つまり iPhone SE では **「まめまる」という 名前が 一度も 画面に 出て いなかった**。
     かわりに いちばん上と いちばん下の 子に `margin: auto` を あてる。
     すきまが ある ときは 2つの auto が 等分して **まんなかに そろい**、
     足りない ときは auto が 0 に つぶれて **上ぞろえ＋ぜんぶ スクロールできる**に なる。
     （auto マージンは `justify-content` より 先に すきまを 取るので 両立する）
     **`.result` は のぞく。** あちらは 子が 1つ（.panel）だけ なので、
     first と last が 同じ 要素に なって 上下 auto ＝ まんなか に なり、
     `justify-content: flex-end` の 下ぞろえが こわれる。 */
  #overlay:not(.result) > :first-child { margin-top: auto; }
  #overlay:not(.result) > :last-child  { margin-bottom: auto; }
  #overlay.hidden { display: none; }
  .hidden { display: none !important; }
  /* けっか画面は うすく：うしろの ばんめんが よく見えるように */
  #overlay.result {
    background: rgba(150,120,140,.10);
    backdrop-filter: none;
    justify-content: flex-end;
    padding: 12px 12px calc(18px + env(safe-area-inset-bottom));
  }
  #overlay.result .panel {
    background: rgba(255,252,253,.94);
    border: 3px solid #ffdfec; border-radius: 20px;
    padding: 12px 18px 14px; max-width: 320px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    box-shadow: 0 10px 26px rgba(160,120,140,.35);
  }
  #overlay.result h1 { font-size: 20px; }
  #overlay.result .big { font-size: 34px; }
  #overlay.result p { font-size: 12px; line-height: 1.6; }
  #overlay.result .rank {
    font-size: 17px; font-weight: 700; color: #7a6154;
    background: linear-gradient(180deg,#fff6dc,#ffe9c4);
    border: 2px solid #ffd88f; border-radius: 999px;
    padding: 5px 20px; margin: 2px 0 0;
    box-shadow: 0 2px 0 rgba(200,160,100,.25);
  }
  #overlay.result .ms-got { font-size: 13px; font-weight: 700; color: #d9a23c; }
  #overlay.result .calc { font-size: 12px; color: #a58e83; margin-top: -3px; }
  /* やりかけの おだい。⭐の 行の すぐ下に、ひとまわり 小さく。
     **出すのは いちばん おしい 1つ だけ。** ここは もう 8項目 あって
     いちばん 混む ところ なので、2つ 出すと 点数が うもれる。 */
  #overlay.result .ms-left { font-size: 11.5px; color: #b0894f; margin-top: -4px; }
  #overlay h1 { margin: 0; font-size: 30px; color: #f2789a; letter-spacing: .04em; white-space: nowrap; }
  #overlay .myrec {
    margin: 2px 0 0; font-size: 12px; font-weight: 700; color: #e0799f;
    letter-spacing: .02em;
  }
  #overlay .myrec span { font-weight: 400; color: #b79aa8; }
  #overlay .sub2 { margin: -4px 0 2px; font-size: 12px; color: #d99ab4; letter-spacing: .1em; }
  #overlay p { margin: 0; font-size: 13px; line-height: 1.8; color: #8b7568; max-width: 340px; }
  #overlay .big { font-size: 44px; font-weight: 700; color: #f2789a; line-height: 1; }
  /* **字は 白では なく こい ワイン色。**（2026-09-19・作者が 4案から B を えらんだ）
     白字＋やわらかい ピンクは **1.9〜2.7:1** しか なく、
     明るい 屋外では いちばん 押して ほしい ボタンが いちばん 読めなかった。
     ピンクを 濃く する 案（C・D）も 作ったが、**やわらかい ピンクは この ゲームの 顔**
     なので、背景は 1px も 変えずに 字の 色だけ 落とす ことに した。
     `#6f0b27` は グラデーションの **こい ほうの 端（#f2789a）で 4.52:1**
     ── 上の 端では 6.41:1 なので どこを 切っても 足りて いる。
     **白字に 戻さない こと。** 戻すなら 背景も いっしょに 濃く する ひつようが ある。 */
  button.btn {
    font-family: inherit; font-size: 16px; font-weight: 700; color: #6f0b27;
    background: linear-gradient(180deg,#ffa3bf,#f2789a);
    border: none; border-radius: 999px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 4px 0 #d95d80; transition: transform .06s, box-shadow .06s;
  }
  button.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d95d80; }
  .btnrow { display: flex; gap: 8px; align-items: center; }
  button.btn.sub {
    background: linear-gradient(180deg,#fff,#f4e8ee);
    color: #7c655a; box-shadow: 0 4px 0 #d9c3cd; padding: 12px 22px; font-size: 14px;  /* 2.59 → 4.56 */
  }
  button.btn.sub:active { box-shadow: 0 1px 0 #d9c3cd; }
  button.btn.tiny { font-size: 11px; padding: 7px 16px; box-shadow: 0 3px 0 #d9c3cd; }
  /* **配慮の 設定そのものが いちばん 押しにくく いちばん 読めない**のは 本末転倒。
     もとは 11px・高さ23px・コントラスト 2.56:1 で、44px にも 4.5:1 にも 届いて いなかった。
     `user-scalable=no` で 拡大も できないので、ここで 足りて いる ひつようが ある。 */
  button.link {
    background: none; border: none; font-family: inherit;
    font-size: 13px; color: #8b7285; text-decoration: underline; cursor: pointer;
    padding: 11px 10px; min-height: 44px; line-height: 1.4;
  }
  #overlay .lead { font-size: 15px; line-height: 1.9; }
  #titleCv { width: 100%; max-width: 282px; height: auto; display: block; margin: -2px 0 -4px; }
  #overlay .howto { font-size: 11px; color: #a58e83; }
  #modes { display: flex; gap: 6px; }
  #overlay .modeinfo { font-size: 11px; color: #92687c; margin-top: -4px; }  /* 2.50 → 4.56 */
  /* **高さ 44px は 下げない こと。**（2026-09-19・第3回評価）
     もとは 12px＋上下7px＝**約32px** で、指の 目安 44px に 届いて いなかった。
     ここは「まめまるが 増える／増えない」を えらぶ ところで、
     **遊びかたを 決める いちばん 大事な 2択**なのに いちばん 小さかった。
     たての 予算は タイトルが いつも ぎりぎり なので（下の 縦予算の はなし）、
     `padding` では なく `min-height` ＋ `inline-flex` で のばす
     ── こうすると 文字は まんなかの まま、当たり判定 だけ 44px に なる。 */
  button.mode {
    font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    color: #94697e; background: rgba(255,255,255,.85);                       /* 2.53 → 4.53 */
    border: 2px solid #f0dfe6; border-radius: 999px; padding: 7px 14px;
    white-space: nowrap;
    min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
  }
  button.mode.on {
    color: #6f0b27; background: linear-gradient(180deg,#ffb3cd,#f78bad);   /* 2.7 → 5.28 */
    border-color: #f78bad; box-shadow: 0 3px 0 #dd6f92;
  }
  textarea { -webkit-user-select: text; user-select: text; }
  #save {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(120,95,110,.45); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #save.hidden { display: none; }
  #save .box {
    background: #fffafc; border: 3px solid #ffdfec; border-radius: 20px;
    padding: 16px 16px 14px; max-width: 340px; width: 100%;
    box-shadow: 0 12px 30px rgba(150,110,130,.35);
    display: flex; flex-direction: column; gap: 7px; text-align: center;
  }
  #save h2 { margin: 0; font-size: 16px; color: #f2789a; }
  #save p { margin: 0; font-size: 11px; line-height: 1.6; color: #8b7568; }
  #save textarea {
    /* 16px 未満だと iOS が かってに 拡大し、ピンチを止めているので もどせなくなる */
    width: 100%; font-family: monospace; font-size: 16px; resize: none;
    border: 2px solid #ffdfec; border-radius: 10px; padding: 7px; color: #6b5548;
    background: #fff;
  }
  #save .msg { min-height: 15px; font-weight: 700; color: #367f4a;
    border-radius: 10px; padding: 4px 8px; }
  /* **あいことばが 当たった しゅんかん、文の うしろを 1回 流す。**
     （2026-09-20・作者「今の表示の仕方だと気付かない」）
     もとは 文字が 入れかわるだけ で、目が コード欄に ある 人は 見のがして いた。
     にじ色を **よこに 1度 通す**だけ。点滅では ない ので
     `prefers-reduced-motion` でも こわく ない が、下で 念のため 止めて ある。
     **`background-size` を 100% に 戻さない こと** ── 動かす には 幅が いる。 */
  #save .msg.hit {
    color: #2f6b40;
    background-image: linear-gradient(100deg,
      rgba(255,255,255,0) 0%,   #fff3b0 18%, #ffd1e3 34%,
      #cfe9ff 50%, #d8f6d8 66%, rgba(255,255,255,0) 84%);
    background-size: 260% 100%;
    animation: msgHit 1.25s ease-out 1;
  }
  @keyframes msgHit {
    0%   { background-position: 130% 0; transform: scale(1);    }
    18%  {                               transform: scale(1.06); }
    100% { background-position: -60% 0; transform: scale(1);    }
  }
  @media (prefers-reduced-motion: reduce){
    #save .msg.hit { animation-duration: .01s; background-image: none; }
  }
  #missions { width: 100%; max-width: var(--rowW, 430px); display: flex; gap: 6px; }
  /* **`min-width: 0` を 外さない こと。**（2026-09-19・実測で 発覚）
     flex の 子は 既定で `min-width: auto` ＝ **中身より 小さく ならない**。
     おだいの 文が 長い 回（「ユニコーンを 11回見送る」など）に カードが ふくらみ、
     320px では 行から **「やめる」が 押し出されて いた**
     （カード 115 → 142.7px、行が はみ出す）。
     0 に すると カードは ちぢみ、文は … で 切れる ── 切れるのは
     べつの 話（下の「おだいの 文が 入るか」）だが、**押し出しは 起きなく なる**。 */
  .ms {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,.72); border: 2px solid #fff;
    border-radius: 14px; padding: 5px 9px 6px;
    box-shadow: 0 2px 0 rgba(190,170,160,.25);
  }
  .ms .mt { font-size: 14px; font-weight: 700; color: #7a6154; line-height: 1.35; height: 38px; overflow: hidden; }
  .ms .mb { height: 7px; background: #f1e0e7; border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .ms .mb i { display: block; height: 100%; width: 0%; border-radius: 4px;
              background: linear-gradient(90deg,#ffcf7a,#f2789a); transition: width .25s; }
  .ms.done { animation: msPop .55s ease-out; }
  .ms.clear { background: #e9fbee; border-color: #bfeecd; }
  .ms.clear .mt { color: #367f4a; }                  /* 2.93 → 4.54 */
  .ms.clear .mb i { background: linear-gradient(90deg,#8fdca4,#4fbf72); }
  @keyframes msPop {
    0%   { transform: scale(1); background: rgba(255,255,255,.72); }
    35%  { transform: scale(1.1); background: #fff2c2; }
    100% { transform: scale(1); background: rgba(255,255,255,.72); }
  }
  /* **`right: 0` に 戻さない こと。**（2026-09-19）
     #stage を 画面いっぱいに ひろげた ので、left/right 0 だと
     **ばんめん＋しんかの図 の まんなか**に 出る ＝ ばんめんから 見ると 右に ずれる。
     `--boardW`（ばんめんの 実はば）は fitCanvas が 入れる。 */
  #toast {
    position: absolute; left: 0; right: auto; width: var(--boardW, 100%);
    bottom: 7%; text-align: center;
    pointer-events: none; opacity: 0; transform: translateY(10px);
    transition: opacity .25s, transform .25s; z-index: 4;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast .in {
    display: inline-block; background: rgba(255,255,255,.95);
    border: 3px solid #ffd0e2; border-radius: 999px; padding: 7px 20px;
    font-size: 14px; font-weight: 700; color: #f2789a;
    box-shadow: 0 6px 16px rgba(190,150,170,.32);
  }
  #toast .sub { display: block; font-size: 10px; color: #a58e83; font-weight: 400; margin-top: 1px; }
  #chain { width: 100%; max-width: var(--rowW, 430px); margin: 2px 0; }
  #chain canvas { width: 100%; height: auto; display: block; }
  /* ばんめんと 同じ はば(430px)で 折りかえす。
     max-width を つけないと、ひろい画面で 文が 一行に のびて
     **パネルの 左右に はみ出す**（#chain と 同じ しばりに そろえて ある）。 */
  /* 隠しコマンドの ひとこと。ふだんは hidden なので たての 予算を 食わない。 */
  #overlay p.petMsg { font-size: 11px; color: #b98ac4; margin: -2px 0 0; }
  /* 称号の ごほうび。**なでる の ひとこと（petMsg）とは べつの 場所**に する。
     petMsg は 絵の すぐ下＝なでた子の 反応を 出す ところ。
     こちらは「よみこみの はこに 入れて」と 言う ので、
     **その ボタンの すぐ上**に 置く。つかう場所の となりで 言うのが いちばん 効く。 */
  #overlay p.hintMsg {
    /* **字の 色は #c4568a では ない。** あれは #fff2f7 の 上で 3.82:1 しか なく、
       設計判断6-E'(c) で 決めた「小さい字は 4.5:1」を 満たして いなかった
       （2026-09-22 に 気づいて 直した。背景の ピンクは 1px も 変えて いない）。 */
    font-size: 12.5px; color: #9B2F62; margin: 6px 0 2px;
    background: #fff2f7; border: 1px solid #ffd9e7;
    border-radius: 999px; padding: 6px 14px; line-height: 1.5;
  }

  /* **にじいろ中の 知らせ。** しりとりの 並びの ときだけ 出る ので、
     ふだんは たての 予算を 1px も 食わない（タイトルの たては いつも 足りて いない）。
     **点滅させない こと**（光過敏）。にじは 枠の 線だけ、字は こい ワイン。
     #9B2F62 は この 背景で 6.49:1。

     **2行に しない こと。** さいしょ 12.5px で 本文＋そえ字の 2行に して いたが、
     行の 高さが 49px に なり、**iPhone SE3 の Safari（375x553）で
     「始める」が 画面の 外（569px）に 押し出された**（実測）。
     いちばん きびしいのは そこで、余裕は **49px しか ない**。
     いまは 1行・約32px。文を 足したく なったら、まず そこを 測りなおす こと。 */
  #overlay p.rainbowMsg {
    font-size: 11.5px; color: #9B2F62; margin: 4px 0 2px;
    background: #fff4fa; border: 1px solid transparent;
    border-radius: 999px; padding: 4px 10px; line-height: 1.4;
    background-image:
      linear-gradient(#fff4fa, #fff4fa),
      linear-gradient(90deg,#ffc7da,#ffdfb4,#d8edb9,#bfe0f5,#dccdf2,#ffc7da);
    background-origin: border-box;
    background-clip: padding-box, border-box;
  }

  /* 1回 遊んだ あとだけ 出る ひとこと。えらび画面を 最初に 出さない かわり。 */
  #overlay p.pickHint { font-size: 11px; color: #e08aa8; margin-top: -4px; }

  /* けしきの 図鑑。**たての 予算を 食わない こと**（ここは いつも 足りて いない）。
     ぜんぶで 22px。せまい 画面では さらに 縮める。 */
  #overlay .dex { display: flex; align-items: center; justify-content: center;
    gap: 4px; flex-wrap: wrap; margin: -2px 0 0; }
  #overlay .dex .lb { font-size: 10px; color: #b79aa8; letter-spacing: .04em;
    margin-right: 2px; white-space: nowrap; }
  #overlay .dex i { display: block; width: 14px; height: 14px; border-radius: 4px; }
  #overlay .dex i.no { background: none; border: 1px dashed #dcc4cf; }
  #overlay .dex .lb.nw { color: #d9a23c; font-weight: 700; font-size: 10.5px; }
  /* けっか画面は もともと いちばん 混む ところ。**あたらしい けしきの 回だけ** 出る
     ので 常設では ないが、それでも ひとまわり 小さく して 点数を うずめない。 */
  #overlay.result .dex { margin: -2px 0 -1px; gap: 3px; }
  #overlay.result .dex i { width: 11px; height: 11px; border-radius: 3px; }
  @media (max-height: 700px){
    #overlay .dex i { width: 11px; height: 11px; border-radius: 3px; }
    #overlay .dex .lb { font-size: 9px; }
  }

  /* タイトルに **よこに ながい 文**を 足す ときは かならず これを つけること。
     `#overlay` は 画面ぜんたいに ひろがる ので、max-width が ないと
     ひろい画面で 文が 一行に のびて **パネルの 左右に はみ出す**。
     消した #foot で じっさいに 598px まで のびた（パネルは 430px）。 */
  #overlay .wide { width: 100%; max-width: 430px; box-sizing: border-box; }

  /* せまい画面では ゲーム画面を ゆうせん */
  @media (max-height: 900px){
    .card .val { font-size: clamp(20px, 6.6vw, 28px); }
    .card .val.long { font-size: clamp(15px, 4.8vw, 21px); }
    .card .lbl { font-size: 10px; }
    .card { padding: 3px 5px; }
    .ms .mt { font-size: 12px; height: 32px; }
    .ms { padding: 4px 7px 5px; }
    #wrap { gap: 4px; }
  }
  @media (max-height: 780px){
    /* **`.card .sub { display: none }` を ここに 戻さない こと。**（2026-09-19）
       もとは たての 予算を かせぐ ため わざと 消して いた ルールで、
       320x568 では 「今 N人」「最高 N」が **1度も 出て いなかった**。
       帯（#risebar）を 消して たてに 余裕が できた ので 出す ように した。
       ゆかした（SKIRT=80）を 入れた あとでも まだ 収まる ことは 測って ある。
       もし また たてが 足りなく なったら、ここを 消すのでは なく
       SKIRT を 減らす こと ── 数字は 毎回 見る ものだが、
       ゆかしたは 9秒に 1回 しか つかわない。 */
    .card .sub { font-size: 9px; }
    #overlay .lead { font-size: 13px; line-height: 1.7; }
    #overlay h1 { font-size: 25px; }
    #titleCv { max-width: 220px; }
  }
  /* iPhone SE など たてが みじかい 機種 */
  @media (max-height: 700px){
    #wrap { gap: 3px; padding-top: calc(3px + env(safe-area-inset-top)); }
    .card .val { font-size: 22px; }
    .card .val.long { font-size: 16px; }
    .card .lbl { font-size: 9px; letter-spacing: 0; }
    .card { padding: 2px 4px; border-width: 2px; }
    .card.next, .card.keep { flex: 0 0 58px; }
    .card.next canvas, .card.keep canvas { height: 26px; }
    /* **よこの あき 7 → 3、カード間の すきま 6 → 4。**
       行を ばんめんに そろえた ぶん カードが 17px せまく なり、
       いちばん 長い おだい「ユニコーンを 14回見送る」(11px で **126px**) が
       入らなく なった。あきを 削れば **たてを 1px も 使わずに** 戻せる。
       375x553 で カードの 中は 130px ── ここが **いちばん ぎりぎりの ところ**。
       字を 大きく する・あきを 戻す・行を せまく する の どれかを する ときは、
       かならず おだい 176とおりを 測りなおす こと。 */
    .ms { padding: 3px 3px 4px; border-radius: 11px; }
    #missions { gap: 4px; }
    .ms .mt {
      font-size: 11px; height: 15px; line-height: 15px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ms .mb { height: 5px; margin-top: 2px; }
    /* **ここに `#hud #sound { font-size: … }` を 書かない こと。**（2026-09-22）
       この `@media` は `#hud #sound` の 本体より **前**に ある ので、
       同じ つよさでは あとの ほうが 勝ち、書いても 効かない
       （`.card.lv` で 一度 やった 失敗と まったく 同じ 形）。
       そもそも 30px は いちばん せまい カード（52px＝中身44px）でも
       入る ことを 測って あるので、端末ごとに 変える 必要が ない。 */
  }

  /* **320px の 端末では おだいを 2行に する。**（2026-09-19・実測）
     1行＋… に して いた ころ、320x454（iPhone SE 初代 の Safari）で
     **92とおり 中 46件が 切れて いた**。しかも 切れるのは 文の おしり ＝
     **「見送る」「作る」「並べる」という いちばん 大事な 動詞**。
     「ユニコーンを 11回…」では 何を するのか 分からない。
     2行に すると 切れるのは **0件**。代償は おだいの行が 33 → 48px、
     ばんめんが **217.7 → 208.1px（−4.4%）**。
     **切れる ほうが 悪い**と 見て 2行に した。戻すなら この かたまりを 消すだけ。
     375px（SE3）いじょうは 1行の まま ── そちらは 194とおり ぜんぶ 入って いる。 */
  @media (max-width: 340px){
    .ms .mt { white-space: normal; height: 30px; }
  }
  .card.next, .card.keep { flex: 0 0 68px; padding: 4px 4px 3px; }
  .card.next canvas, .card.keep canvas { width: 100%; height: 34px; display: block; }
  .card.keep { cursor: pointer; border-color: #ffe3ef; }
  .card.keep:active { transform: translateY(2px); }
  .card.keep.used { opacity: .45; }
  .card.keep.ready { border-color: #ffb0cd; background: rgba(255,244,249,.9); }
  .card .lbl.k { color: #d1396c; }                   /* 2.74 → 4.51 */
  /* 預ける の あとに 入った Lv⭐＋やめる の カード */
  .card.lv {
    flex: 0 0 68px; padding: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }
  /* **`.card.lv .lbl` では なく `#lvCard .lbl`。**（2026-09-22）
     連鎖の カードも `.card.lv`（はばを 68px に する ため）を つけて いる ので、
     ここを `.card.lv` で 書くと **連鎖の ラベルまで ピンクの 太字**に なる。
     連鎖は 見送った・スコアと 同じ 見た目に そろえた ので、外して ある。 */
  #lvCard .lbl {
    font-size: 12px; font-weight: 700; color: #d1396c;   /* 2.74 → 4.51 */
    white-space: nowrap; line-height: 1.25;
  }
  /* 連鎖の 数字は ふつうの カードと 同じ `.val`。色だけ ピンクに する。 */
  #chainCard .val { color: #d1396c; }                    /* 大きい字 なので 3:1 で よい（4.51） */
  .card.lv #riseStamp { font-size: 11px; }
  /* **この かたまりは `.card.lv` の 本体より あとに 置く こと。**（2026-09-20）
     おなじ 指定が 上の `@media (max-height:700px)` の 中にも あったが、
     **本体の ほうが あとに 書いてあって ずっと 効いて いなかった**
     （実測：せまい 端末でも 68px の まま）。CSS は 同じ つよさなら あとが 勝つ。
     52px に するのは、320px の 端末で Lv と 連鎖の 2枚が 68px ずつ あると
     のこりが 51px しか なく **「見送った」が 2行に 折れる** ため（実測）。 */
  @media (max-height: 700px){
    .card.lv { flex: 0 0 52px; padding: 3px 2px; }
    #lvCard .lbl { font-size: 11px; }
    .card.lv #riseStamp { font-size: 10px; }
    /* **`#chainCard .lbl` の 上書きは 置かない こと。**（2026-09-22）
       連鎖の ラベルは 見送った・スコアと 同じ `.card .lbl`（ここでは 9px）に
       したい。id で 書くと そちらが 勝って しまい、1枚だけ 字が 大きく なる。 */
  }
  /* **やめる は 進化の図の 上。**（2026-09-20・作者）
     おだいの 行に たて2段で 積んで いた ころは 13〜24px に しか ならず
     **指で 押せなかった**（せまい 端末では 行を のばすと ばんめんを 削る：
     48px に のばして 375x553 の ばんめんが 281.5 → 271.8px、
     44px×2 まで のばすと **画面から はみ出した**）。
     図の ほうは たてに よゆうが ある ので、上を 26px（ボタン22＋すきま4）
     詰めて そこに 置く。**ばんめんは 1px も 削らない。**
     **`display:none` では なく `visibility`。** 消して しまうと
     タイトル画面で 図が 26px 上に ずれて、ばんめんの 下端と そろわなく なる。 */
  #giveUp {
    visibility: hidden;
    width: var(--ladW, 46px); height: var(--quitH, 22px); box-sizing: border-box;
    font-family: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0;
    color: #92687c; background: rgba(255,255,255,.80); border: 2px solid #fff;  /* 2.48 → 4.52 */
    border-radius: 11px; padding: 0 1px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 0 rgba(190,170,160,.25);
    display: flex; align-items: center; justify-content: center;
  }
  /* **たしかめの 字は 3文字まで。**（2026-09-20）
     はばを 図に そろえた ので 中は 27〜32px しか ない。
     「本当に？」（4文字＝36px）は はみ出す ので「本当？」に した。
     ここを 4文字に 戻す なら はばの ほうを 考えなおす こと。 */
  #giveUp.arm { color: #b8365c; background: #fff0f4; border-color: #ffd0de; }
  /* たてに よゆうが できた ので 字を 1px 大きく。**320px では 9px の まま**
     ── あちらは ボタンの 中が 29px しか なく、10px の 3文字（30px）が 入らない。 */
  @media (min-width: 341px){ #giveUp { font-size: 10px; } }
  #wrap.playing #giveUp { visibility: visible; }
  #giveUp:active { transform: translateY(1px); box-shadow: none; }
  /* **🔊 は HUD の いちばん みぎ**（2026-09-22・作者）。
     `.card.lv` を つけて あるので はば（68／52px）と 枠は カードと 同じ。
     ここだけ 中身を まんなかに する（ほかの カードは ラベルが 上）。 */
  /* **`#hud #sound` と id を 2つ 書く こと。**（2026-09-22）
     `#sound` だけだと `#hud .card`（id＋class）の ほうが つよく、
     `justify-content: flex-start` が 勝って **絵が カードの 上に はりついて いた**。
     ほかの カードは ラベルが 上に 来るのが 正しい ので、
     `#hud .card` の ほうは 変えない。ここだけ 上書きする。 */
  #hud #sound {
    font: inherit; line-height: 1; cursor: pointer;
    justify-content: center; align-items: center;
    padding: 2px;
    /* 絵を カードいっぱいに。**1つの 大きさで ぜんぶの 端末に 入る。**
       いちばん せまい カードは 52px（中身 52 − 枠4 − padding4 ＝ 44px）で、
       30px の 絵は 実測 37px。5サイズ 測って どこでも はみ出さず、
       まんなかからの ずれも よこ0・たて0。端末ごとに 変えない こと。 */
    font-size: 30px;
  }
  #sound:active { transform: translateY(2px); box-shadow: none; }

  /* **おだいの 行に 入った Lv⭐。**（2026-09-22）
     はばは `--ladW` ＝ 進化の図と おなじ で、端末に よっては **37px しか ない**。
     HUD に いた ころの 12px だと `Lv.12` が 36px に なって ふちに つく ので、
     ここでは 10px に する（`Lv.99` で 実測 30px）。
     **1行に まとめない こと**（設計判断は HTML の コメント）。 */
  /* **たての padding は 0。** 2px 入れて いた ころ、枠(2+2)＋中身(26)＋padding(4)＝34px に
     なって、**おだいの 行が 33 → 34px に ふとり、ばんめんが 282 → 281px に 減った**（実測）。
     この 行は ばんめんの たての 予算を そのまま 食う ので、1px も ふとらせない こと。 */
  #missions #lvCard {
    flex: 0 0 var(--ladW, 46px); align-self: stretch; padding: 0 2px;
    justify-content: center;
  }
  #missions #lvCard .lbl { font-size: 10px; line-height: 1.3; }
  #missions #lvCard #riseStamp { font-size: 10px; }
  
  /* ===== キャラ選択UI =====
     #overlay の 中に 入れると、flex の つぶれで 文字が カードに
     かさなる。ここは わざと 独立した レイヤー＋ふつうの ブロック積み。
     flex / aspect-ratio を ここに 戻さないこと。 */
  #charSelectOverlay {
    position: fixed; inset: 0; z-index: 18;
    background: linear-gradient(180deg,#fff2f7 0%,#f3f8ff 60%,#fff8ee 100%);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(18px + env(safe-area-inset-top)) 14px
             calc(22px + env(safe-area-inset-bottom));
  }
  #charSelectOverlay .cs-inner {
    max-width: 430px; margin: 0 auto; text-align: center;
  }
  #charSelectOverlay h2 {
    margin: 0 0 4px; font-size: 18px; color: #f2789a; font-weight: 700;
  }
  #charSelectOverlay .hint {
    margin: 0 0 12px; font-size: 12px; color: #a58e83;
  }
  #charGrid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .charCard {
    background: rgba(255,255,255,.85);
    border: 3px solid #fff; border-radius: 14px;
    padding: 10px 6px 8px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(190,170,160,.25);
    position: relative; transition: background .12s, border-color .12s;
  }
  .charCard:active { transform: translateY(2px); box-shadow: none; }
  .charCard canvas {
    display: block; margin: 0 auto;
    width: 64px; height: 64px;          /* px 固定。% にしないこと */
  }
  .charCard .name {
    margin-top: 6px; font-size: 11px; font-weight: 700; color: #7a6154;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .charCard.selected {
    background: linear-gradient(135deg,#ffb3cd,#f78bad);
    border-color: #f78bad; box-shadow: 0 4px 0 #dd6f92;
  }
  .charCard.selected .name { color: #fff; }
  .charCard .checkmark {
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px; background: #fff; border-radius: 50%;
    line-height: 20px; text-align: center;
    font-size: 13px; font-weight: 700; color: #f2789a;
    display: none;
  }
  .charCard.selected .checkmark { display: block; }
  #charOrder {
    margin: 14px auto 0; min-height: 54px;
    background: rgba(255,255,255,.7); border: 2px solid #fff;
    border-radius: 14px; padding: 7px 8px;
  }
  #charOrder .ttl { font-size: 10px; color: #a58e83; margin-bottom: 3px; }
  #charOrder .row {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 3px; flex-wrap: nowrap;
  }
  #charOrder .slot { text-align: center; }
  #charOrder .slot .nm {
    font-size: 9px; color: #7a6154; margin-top: 1px;
    white-space: nowrap;
  }
  #charOrder .arw { font-size: 10px; color: #d9b7c4; padding-bottom: 12px; }
  #charOrder .empty { font-size: 11px; color: #c4aeb8; padding: 12px 0; }
  /* あいことばで 手に 入れた 子。ふつうの子と 見わけが つくように */
  .charCard.secretCard { box-shadow: 0 0 0 2px #ffd9a8, 0 3px 10px rgba(210,160,90,.28); }
  .charCard.secretCard .name::after { content: " ✨"; }
  /* まだ 遊んで いない子。**ひだり上**に 小さな しるし
     （みぎ上は えらんだ ときの チェックが つかう）。
     えらぶと カードが ピンクに なるので、その ときは 白に する。 */
  .charCard.newChar::before {
    content: ""; position: absolute; top: 6px; left: 6px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #f2789a; box-shadow: 0 0 0 2px #fff;
  }
  .charCard.newChar.selected::before { background: #fff; box-shadow: 0 0 0 2px #f78bad; }
  /* 隠しコマンド「しりとり」が そろった ときだけ */
  #charOrder.shiritori {
    background: linear-gradient(135deg,#fff4fb,#f3f8ff 40%,#fffaf0);
    border-color: #ffd9ee;
    box-shadow: 0 0 0 3px rgba(255,190,225,.45), 0 6px 18px rgba(200,150,190,.25);
  }
  #charOrder.shiritori .ttl { color: #e0699c; font-weight: 700; font-size: 11px; }
  #charOrder .sh { font-size: 10px; color: #b98ac4; margin-top: 5px; }

const wrapEl = document.getElementById("wrap");
function fitCanvas(){
  // まわりの UI の じっさいの 高さを はかって、のこりに キャンバスを おさめる
  let used = 0;
  for (const el2 of wrapEl.children){
    if (el2.id === "stage") continue;
    // position:fixed / absolute で うかせている レイヤーは ながれの外。
    // かぞえると 画面ぶんの 高さが 引かれて キャンバスが つぶれる。
    const pos = getComputedStyle(el2).position;
    if (pos === "fixed" || pos === "absolute") continue;
    used += el2.getBoundingClientRect().height + 6;
  }
  const cs = getComputedStyle(wrapEl);
  const padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const padH = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const availH = Math.max(120, wrapEl.clientHeight - used - padV - 4);
  // みぎの しんかの図（LAD_W）と すきま 6px の ぶんを ひいて から わりつける。
  // ばんめんの CW/CH は さわらない（＝物理も スコアも 一切 変わらない）。
  // 変わるのは 画面に うつる 大きさ だけ。
  const availW = Math.max(120, wrapEl.clientWidth - padH - 6);
  /* **すそは「タダで 入る ぶんだけ」に する。**（2026-09-19・実機で 直した）
     80 決め打ちに して いた ころ、**ブラウザの アドレスバーを 数えて いなかった**。
     じっさいの iPhone SE3 の Safari は たて 553px（画面は 667px）しか なく、
     ばんめんが **たてで きまる**側に 落ちて 262px まで 縮んで いた。
     ここで「はばで きまる ままで いられる いちばん 大きい すそ」を えらべば、
     たてに よゆうの ある 端末は 80、足りない 端末は けずって 盤面を 守れる。 */
  const sW = availW / (CW + LAD_W);
  SKIRT = Math.round(Math.min(SKIRT_MAX, Math.max(SKIRT_MIN, availH / sW - CH)));
  // **数に ならなかった ときは いちばん 大きい ぶんに 倒す。**
  // `Math.max(120, NaN)` は NaN を かえす ので、はばや 高さが 取れない ところ
  // （DOM を にせもので 置きかえた 道具の 中など）では availW/availH が NaN に なり、
  // SKIRT ごと NaN に なって **えがく 命令が ぜんぶ 落ちる**（実際そうなった）。
  if (!isFinite(SKIRT)) SKIRT = SKIRT_MAX;
  const CH2 = CH + SKIRT;                // すその ぶんだけ 絵を 高く する
  let scale = Math.min(availW / (CW + LAD_W), availH / CH2, 1.1);
  scale = Math.max(scale, .18);          // はみ出さないよう 下げきる
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = CW * dpr; cv.height = CH2 * dpr;
  cv.style.width = (CW * scale) + "px";
  cv.style.height = (CH2 * scale) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 上下の 行を ばんめん＋しんかの図 と 同じ はばに そろえる
  /* **上の行の はばは「ばんめん＋図」ちょうど。**（2026-09-20・作者の 実機写真
     「みぎはこんなにあくの？」）
     430px を 下限に して いた ころ、**ばんめんが たてで きまる 端末**
     （iPhone SE3 の Safari）では 上の行だけ 画面いっぱい(359px)に のびて、
     ばんめん＋図(325px)との あいだに **みぎだけ 34px 空いて いた**。
     ぴったりに すると `#wrap` の `align-items: center` が ぜんぶを まんなかに
     そろえる ので、左右 均等の あきに なる。
     **ばんめんは 1px も 変わらない**（大きさは もう 決まって いる）。

     下限 430px を 入れた もとの 理由は 2026-09-19 の
     「行が 303px に 縮んで 見送っ／た と 折れた」件 だが、
     あれは **そえ字（今◯人・最高）が あった ころ**の はなし。
     いまは カードが 減って いて、375x553 でも 折れない（実測）。
     **戻す ときは かならず おだい194とおりを 測りなおす こと。** */
  wrapEl.style.setProperty("--rowW", ((CW + LAD_W) * scale + 6).toFixed(1) + "px");
  wrapEl.style.setProperty("--boardW", (CW * scale).toFixed(1) + "px");
  /* **「やめる」と スピーカーの はばは 進化の図と おなじ。**（2026-09-20・作者）
     図の はばは 倍率で 変わる ので、CSS からは 変数で 見る。 */
  wrapEl.style.setProperty("--ladW", (LAD_W * scale).toFixed(1) + "px");
  /* **「やめる」の 高さは おだいの 行の みぎはしに ある ものの 実測。**
     そろえる 相手が 端末で 変わる ので、ここで はかって CSS 変数に 出す。
     `16〜64` に 丸めて あるのは、DOM を にせものに した 道具の なかで
     とんでもない 数が 返る ため（`Math.max(120, NaN)` の 罠と 同じ 系統）。
     **2026-09-22 に 相手が `#sound` から `#lvCard` に かわった。**
     スピーカーを HUD へ 移した ので、そのまま `#sound` を はかると
     **HUD の カードの 高さ（58px）が 入って、進化の図が 60px 近く 削られる**。
     ここを いじる ときは、**おだいの 行に いま 何が いるか**を 見ること。 */
  {
    const se = document.getElementById("lvCard");
    let qh = 22;
    if (se){
      const hh = se.getBoundingClientRect().height;
      if (isFinite(hh) && hh > 0) qh = Math.round(Math.max(16, Math.min(64, hh)));
    }
    wrapEl.style.setProperty("--quitH", qh + "px");
    GIVEUP_CSS = qh + GIVEUP_GAP;
  }
  /* **図は「やめる」の ぶんだけ 上を 詰める。**
     倍率で わって キャンバスの ものさしに 直す ので、
     **どの 端末でも 図の 下端は ばんめんの 下端と そろう**。 */
  LAD_H = Math.max(120, CH2 - GIVEUP_CSS / scale);
  initLadder(scale);
}

function chainPts(n, spread){
  // 4れんさ＝3てん から はじまる。
  // 前は 4れんさ＝1てん で、画面じゅうが 虹になって ファンファーレが 鳴るのに
  // みおくり1回（2てん）の 半分だった。演出と 報酬が さかさま だった。
  const k = n - CHAIN_MIN + 1;
  const w = (spread == null) ? 1 : (0.6 + 0.4 * Math.min(1, spread / (CW * 0.5)));
  return Math.max(1, Math.ceil((k*(k+3)/2 + 1) * w));
}

          return { id:"bear", need:n, prog:0, text:`${TIERS[0].name}を ${n}人並べる` }; },

function newMission(){

/* **やりかけの おだいは つぎの ゲームに 持ちこす（2026-09-17）。**
   もとは 毎ゲーム まるごと 作りなおして いて、「20人集める」が 18人で 終わっても
   **その18は 消えて いた**。「あと すこしだった」は もういちど 押させる
   いちばん つよい きもち なのに、ゲームが 自分で 捨てて いた。

   **持ちこせるのは 積みあげ型の 4つだけ。**
   `collect`（同時に 何人）と `bear`（同時に 何人 ならぶ）は **その瞬間の 盤面**を
   見て いて、`need` も つくる ときの 盤面から 決めて いる（`cur + 4`／`nb + 1`）ので
   持ちこしても 意味を なさない。`live` も その ゲームの 経過秒から 数える。

   **名前の 入った 文は かならず 作りなおす こと。** `pop` と `make` の text には
   `TIERS[...].name` が 焼きこまれて いる ので、あいだに 顔ぶれを 変えられると
   **いない子の 名前が のこる**（「ひよこを 11回見送る」が ひよこの いない 回に
   出て いた のと まったく 同じ 事故）。

   **進みが 0 の ものは 持ちこさない。** 毎回 おなじ おだいが 居すわると
   「まいかい ちがう」が 消える。持ちこすのは やりかけ だけ。 */
const MISSION_CARRY = ["pop", "make", "drop", "chain"];
/* **4つ ぜんぶ 作りなおす こと。** 名前の 入る pop/make だけで よかったのは
   「同じ セッションの なかで 持ちこす」あいだ だけ。
   リロードを またぐ ように なって、`text` を 持って いない 復元ぶん
   （drop / chain）も ここで 作る ひつようが できた。 */
function retextMission(m){
  if (m.id === "pop")   m.text = `${TIERS[LAST].name}を ${m.need}回見送る`;
  if (m.id === "make")  m.text = `${TIERS[m.tier].name}を ${m.need}人作る`;
  if (m.id === "drop")  m.text = `${m.need}回落とす`;
  if (m.id === "chain") m.text = `4連鎖以上を ${m.need}回出す`;
  return m;
}

/* やりかけの おだいを **リロードを またいで** 持ちこす。（2026-09-19）
   持ちこし じたいは 2026-09-17 に 入れたが **メモリの なかだけ**で、
   ホーム画面に もどる・タブを 切る・アプリを 落とす と 消えて いた。
   PWA は 裏に まわると いつでも 捨てられる ので、
   **「あと2人」で 中断した 人が いちばん 損を する** 形だった。

   **入って くる 値は 外から の もの**（人が さわれる ところに ある）なので、
   記録コードの ときと 同じ しつこさで 見る こと：
   数は `safeNum`、`id` は `MISSION_CARRY` に ある ものだけ、
   `tier` は 顔ぶれの 中に ある 番号だけ、`prog < need` の ものだけ。
   `text` は **保存しない**。かならず `retextMission` で 作りなおす
   ── 保存すると 顔ぶれを 変えた あとに いない子の 名前が のこる。 */
const CARRY_KEY = "mamemaru-carry";
let savedCarry = [];
function carryableNow(){
  return (missions || [])
    .filter(m => m && !m.done && m.prog > 0 && m.prog < m.need
                 && MISSION_CARRY.includes(m.id))
    .map(m => ({ id: m.id, tier: m.tier, need: m.need, prog: m.prog }));
}
function saveCarry(){
  try { localStorage.setItem(CARRY_KEY, JSON.stringify(carryableNow().slice(0, 2))); } catch(e){}
}
try {
  const a = JSON.parse(localStorage.getItem(CARRY_KEY) || "[]");
  if (Array.isArray(a)) savedCarry = a
    .filter(m => m && typeof m === "object" && MISSION_CARRY.includes(m.id))
    .map(m => {
      const o = { id: m.id, need: safeNum(m.need), prog: safeNum(m.prog),
                  done: false, doneT: 0, carried: true };
      if (o.id === "make"){
        const t = safeNum(m.tier);
        o.tier = (t >= 1 && t <= 5) ? t : 1;
      }
      return o;
    })
    .filter(m => m.need > 0 && m.prog > 0 && m.prog < m.need)
    .slice(0, 2);
} catch(e){}
/* 結果画面に 出す「いちばん おしい おだい」。なければ null。

   **「おしい」の しきい値**（2026-09-19・第3回評価の 指摘）
   もとは **やりかけなら 何でも 出して いた**。実測（64ゲーム）：
   72% の ゲームで 出て、いちばん おしい のこりは 中央値 5 だが **最大 42**。
   「80回落とす」が 38回で 終わると **「あと 42」**と 出て いた
   ── これは おしくない。おしい と 言われ慣れると、
   ほんとうに あと1つの ときの 「あと 1」まで 効かなく なる。

   | ルール | 出る ゲームの わりあい |
   |---|---|
   | やりかけなら 必ず（もと） | 72% |
   | のこり ≤ 半分 かつ ≤10 | 31% |
   | **のこり ≤ 3分の1 かつ ≤10** | **17%** |

   3分の1 に したのは、`drop`（45〜80回）で 「あと 26」まで 通って しまうのを
   10 の 上限で 止める ため。**どちらか 片方では 足りない**
   ── わりあいだけだと drop が ゆるく、数だけだと `chain`（3回中 あと2）が 通る。

   **2026-09-20：数も おだい名も 出さない ことに した**（作者の 判断）。
   「あと N で ⭐が1つ ふえる（◯◯）」まで 書いて みた けっか、
   **結果画面で いちばん こまかい 行が いちばん 長く なって しまった**。
   いまは `nearestMission()` は **出すか 出さないかの 判定にだけ つかう**
   ── おしい ときだけ「お題の達成状況は 次のゲームに続きます」の 1行が 出る。
   しきい値を のこして あるのは、**やりかけが 何も ない ときに
   この 1行を 出さない** ため。 */
function nearestMission(){
  let top = null;
  for (const m of missions){
    if (!m || m.done || m.prog <= 0 || !MISSION_CARRY.includes(m.id)) continue;
    const left = m.need - m.prog;
    if (left <= 0) continue;
    if (left > Math.ceil(m.need / 3) || left > 10) continue;   // おしい ものだけ
    if (!top || left < top.left) top = { left, text: m.text };
  }
  return top;
}
function resetMissions(){
  let keep = missions.filter(m => m && !m.done && m.prog > 0
                                   && MISSION_CARRY.includes(m.id))
                     .map(m => { m.carried = true; return retextMission(m); });
  // メモリに 何も ない とき（＝読みこんだ 直後）だけ 保存ぶんを つかう
  if (!keep.length && savedCarry.length){
    keep = savedCarry.map(retextMission);
    savedCarry = [];
  }
  missions = keep.slice(0, 2); stamps = 0;
  while (missions.length < 2) missions.push(newMission());
  renderMissions();
}
function renderMissions(){
  msEls.forEach((el, i) => {
    const m = missions[i];
    if (!m) return;
    if (m.done){
      el.classList.add("clear");
      el.querySelector(".mt").textContent = "✓ " + m.text;
      el.querySelector(".mb i").style.width = "100%";
    } else {
      el.classList.remove("clear");
      el.querySelector(".mt").textContent = m.text;
      const p = Math.min(1, m.prog / m.need);
      el.querySelector(".mb i").style.width = (p*100).toFixed(0) + "%";
    }
  });
}
function completeMission(i){
  const m = missions[i];
  if (m.done) return;
  m.done = true;
  m.doneT = 1.5;                     // クリア表示を みせる じかん
  stamps++;
  // ごほうび：せりあがりが おそくなる。
  // riseT が すでに いっぱいだと 0びょうに なってしまうので、その ときは ゆかを 1だん さげる
  const room = riseSpan - riseT;
  if (room >= 1){
    riseT = Math.min(riseSpan, riseT + 3);
  } else if (floorY < FLOOR0){
    floorY = Math.min(FLOOR0, floorY + RISE_STEP);
  } else {
    stamps++;                                 // どちらも できない ときは ⭐を もう1こ
  }
  const el = msEls[i];
  el.classList.remove("done"); void el.offsetWidth; el.classList.add("done");
  showToast("お題クリア！ ⭐" + stamps, m.text + " ／ せり上がりが少し遅くなった");
  for (let k = 0; k < 3; k++)
    setTimeout(() => burst(rnd(60, CW-60), rnd(150, 300), pick(["#ffd86b","#ff9ec4","#9fe0ff"]), 16, 1.5), k*90);
  flash(.22);
  for (const b of balls) makeSmile(b, rnd(1.5, 2.2));
  if (held) makeSmile(held, 1.8);
  [660, 880, 1046, 1318].forEach((f, k) =>
    setTimeout(() => beep(f, .15, "triangle", .11), k*70));
  renderMissions();
}
let toastT = null;
function showToast(main, sub){
  toastEl.querySelector(".in").innerHTML = main + '<span class="sub">' + sub + '</span>';
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove("show"), 1800);
}
function bumpMission(id, tier){
  for (let i = 0; i < missions.length; i++){
    const m = missions[i];
    if (!m || m.done || m.id !== id) continue;
    if (id === "make" && m.tier !== tier) continue;
    m.prog++;
    if (m.prog >= m.need) completeMission(i);
  }
}
function raiseMission(id, v){
  for (let i = 0; i < missions.length; i++){
    const m = missions[i];
    if (!m || m.done || m.id !== id) continue;
    if (v > m.prog) m.prog = v;
    if (m.prog >= m.need) completeMission(i);
  }
}

function newBall(tier, x, y, vx, vy){
  const t = TIERS[tier];

/* つぎに せりあがる 列を さきに つくっておく（よこく用） */
let nextRow = null;
function makeRow(){
  const row = [];
  let x = 0, last = -1;
  for (let guard = 0; guard < 40; guard++){
    let t, tries = 0;
    do { t = pick(RISE_ROW); tries++; } while (t === last && tries < 10);
    const r = TIERS[t].r;
    if (x + r*2 > (WALL_R - WALL_L)) break;
    row.push({ t, x: x + r });
    x += r*2;
    last = t;
  }
  let h = 0;
  for (const o of row) h = Math.max(h, TIERS[o.t].r * 2);
  return { items: row, w: x, h, off: WALL_L + ((WALL_R - WALL_L) - x) / 2 };
}

/* 下から一列せりあがる */
function riseRow(){
  if (!nextRow) nextRow = makeRow();
  const R = nextRow;
  const row = R.items, off = R.off, h = R.h;
  if (!row.length) return;

  // ゆかは かならず せりあがる（もどらない）
  floorY = Math.max(FLOOR_MIN, floorY - RISE_STEP);

  if (spawnRows) for (const b of balls){ b.y -= h; b.py -= h; }
  /* **ここから 下は えがき方 だけの はなし。**
     ボールの y は 上で もう 確定して いる（＝物理・スコア・決着は 前と 同じ）。
     `liftH` / `b.lift` は 「さっきまで いた ばしょ」で、0.55秒 かけて 0 に なる。
     これが ないと **盤面の子 ぜんぶが 1フレームで h（72〜128px）飛ぶ** ので
     「ポンっと 出た」に 見える（作者の 指摘）。 */
  if (spawnRows){ liftH = h; liftT = LIFT_SEC; }
  if (spawnRows) for (const o of row){
    const nb = newBall(o.t, off + o.x, floorY - TIERS[o.t].r);
    nb.age = 1.2;
    nb.sqv = -0.4;
    // すその よこく（`drawUnderFloor`）が 止まって いた ばしょ＝ゆかの すぐ下から つづける。
    // 自分の 直径ぶん 上がれば 定位置。**ここを 2r から 変えると よこくと 絵が とぶ。**
    nb.lift = TIERS[o.t].r * 2;
    balls.push(nb);
  }
  for (const b of balls)
    makeShock(b, Math.max(0, Math.min(.45, (floorY - b.y) / 950)), rnd(1.0, 1.35), 2);
  if (held) makeShock(held, .3, 1.1, 2);
  uiShock(.3, 1.15);

  if (spawnRows){ nextRow = makeRow(); drawRisePreview(); }

  riseGlow = RISE_GLOW_T;
  // ゆかの下から のぼる こな
  for (let i = 0; i < 22; i++){
    fx.push({ t:"st", x: rnd(WALL_L, WALL_R), y: rnd(floorY + 4, CH),
              vx: rnd(-40, 40), vy: rnd(-260, -90),
              rot: rnd(0,6.3), rotv: rnd(-7,7), s: rnd(3,8),
              life: rnd(.4,.85), age:0,
              c: pick(["#FFFFFF","#FFF3A8","#CFF0FF"]) });
  }

  rises++;
  riseBonusUsed = 0;
  shake = Math.max(shake, 4);
  beep(150, .2, "square", .06);
  setTimeout(() => beep(230, .16, "square", .05), 90);
  for (let i = 0; i < 5; i++) burst(rnd(WALL_L, WALL_R), floorY - rnd(0, 20), "#ffffff", 3, .7);
}

  elScore.classList.toggle("long", elScore.textContent.length >= 4);

let AC = null, soundOn = true;
// **おとの ON/OFF は おぼえる。** おぼえないと 起動の たびに 音が 出る 状態に もどり、
// 電車でも 寝かしつけでも 毎回 鳴る。無音で 遊ぶ人は 少なく ない。
try { soundOn = localStorage.getItem("mamemaru-sound") !== "0"; } catch(e){}
const sBtn = document.getElementById("sound");
// **おぼえた 値を ボタンの 見た目にも 反映する。**
// 中身（`soundOn`）だけ 直して 絵文字を そのままに して いた ため、
// 読みこんだ あと **「🔊 なのに 鳴らない」** に なって いた（実測）。
sBtn.textContent = soundOn ? "🔊" : "🔇";
sBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  soundOn = !soundOn;
  try { localStorage.setItem("mamemaru-sound", soundOn ? "1" : "0"); } catch(e){}
  sBtn.textContent = soundOn ? "🔊" : "🔇";
});
function beep(freq, dur, type, vol, slide){
  if (!soundOn) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    // **できたての AudioContext は とまって いる。** ブラウザは 指で さわるまで
    // 音を 鳴らさせない ので、`start()` の resume だけに たよると
    // **タイトル画面の 音が ぜんぶ 無音**に なる（なでる音・ファンファーレ）。
    // ここで 起こす。指で さわった ながれの 中で よばれる ので 起きられる。
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, AC.currentTime);
    // **`slide` を 書かないと 完全5度 上に すべる。**
    // ぜんぶの 音が 上がって いて、**下がる 音が 1つも なかった**。
    // 「くっつくと 小さく なる」ゲームなのに 芯と 音が 逆を 向いて いた。
    // 小さく なる ところ（合体）と おわり（ゲームオーバー）は 下げる。
    o.frequency.exponentialRampToValueAtTime(freq * (slide || 1.5), AC.currentTime + dur);
    g.gain.setValueAtTime(vol || .12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + .02);
  } catch(e){}
}

/* ============================================================
   ぶつり
   ============================================================ */
let gravity = 2300;
const SUB = 4;
const ITER = 5;
const MU = 0.28;          // まさつ
const MERGE_PAD = 3.5;    // このくらい ちかづいたら「ふれた」とみなす
const CELL = TIERS[0].r * 2 + 4;
const GW = Math.ceil(CW / CELL) + 1;
const GH = Math.ceil(CH / CELL) + 1;
let grid = [];
let mergeQueue = [];

function buildGrid(){
  grid = new Array(GW*GH);
  for (let i = 0; i < grid.length; i++) grid[i] = null;
  for (const b of balls){
    if (b.dead) continue;
    const cx = Math.max(0, Math.min(GW-1, (b.x/CELL)|0));
    const cy = Math.max(0, Math.min(GH-1, (b.y/CELL)|0));
    const k = cy*GW + cx;
    if (!grid[k]) grid[k] = [];
    grid[k].push(b);
  }
}

function step(dt){
  // **dt が 0 に かぎりなく 近い ときは 何も しない こと。**
  // 下の `const inv = 1/h` が 発散して、速度が Infinity → NaN に なる。
  // おひるねで 時間の ながれを 0 に 落とした しゅんかん、これで
  // **盤面の 玉が 12個 まとめて NaN に なった**（2026-09-18 に 実測）。
  if (!(dt > 1e-5)) return;
  const h = dt / SUB;
  for (let s = 0; s < SUB; s++){
    for (const b of balls){
      if (b.dead) continue;
      b.px = b.x; b.py = b.y;
      b.vy += gravity * b.gm * h;
      b.x += b.vx * h;
      b.y += b.vy * h;
    }
    // 下から順に解くと山がくずれにくい
    balls.sort((p, q) => q.y - p.y);
    buildGrid();
    mergeQueue.length = 0;
    for (let it = 0; it < ITER; it++){
      resolvePairs(it === 0 && s === 0);
      resolveWalls();
    }
    const inv = 1/h;
    for (const b of balls){
      if (b.dead) continue;
      const ndx = b.x - b.px, ndy = b.y - b.py;
      const nvy = ndy * inv;
      if (b.vy > 420 && nvy < b.vy*0.35 && b.sqv > -0.15){
        b.sqv = -Math.min(b.vy/2200, .55);
        beepLand(b);
      }
      b.vx = Math.max(-2400, Math.min(2400, ndx * inv * 0.995));
      // 上むきは きつめに しめる。合体の おしだしで うちあげられるのを ふせぐ
      b.vy = Math.max(-700, Math.min(2600, nvy * 0.995));
      b.va = b.va*0.9 + (ndx / b.r) * 1.6;
      b.ang += b.va * h;
    }
    if (mergeQueue.length){
      for (const m of mergeQueue) doMerge(m[0], m[1]);
      for (const b of balls) b.merging = false;
      clearedNow = false;
    }
  }
}

let landCool = 0, heartCool = 0;
function beepLand(b){
  if (landCool > 0) return;
  landCool = .07;
  beep(170 + (LAST - b.tier) * 24, .06, "sine", .045);
}

function pairSolve(a, b, detectMerge){
  let dx = b.x - a.x, dy = b.y - a.y;
  const rr = a.r + b.r;
  const d2 = dx*dx + dy*dy;

  // 合体はんてい：かさなっていなくても「ふれていれば」つく
  if (detectMerge && a.tier === b.tier && !a.merging && !b.merging){
    const mr = rr + MERGE_PAD;
    if (d2 < mr*mr){
      a.merging = b.merging = true;
      mergeQueue.push([a, b]);
      return;
    }
  }

  if (d2 >= rr*rr) return;
  let d = Math.sqrt(d2);
  if (d < 0.0001){ d = 0.0001; dx = rnd(-1,1); dy = -1; }
  const nx = dx/d, ny = dy/d;
  if (a.merging || b.merging) return;

  const ma = a.wt, mb = b.wt, tot = ma + mb;
  const wa = mb/tot, wb = ma/tot;
  const ov = rr - d;
  a.x -= nx*ov*wa; a.y -= ny*ov*wa;
  b.x += nx*ov*wb; b.y += ny*ov*wb;

  // まさつ（接線方向のずれをおさえる）
  const tx = -ny, ty = nx;
  const rdx = (b.x - b.px) - (a.x - a.px);
  const rdy = (b.y - b.py) - (a.y - a.py);
  let dtn = rdx*tx + rdy*ty;
  const lim = ov * 2.2;
  if (dtn >  lim) dtn =  lim;
  if (dtn < -lim) dtn = -lim;
  const fr = dtn * MU;
  a.x += tx*fr*wa; a.y += ty*fr*wa;
  b.x -= tx*fr*wb; b.y -= ty*fr*wb;
}

function resolvePairs(detectMerge){
  const NB = [[1,0],[-1,1],[0,1],[1,1]];
  for (let cy = 0; cy < GH; cy++){
    for (let cx = 0; cx < GW; cx++){
      const cell = grid[cy*GW + cx];
      if (!cell) continue;
      for (let i = 0; i < cell.length; i++){
        const a = cell[i];
        if (a.dead) continue;
        for (let j = i+1; j < cell.length; j++){
          if (!cell[j].dead) pairSolve(a, cell[j], detectMerge);
        }
        for (const o of NB){
          const nxc = cx + o[0], nyc = cy + o[1];
          if (nxc < 0 || nxc >= GW || nyc < 0 || nyc >= GH) continue;
          const oc = grid[nyc*GW + nxc];
          if (!oc) continue;
          for (const b of oc) if (!b.dead) pairSolve(a, b, detectMerge);
        }
      }
    }
  }
}

function resolveWalls(){
  for (const b of balls){
    if (b.dead) continue;
    if (b.x - b.r < WALL_L) b.x = WALL_L + b.r;
    if (b.x + b.r > WALL_R) b.x = WALL_R - b.r;
    // てんじょう：合体の おしだしで 画面の外へ とばないように
    // （つかんでいる子は y=HOLD_Y、いちばん大きい子でも 上は y=14 なので じゃまに ならない）
    if (b.y - b.r < CEIL){ b.y = CEIL + b.r; if (b.py < b.y) b.py = b.y; }
    if (b.y + b.r > floorY){
      b.y = floorY - b.r;
      const sl = b.x - b.px;
      b.x -= sl * 0.45;   // ゆかのまさつ
    }
  }
}

/* ============================================================
   れんさ（つづけて合体）
   ============================================================ */
function chainColors(n){
  if (n >= 8) return ["#FF6FA5","#FFD34D","#7FE0FF","#B79BFF"];
  if (n >= 7) return ["#B79BFF","#FF9EDC","#FFD9F2"];
  if (n >= 6) return ["#FF6F9B","#FFA6C6","#FFE3EE"];
  if (n >= 5) return ["#FF9236","#FFC46B","#FFEBC2"];
  return ["#FFC02E","#FFE07A","#FFF6C9"];
}

function addChain(x, y){
  // さいしょの合体から CHAIN_WINDOW びょう の あいだに いくつ合体したか
  if (chain === 0){ chainT = CHAIN_WINDOW; chainLo = chainHi = x; }
  chain++;
  chainX = x; chainY = y;
  if (x < chainLo) chainLo = x;
  if (x > chainHi) chainHi = x;
  if (chain > chainBest){ chainBest = chain; updateHUD(); }   // HUD の「連鎖」に すぐ出す
  if (chain === CHAIN_MIN) bumpMission("chain");

  if (chain >= CHAIN_MIN){
    // カウントが のびていく（ちいさく はじける）
    chainFx = { n: chain, age: 0, life: 1.6, live: true };
    const cols = chainColors(chain);
    for (let i = 0; i < 10; i++){
      const a = Math.random()*Math.PI*2, sp = rnd(90, 300);
      fx.push({ t:"st", x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 80,
                rot: rnd(0,6.3), rotv: rnd(-10,10), s: rnd(4,9),
                life: rnd(.35,.6), age:0, c: pick(cols) });
    }
    ring(x, y, 110, cols[0]);
    shake = Math.max(shake, 3 + (chain - CHAIN_MIN)*.8);
    beep(523.25 * Math.pow(1.122, chain - CHAIN_MIN), .1, "triangle", .1);
  }
}

/* れんさが とぎれた しゅんかん に ど〜ん！ */
function chainFinale(n, x, y){
  const cols = chainColors(n);
  const spread = Math.abs(chainHi - chainLo);      // よこの ひろがり
  const pts = chainPts(n, spread);
  const pw = Math.min(2.8, 1 + (n - CHAIN_MIN) * .4);

  // ごほうび：れんさが のびるほど いきのびられる
  // せり上がり1かいぶんに もらえる ごほうびは あるていど まで
  const allow = Math.max(0, RISE_BONUS_CAP - riseBonusUsed);
  const sec = Math.min(allow, 9, 1.5 + (n - CHAIN_MIN) * 1.3);
  let bonus;
  if (sec >= .5){
    riseBonusUsed += sec;
    riseT = Math.min(riseSpan, riseT + sec);        // ためこめるのは 1かいぶん まで
    bonus = "+" + pts + "点 ／ せり上がり +" + sec.toFixed(1) + "秒";
  } else if (n >= 6){
    stamps++;                                        // じかんが もらえない ぶんは ⭐に
    bonus = "+" + pts + "点 ／ ⭐ボーナス！";
  } else {
    bonus = "+" + pts + "点！";
  }
  // 6れんさ いじょうで はやさが ひとつ まえに もどる
  if (n >= LV_BACK_MIN && level > 1 && lvBackCool <= 0 && lvBackLeft > 0){
    levelAdj += LV_SEC;
    lvBackCool = LV_BACK_COOL;
    lvBackLeft--;
    const nl = levelAt(elapsed - levelAdj);
    bonus = "速さが Lv." + nl + " に戻った！"
          + (lvBackLeft > 0 ? "（あと" + lvBackLeft + "回）" : "（最後）");
    for (let i = 0; i < 18; i++)
      fx.push({ t:"st", x: rnd(WALL_L, WALL_R), y: rnd(DANGER, DANGER + 220),
                vx: rnd(-70,70), vy: rnd(60, 220), rot: rnd(0,6.3), rotv: rnd(-8,8),
                s: rnd(5,11), life: rnd(.6,1.0), age:0, c:"#9BE8B4" });
  }
  if (n >= 8){
    floorY = Math.min(FLOOR0, floorY + RISE_STEP);
    bonus = "+" + pts + "点 ／ 床が下がった！";
    for (let i = 0; i < 14; i++)
      fx.push({ t:"p", x: rnd(WALL_L, WALL_R), y: floorY - rnd(0, 26),
                vx: rnd(-90,90), vy: rnd(-260,-90), r: rnd(3,7),
                life: rnd(.5,.9), age:0, c:"#ffffff" });
  }
  updateRiseBar();

  chainScore += pts;
  if (scoreNow() > best) best = scoreNow();
  updateHUD();

  chainFx = { n, age: 0, life: 1.7, live: false, bonus, pts };

  for (let i = 0; i < 24 + n*6; i++){
    const a = Math.random()*Math.PI*2, sp = rnd(160, 640)*pw;
    fx.push({ t:"p", x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 150,
              r: rnd(3, 8)*pw, life: rnd(.5, 1.15), age:0, c: pick(cols) });
  }
  for (let i = 0; i < 8 + n*3; i++){
    const a = Math.random()*Math.PI*2, sp = rnd(180, 580)*pw;
    fx.push({ t:"st", x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 170,
              rot: rnd(0,6.3), rotv: rnd(-13,13), s: rnd(6,15)*pw,
              life: rnd(.6,1.25), age:0, c: pick(cols) });
  }
  for (let i = 0; i < 4; i++)
    fx.push({ t:"h", x: x + rnd(-40,40), y: y + rnd(-16,16), vy: rnd(-120,-60), life:1.2, age:0 });

  flash(.22 + Math.min(.16, (n - CHAIN_MIN)*.03));
  ring(x, y, 150*pw, cols[0]);
  setTimeout(() => ring(x, y, 215*pw, cols[1]), 70);
  setTimeout(() => ring(x, y, 280*pw, cols[2] || "#ffffff"), 145);

  shake = Math.max(shake, 6 + (n - CHAIN_MIN)*2.2);

  // みんな びっくり → そのあと にっこり
  for (const b of balls)
    makeShock(b, Math.min(.4, Math.hypot(b.x - x, b.y - y) / 1000), rnd(.5, .75), 1);
  if (held) makeShock(held, .1, .6, 1);

  const base = 523.25 * Math.pow(1.06, n - CHAIN_MIN);
  [1, 1.26, 1.5, 2].forEach((m, i) =>
    setTimeout(() => beep(base*m, .17, "triangle", .13), i*58));
  setTimeout(() => beep(base*3, .32, "sine", .1), 250);
  if (n >= 6) setTimeout(() => beep(base*4, .32, "sine", .075), 330);
}

let clearedNow = false;              // おそうじ直後の フレームは 合体を うけつけない
function doMerge(a, b){
  if (clearedNow) return;
  if (a.dead || b.dead) return;
  const boom = a.sparkle || b.sparkle;          // かたほうでも ひかっていれば おそうじ
  a.dead = true; b.dead = true;
  const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
  const t = a.tier;
  const col = TIERS[t];

  if (t === LAST){
    // いちばん小さい子どうし → なかよく かけていく
    pops++;
    // **おひるね中の 見送りで 入れなおさない こと。** 手で くっつけて 見送りが 起きると
    // タイマーが 5びょうに もどり、**永久に 時間が 動かない**状態が 作れて しまう。
    if (pops % OHIRUNE_EVERY === 0) startOhirune(mx, my);   // おためし：おひるね
    // **みおくりは 3点（2026-09-14 に 2点から 上げた）。**
    // じかん点を 消したら ρ(精度,スコア) が 0.31 → **0.23** に 落ちた。
    // じかん点は「放置の 抜け道」であると 同時に「長く 生きのびた＝上手い」の
    // 信号でも あった ため。みおくりは **盤面を いちばん 小さい段まで
    // 落としきらないと 起きない**ので、上手さと 直結して いる。
    // ここを 3点に したら ρ は **+0.32** に もどった（決着 200/200 のまま）。
    // 内わけも みおくり61 : れんさ33 : おそうじ6 に なり、
    // 「いちばん ちいさい子を おおく みおくるほど 高とくてん」という
    // **看板の 文と 中身が はじめて 一致した**。
    popScore += 3;
    updateHUD();
    popFx(mx, my);
    bumpMission("pop");
    addChain(mx, my);
    if (boom) clearAll(mx, my);
    return;
  }

  const nb = newBall(t+1, mx, my, (a.vx+b.vx)/2, (a.vy+b.vy)/2 - 60);
  nb.sqv = -0.55;
  makeSmile(nb, 1.5);
  balls.push(nb);
  bumpMission("make", t+1);
  addChain(mx, my);
  if (t + 1 >= sparkleTier && Math.random() < sparkleRate) makeSparkle(nb);
  if (boom) clearAll(mx, my);
  burst(mx, my, col.body, 14, 1);
  ring(mx, my, a.r*2.1, col.shade);
  shake = Math.max(shake, 3);
  beep(300 + t*95, .12, "sine", .1, .8);   // 合体＝小さく なる。音も 下げる（「ぽふっ」）
}

}

/* ぜんぶ おそうじ！ */
const RAINBOW = ["#FF7EA8","#FFB05C","#FFE85C","#8FE39B","#7FD4FF","#B79BFF"];
function clearAll(x, y){
  const n = balls.length;

                r: rnd(3, 7), life: rnd(.45,.9), age:0,
                c: Math.random() < .45 ? pick(RAINBOW) : col });
    }
    fx.push({ t:"st", x:b.x, y:b.y, vx:rnd(-160,160), vy:rnd(-260,-60),
              rot: rnd(0,6.3), rotv: rnd(-11,11), s: rnd(6,13),
              life: rnd(.6,1.1), age:0, c: pick(RAINBOW) });
  }
  balls.length = 0;
  clearedNow = true;
  cur = 0; updateHUD();

  flash(.4);
  RAINBOW.forEach((c, i) => setTimeout(() => ring(x, y, 240 + i*70, c), i*55));
  for (let i = 0; i < 8; i++)
    fx.push({ t:"h", x: rnd(WALL_L, WALL_R), y: rnd(DANGER, floorY), vy: rnd(-120,-50), life:1.3, age:0 });

  shakeBy(16);
  clearFx = { n, age: 0, life: 2.0 };
  overCount = OVER_GRACE; safeT = 0; tickSec = -1;      // きけんも リセット
  // れんさの さいちゅうに おそうじが おきた ばあい：
  // ここで れんさを きちんと しめないと、てんすうが 消えて 表示だけ 居のこる
  if (chain >= CHAIN_MIN) chainFinale(chain, chainX, chainY);   // 「◯れんさ!!」→「ぜんけし！」の 二だん
  else chainFx = null;                                          // とちゅうの「◯ れんさ」は 消す
  chain = 0; chainT = 0;

let lastPopAt = -99;
function popFx(x, y){

  // 2びょう いないに もう1回 起きたら「軽い版」。
  // 5びょうに1回 フルコースが 来ると、いちばん大事な瞬間が 自分で 薄まる。

  }
  // はしっていく 2ひき
  // 前は 等身大で 山の中を 0.4びょうで 抜けていたので、
  // すわっている ひよこと 見分けが つかなかった。
  // 大きく・ゆっくり・山から とび出した 高さを はしらせる。
  // 山の いちばん上より すこし高い ところを はしらせる。
  // 山の中を はしると、すわっている ひよこに まぎれて 見えなくなる。

  // もとは 山の てっぺん（top-30）に そろえて いたので、どこか1匹でも

  const laneRaw = Math.max(DANGER + 22, Math.min(y - 26, top - 30));

    // **46px では 2匹が 43% かさなって「双頭の かたまり」に 見えて いた。**
    // 見かけの 直径は r22 × 2 × 1.85 ＝ 81px。それより ひろく とる。
    fx.push({ t:"run", x: x - dir*i*88, y, y0: y, lane,
              vx: dir*(255 - i*18), s: 1.85 - i*0.06,
              ph: i*1.15, dir, life: 1.15, age:0, puff: 0 });

  for (let i = 0; i < 3; i++)
    fx.push({ t:"h", x: x + rnd(-20,20), y: y + rnd(-10,6), vy: rnd(-42,-18), life:.8, age:0 });

  // もらった てんすうを その場に 出す（40%を かせぐ行為が 無言だった）

    // ついて いた ── 絵では「昇天に 見える」として 却下した 動きが、音に のこって いた。
    // いまは さがって から すこし 持ちあがる（手を ふる かたち）。`slide` 1.0 で すべらせない。
    beep(1568, .09, "square", .10, 1.0);
    setTimeout(() => beep(1318, .09, "square", .09, 1.0), 60);
    setTimeout(() => beep(1046, .17, "triangle", .10, 1.0), 120);
    setTimeout(() => beep(1568, .20, "sine", .07, 1.0), 210);
