/* 称号と つぎの目標 */
/* **じかん点を 消した ぶん、はしごを 引きなおした（2026-09-14）。**
   200ゲームの 到達率：10点 82% ／ 40点 48% ／ 75点 19% ／ 100点 8% ／ 130点 3%。
   上の2段は 測定AIでは 届かない が、それで よい（AIは 下ばり。
   いちばん 上は でんせつで ある べき）。**前は 上4段が 届かなかった**ので
   むしろ 良く なって いる。 */
const RANK_STEPS = [10, 18, 28, 40, 55, 75, 100, 130, 165, 210, 270];
const RANK_TITLES = { 10:"まめまる見習い", 18:"まめまる修行中", 28:"まめまる使い",
                      40:"まめまる上手", 55:"まめまる達人", 75:"まめまる先生",
                      100:"まめまる博士", 130:"まめまるマスター", 165:"まめまる王",
                      210:"伝説のまめまる", 270:"まめまる神さま" };
function rankOf(n){
  let got = null;
  for (const s of RANK_STEPS) if (n >= s) got = s;
  return got ? RANK_TITLES[got] : "まめまる始めました";
}
function nextGoal(n){
  const goal = RANK_STEPS.find(s => s > n) || (n + 60);
  return `${goal}点（${RANK_TITLES[goal] || "まめまる神さま"}）`;
}

/* ============================================================
   称号に とどいたら、あいことばの「入口」を 1つ 教える
   ============================================================
   ねらいは **言葉を くばる ことでは なく、「よみこみの はこは
   言葉も うけつける」と 気づいて もらう こと。**
   ここが 見えて いないと、しりとりも シークレットも 一生 見つからない。

   **ベストスコアを 引き金に しては いけない。**
   1回目は かならず ベスト、2〜5回目も ほぼ 確実に 更新する。
   つまり **いちばん 何も 分かって いない 時期に 大量に 出て、
   分かって きた ころに 枯れる**（順序が さかさま）。
   おまけに 記録は モード別なので 同じ ごほうびが 2周する。
   称号は 15/25/…/310 の 固定の はしごで、一度きり・順番どおり・
   後もどり しない。引き金には こちらを つかう。

   **キャラの あいことば（い／ユニコーン／たつ）は ここでは 出さない。**
   「この言葉を 入れてね」と 書いて 入力させるのは、キャラを 直接
   あげる ことの 回りくどい版 でしかない。秘密が 作業に なる。
   出すのは **答えでは なく 入口**。 */
/* しきい値は **かならず `RANK_STEPS` の どれかに そろえる**。
   称号と 同時に 出る ことで「これは ごほうびだ」と 読める。
   到達率：10点 82% ／ 40点 48% ／ 75点 19%。 */
const RANK_HINTS = [
  { at: 10, word: null },            // null＝けしきの名前を その場で ひとつ 選ぶ
  { at: 40, word: "ひみつ" },         // → しりとりへ
  { at: 75, word: "しーくれっと" },   // → シークレット3体へ
];
let hintsGiven = 0;
try { hintsGiven = Math.max(0, Math.min(RANK_HINTS.length,
        parseInt(localStorage.getItem("mamemaru-hint") || "0", 10) || 0)); } catch(e){}

/* タイトルに 出す ひとこと。**タイトルは innerHTML で 作りなおされる**ので、
   1回 書いて おわりに せず、paint() から 毎回 書きなおす。
   けす のは start()（つぎの ゲームが 始まる とき）。 */
let titleHintMsg = "";

/* **まだ 画面に 出して いない ヒント。**
   ここを つくった とき `checkRankHint()` の 中で すぐ 数を 進めて いたが、
   文言は タイトルにしか 出ない のに、結果画面の 主ボタンは「もういちど」で、
   押すと `start()` が 文言を 消して いた。
   実測：18点で 終えて `mamemaru-hint` は 0→1 に 進み、**表示 0回**。
   「おわる」で もどっても 出ない ＝ **最初の ヒントは 永久に 失われて いた**。
   ヒントは 3回きりで、隠し要素 3つ ぜんぶの 入口が ここに ぶら下がって いる。
   **数を 進めるのは「じっさいに 画面に 出した とき」だけ。** */
let pendingHint = null;

function checkRankHint(){
  if (hintsGiven >= RANK_HINTS.length) return;
  // **モードを またいだ ひとつの はしご**に する（記録は モード別なので、
  // そのまま だと 同じ ごほうびが 2周する）。
  const top = Math.max(bestEver, bestFreeEver);
  const h = RANK_HINTS[hintsGiven];        // いちばん 下の まだ 出して いないもの
  if (top < h.at) return;

  // **いちどに 1つだけ。** 大きく 飛びこえても 順に 出す。
  // 教える 順番（入口 → しりとり → シークレット）を くずさない ため。
  const word = h.word || pick(THEMES).nm;  // けしきは その場で ひとつ
  // **ここでは まだ 進めない。**（上の pendingHint の 説明を 見ること）
  // **ボタンの 名前を 文の 中で くりかえさない。** すぐ下に ある ので ↓ で 足りる。
  // 長いと 単語の とちゅうで 折り返して 読みにくく なる（じっさい そう なった）。
  // **称号を 文の 中に 入れない こと。**（2026-09-19・作者の 判断）
  // もとは "🌸 まめまる先生！ ↓の箱に「ゆきのひ」と入れてみて" と、
  // いま とどいて いる 称号で 呼びかけて いた。
  // 称号は すぐ上の 記録表示に もう 出て いる ので、ここで くりかえす 値うちが ない。
  // （むかし「段の 名前 と いまの 称号が 食いちがう」問題を 直した 名残で
  //  `rankOf(top)` を つかって いたが、**そもそも 出さないのが いちばん 早い**）
  // 伝えたい ことは ひとつ ── **この はこは 言葉も うけつける**。
  pendingHint = "🌸 ↓の箱に「" + word + "」と 入れてみて";
}


/* ============================================================
   DROP_POOL の生成（フェーズ2用）
   ============================================================ */
// おちてくる 子の わりあい。もとの [0,0,0,1,1,1,2,2,2,3,3,4,4] を そのまま つかう。
// いちばん 小さい子（LAST）は ここに 入れない。合体でしか 生まれない のが
// この ゲームの きもで、おとせる ように すると「みおくり」が こわれる。
const DROP_COUNTS = [3, 3, 3, 2, 2];   // tier 0..4 の まい数。LAST は なし。

function generateDropPool(){
  DROP_POOL.length = 0;
  const upto = Math.min(DROP_COUNTS.length, TIERS.length - 1);  // LAST は のぞく
  for (let i = 0; i < upto; i++){
    for (let j = 0; j < DROP_COUNTS[i]; j++) DROP_POOL.push(i);
  }
  // まんいち からに なったら いちばん 大きい子だけは おとせる ように する
  if (!DROP_POOL.length) DROP_POOL.push(0);
}

function start(){
  // 出しおわった 文だけ けす。**`pendingHint` は さわらない**
  //（まだ 見せて いない ヒントは、つぎに タイトルへ 来た ときに 出す）
  titleHintMsg = "";
  stopParade();
  overlay.classList.add("hidden");
  overlay.classList.remove("result");
  
  applySelectedTiers();

  // しりとりを そろえた 回だけ にじいろに する。
  // **ひかる 段は 5（いちばん小さい子）の まま。かくりつだけ 1/28 → 1/2。**
  //
  // ひかる 段を 下げる 案（段3・1/5）も 作って 実測した。派手には なるが、
  // 全消しが 早い 段で 起きるので **いちばん 小さい子が たまる前に 消えて しまい、
  // みおくりが 7回まで 落ちた**（ふつうは 18〜26回）。このゲームで いちばん
  // いい 瞬間を、隠しコマンドが うばって いた。6回×4設定の 実測（中央値）：
  //
  //   段3・1/5 → スコア79 / みおくり 7 / おそうじ42
  //   段4・1/4 → スコア60 / みおくり 8 / おそうじ35
  //   段5・1/2 → スコア69 / みおくり18 / おそうじ29   ← これ
  //
  // 段5・1/2 なら みおくりは ふつうと 同じ 回数 のこり、そのうえで
  // **みおくる たびに 半分は 全消し**に なる。いちばん いい 瞬間を
  // うばうのでは なく 増やす 形。100% に しないのも 同じ りくつ。
  rainbowRun  = isShiritori(selectedTiers);
  sparkleRate = rainbowRun ? 1/2 : SPARKLE_RATE;
  sparkleTier = rainbowRun ? 5   : SPARKLE_TIER;

  reset();
  markSeen();            // けしきが 決まった あと。図鑑に 1つ 足す

  /* **持ちこしたら だまって いない こと。**（2026-09-19・第3回評価）
     もとは ゲージが 途中から 始まるだけ で、はじめて 見る人には
     **「なぜか もう 進んで いる」**としか 読めなかった。
     ここは トーストで 言う ── お題カードに 文字を 足すと
     はば320の 端末で 3行に なって 切れる（194とおり 実測ずみ）。 */
  {
    const c = missions.filter(m => m && m.carried && !m.done);
    if (c.length) setTimeout(() => showToast(
      "お題は つづきから", c.map(m => m.text).join(" ／ ")), 700);
  }

  state = "play";
  if (!AC && soundOn){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === "suspended") AC.resume();
}

bindTitleButtons();

/* ============================================================
   そうさ
   ============================================================ */

/* iOS は user-scalable=no を むしするので、じぶんで とめる */
/* 電話が きた・アプリを きりかえた とき：
   記録を すぐ保存し、もどってきたら 音を 生きかえらせる */
document.addEventListener("visibilitychange", () => {
  if (document.hidden){
    try { saveRec(); saveCarry(); } catch(e){}
  } else {
    // **もどって きた しゅんかんに 時間を 進めない。**
    // `last` が 古いままだと dt が どかっと 入る。電話に 出て もどったら
    // 死んで いた、を ふせぐ。`dt > 0.05` の 上限とは べつに ここでも 止める。
    last = performance.now();
    if (AC && AC.state === "suspended"){ try { AC.resume(); } catch(e){} }
  }
});
window.addEventListener("pagehide", () => { try { saveRec(); saveCarry(); } catch(e){} });

(function blockZoom(){
  const isField = t => t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" ||
                             t.tagName === "BUTTON" || t.isContentEditable);
  let lastTap = 0;
  document.addEventListener("touchend", e => {
    if (isField(e.target)) return;
    const now = Date.now();
    if (now - lastTap < 400 && e.cancelable) e.preventDefault();   // ダブルタップ拡大
    lastTap = now;
  }, { passive: false });

  document.addEventListener("dblclick", e => {
    if (!isField(e.target)) e.preventDefault();
  }, { passive: false });

  // Safari の ピンチ拡大
  for (const t of ["gesturestart", "gesturechange", "gestureend"]){
    document.addEventListener(t, e => {
      if (isField(e.target)) return;          // 入力らんの 中では さわらない
      e.preventDefault();
    }, { passive: false });
  }

  // ゆびが 2本 いじょう ふれたら 拡大させない
  document.addEventListener("touchmove", e => {
    if (e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive: false });
})();

function pointerX(e){
  const rect = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  return (cx - rect.left) / rect.width * CW;
}
/* **ここは `CH` では なく `CH + SKIRT`。**（2026-09-19 に 直した）
   キャンバスは ゆかの 下の ぶん（SKIRT=80）だけ **たかく えがいて いる**ので、
   画面の たかさ `rect.height` に 対応する ゲームの たかさは `CH + SKIRT`。
   `CH` の まま わると、指の いちが **いつも 620/700 ＝ 0.886倍**に なる
   ＝ 本当より **上**に 出る。ずれは 下へ 行くほど 大きい：

     ゲームy 150 → 17px ずれ（どの子も つかめる）
     ゲームy 300 → 34px ずれ（いちばん 小さい子が つかめない）
     ゲームy 450 → 51px ずれ（うし と らいおん しか つかめない）
     ゲームy 590 → 67px ずれ（らいおん しか つかめない）

   `grabAt` は `d < b.r + 10` で しらべる ので、**ゆかに 近い 小さい子ほど
   つかめなく なる**。作者の 「おひるねの ときに 動かせない ときが ある」は これ。
   おひるね だけの 話では なく、取り消しの スワイプと
   「もって いる子を タップして おとす」にも 同じ ずれが 効いて いた。
   **`SKIRT` を いじったら ここも 見る こと。** */
function pointerY(e){
  const rect = cv.getBoundingClientRect();
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return (cy - rect.top) / rect.height * (CH + SKIRT);
}
/* 上に にがすと とりけし。
   さわって ようすを 見ただけで おちてしまう 事故を ふせぐ */
let downY = null, downId = null;
const CANCEL_UP = 60;            // これ いじょう 上へ うごかして はなすと おとさない
cv.addEventListener("pointermove", e => {
  if (ohPhase === 4){ if (dragB){ dragTX = pointerX(e); dragTY = pointerY(e); } return; }
  aimX = pointerX(e);
});
cv.addEventListener("pointerdown", e => {
  if (ohPhase >= 2){
    if (ohPhase !== 4){ return; }
    dragTX = pointerX(e); dragTY = pointerY(e);
    dragB = grabAt(dragTX, dragTY);
    if (dragB) beep(520, .05, "sine", .05, 1.15);
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    return;                      // **おひるね中は ぜったいに おとさない**
  }
  aimX = pointerX(e);
  downY = pointerY(e); downId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
});
cv.addEventListener("pointerup", e => {
  if (ohPhase >= 2){ dragB = null; return; }
  aimX = pointerX(e);
  const up = (downY == null) ? 0 : (downY - pointerY(e));
  // **もって いる子 そのものを タップしたら おちる こと。**
  // `DANGER * 0.55`（＝83.6）で 切って いた ため、もって いる子の 中心（y=78）を
  // タップすると「カゴより 上」と 見なされて **無反応**だった。
  // 幼児が いちばん ねらう ところが 死角に なって いた（実測：y=40/78/83 で おちない）。
  // いまは **もって いる子の 頭より 上**だけを 取り消しに する。
  const topOfHeld = HOLD_Y - (held ? held.r : 30) - 12;
  const outOfBox = pointerY(e) < topOfHeld;
  downY = null; downId = null;
  if (up > CANCEL_UP || outOfBox){
    if (state === "play" && held) beep(420, .07, "sine", .05);   // とりけしの あいず
    return;
  }
  drop();
});
cv.addEventListener("pointercancel", () => { downY = null; downId = null; dragB = null; });
/* もじを うっている あいだ／ダイアログが 出ている あいだは ゲームに ながさない */
function typingNow(e){
  const t = e && e.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) return true;
  return !saveDlg.classList.contains("hidden");
}
window.addEventListener("keydown", e => {
  if (typingNow(e)) return;
  if (e.key === "ArrowLeft")  { aimX -= 22; e.preventDefault(); }
  if (e.key === "ArrowRight") { aimX += 22; e.preventDefault(); }
  if (e.key === "ArrowDown" || e.key === "Shift" || e.key === "h" || e.key === "H"){
    e.preventDefault(); doKeep(); return;
  }
  if (e.key === " " || e.key === "Enter"){
    e.preventDefault();
    // けっか画面では はじめない（読む前に つぎが はじまる 事故を ふせぐ）
    if (state === "play") drop();
    else if (state === "title") start();
  }
  aimX = Math.max(WALL_L, Math.min(WALL_R, aimX));
});

/* ============================================================
   しんかの図（下のバー）
   ============================================================ */
function initChainBar(){
  const c = document.getElementById("chainCv");
  if (!c){ bctx = null; return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = 430*dpr; c.height = 92*dpr;
  bctx = c.getContext("2d");
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderChainBar(0);
}

/* ============================================================
   みぎの たての しんかの図（ゲーム中も ずっと 見えて いる）
   ------------------------------------------------------------
   もとは タイトルの よこ長の バー（#chain）しか なく、**ゲーム中は
   順番を 見る ところが どこにも なかった**。顔ぶれが 固定の ころは
   2〜3回 遊べば 覚えて しまったので それで よかったが、
   えらべる ように なって 覚えきれなく なった。

   **1ゲームの あいだ 中身は 変わらない ので、1回だけ えがいて
   置いて おく。** 毎フレーム えがくと 電力の 予算（CLAUDE.md）を こわす。
   えがきなおすのは 大きさが 変わった とき（fitCanvas）と
   顔ぶれを 変えた とき だけ。
   ============================================================ */
function initLadder(scale){
  const c = document.getElementById("ladderCv");
  if (!c){ ladCtx = null; return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // **すそ（SKIRT）を 足したら ここも そろえる こと。**
  // CH の まま だと 盤面の 下 80px だけ 図が なくて、
  // よこに 欠けた 段差が できる（実際 そう なった）
  c.width = LAD_W * dpr; c.height = LAD_H * dpr;
  c.style.width = (LAD_W * scale) + "px";
  c.style.height = (LAD_H * scale) + "px";
  ladCtx = c.getContext("2d");
  ladCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderLadder();
}

function renderLadder(){
  if (!ladCtx) return;
  // **SKIRT を 足したら H も そろえる こと。** キャンバスだけ 高く して
  // 中身を CH で えがいて いた ころは、下 80px が すきとおって
  // **図だけ 短い**ように 見えた（作者の 指摘「中途半端な 長さ」）。
  const g = ladCtx, W = LAD_W, H = LAD_H;
  g.clearRect(0, 0, W, H);

  // 下じき
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, "rgba(255,250,252,.92)");
  lg.addColorStop(1, "rgba(255,236,244,.92)");
  g.fillStyle = lg; roundRect(g, 0, 0, W, H, 14); g.fill();

  g.textAlign = "center";
  g.fillStyle = "#d79ab4"; g.font = "bold 9px sans-serif";
  g.fillText("大きい", W/2, 15);

  // 6体ぶんの 高さを 出して、あまりを すきまに くばる
  const TOP = 24, BOT = 40, ARW = 9;
  const maxR = (W - 12) / 2;                 // いちばん 大きい子の 半径
  const S = maxR / TIERS[0].r;
  const rs = TIERS.map(t => t.r * S);
  const need = rs.reduce((s, r) => s + r*2, 0) + ARW * TIERS.length;  // 矢印は 6こ（さいごの ばいばい ぶんも）
  const gap = Math.max(4, (H - TOP - BOT - need) / (TIERS.length + 1));

  let y = TOP + gap;
  TIERS.forEach((t, i) => {
    const r = rs[i];
    g.save(); g.translate(W/2, y + r);
    drawCreature(g, i, r, i * 1.3, 1, 0, 0, 0, 1);
    g.restore();
    y += r*2;
    // 下むきの ▽
    g.fillStyle = "#f0bed2";
    g.beginPath();
    g.moveTo(W/2 - 5, y + gap*.5 - 2);
    g.lineTo(W/2 + 5, y + gap*.5 - 2);
    g.lineTo(W/2,     y + gap*.5 + 4);
    g.closePath(); g.fill();
    y += ARW + gap;
  });

  // さいごは ばいばい（きらきら）
  g.fillStyle = "#ffd86b";
  g.save(); g.translate(W/2, y + 4);
  for (let i = 0; i < 3; i++){
    g.save();
    g.translate(Math.cos(i*2.1)*6, Math.sin(i*2.1)*5);
    g.rotate(i*.7);
    g.beginPath();
    for (let j = 0; j < 10; j++){
      const a = -Math.PI/2 + j*Math.PI/5, rr = (j%2) ? 1.9 : (i ? 3.4 : 5.6);
      const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
      if (j) g.lineTo(px, py); else g.moveTo(px, py);
    }
    g.closePath(); g.fill();
    g.restore();
  }
  g.restore();
  g.fillStyle = "#e79ab6"; g.font = "bold 9px sans-serif";
  g.fillText("ばいばい", W/2, y + 20);
}

function renderChainBar(su){
  if (!bctx) return;
  if (state !== "title") return;     // プレイ中は オーバーレイの下 ＝ 見えない
  su = su || 0;
  const g = bctx;
  const W = 430, H = 92, GY = 66;          // GY = じめんの高さ
  g.clearRect(0, 0, W, H);

  const S = 26 / TIERS[0].r;               // ほんとうの大きさの比のまま ちぢめる
  const GAP = 4, ARW = 10, POPW = 26;
  const parts = [];
  TIERS.forEach((t, i) => {
    if (i) parts.push({ k:"a" });
    parts.push({ k:"c", i, r: t.r*S, nm: t.name });
  });
  parts.push({ k:"a" }, { k:"pop" });
  let total = -GAP;
  for (const p of parts) total += (p.k === "c" ? p.r*2 : p.k === "a" ? ARW : POPW) + GAP;
  let x = (W - total) / 2;

  // カード
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, "#fffafc"); lg.addColorStop(.62, "#fff2f8"); lg.addColorStop(1, "#ffe6f0");
  g.fillStyle = lg; roundRect(g, 0, 0, W, H, 15); g.fill();

  // じめん（なみなみ）
  g.save();
  roundRect(g, 0, 0, W, H, 15); g.clip();
  g.fillStyle = "#ffe2ee"; g.fillRect(0, GY, W, H-GY);
  g.fillStyle = "#ffd2e4";
  for (let sx = 2; sx < W; sx += 13){
    g.beginPath(); g.arc(sx + 6.5, GY + 1, 6.5, Math.PI, 0); g.fill();
  }
  g.fillStyle = "#ffc0d8"; g.fillRect(0, GY + 1, W, 2);
  // ちいさい草
  g.fillStyle = "rgba(255,255,255,.7)";
  for (let sx = 9; sx < W; sx += 37){
    g.beginPath(); g.arc(sx, GY + 9, 2.2, 0, 7); g.fill();
  }
  g.restore();

  // みだし
  g.font = "bold 9px sans-serif"; g.textAlign = "left";
  g.fillStyle = "#e79ab6"; g.fillText("大きい", 10, 14);
  g.textAlign = "right"; g.fillText("小さい ✨", W - 10, 14);
  g.textAlign = "center";

  for (const p of parts){
    if (p.k === "a"){
      g.fillStyle = "#f0bed2";
      g.beginPath();
      g.moveTo(x, GY - 13); g.lineTo(x + ARW - 2, GY - 8); g.lineTo(x, GY - 3);
      g.closePath(); g.fill();
      x += ARW + GAP;
    } else if (p.k === "pop"){
      const cx = x + POPW/2;
      g.fillStyle = "#ffd86b";
      g.save(); g.translate(cx, GY - 15);
      for (let i = 0; i < 3; i++){
        g.save();
        g.translate(Math.cos(i*2.1)*7, Math.sin(i*2.1)*6);
        g.rotate(i*.7);
        g.beginPath();
        for (let j = 0; j < 10; j++){
          const a = -Math.PI/2 + j*Math.PI/5, rr = (j%2) ? 2.2 : (i ? 4 : 6.5);
          const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
          if (j) g.lineTo(px, py); else g.moveTo(px, py);
        }
        g.closePath(); g.fill();
        g.restore();
      }
      g.restore();
      g.fillStyle = "#e79ab6"; g.font = "bold 9px sans-serif";
      g.fillText("ばいばい", cx, GY + 15);
      x += POPW + GAP;
    } else {
      const cx = x + p.r;
      g.save();
      g.globalAlpha = .12; g.fillStyle = "#8a5f70";
      g.beginPath(); g.ellipse(cx, GY + 1, p.r*.85, p.r*.2, 0, 0, 7); g.fill();
      g.restore();
      g.save();
      g.translate(cx, GY - p.r + 1);
      drawCreature(g, p.i, p.r, p.i*1.3, 1, 0, 0, su, 2);
      g.restore();
      g.fillStyle = "#a58e83"; g.font = "8px sans-serif";
      g.fillText(p.nm, cx, GY + 15);
      x += p.r*2 + GAP;
    }
  }
}

/* ============================================================
   ループ
   ============================================================ */
/* オフラインで あそべるように */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

let last = performance.now();
function loop(now){
  let dt = (now - last)/1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (noDropT > 0) noDropT = Math.max(0, noDropT - dt);
  // かくれて いる あいだは 時間を 進めない（ブラウザが rAF を 止めない 場合の 保険）
  if (!document.hidden) update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
state = "title";
requestAnimationFrame(loop);

})();
</script>
