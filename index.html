  ctx.beginPath();
  ctx.moveTo(WALL_L, floorY+5); ctx.lineTo(WALL_L, CH + SKIRT - 6);
  ctx.quadraticCurveTo(WALL_L, CH + SKIRT - 1, WALL_L + 10, CH + SKIRT - 1);
  ctx.lineTo(WALL_R - 10, CH + SKIRT - 1);
  ctx.quadraticCurveTo(WALL_R, CH + SKIRT - 1, WALL_R, CH + SKIRT - 6);
  ctx.lineTo(WALL_R, floorY+5);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = TH.wallIn; ctx.lineWidth = 3.4;
  ctx.beginPath();
  ctx.moveTo(WALL_L, 120); ctx.lineTo(WALL_L, floorY+3);
  ctx.lineTo(WALL_R, floorY+3); ctx.lineTo(WALL_R, 120);
  ctx.stroke();
  // ゆかの なみなみクッション
  const warn = riseT < 3 && state === "play";
  ctx.fillStyle = warn ? `rgba(255,150,180,${.55+.45*Math.sin(time*14)})` : TH.cush;
  for (let x = WALL_L + 9; x < WALL_R - 2; x += 17){
    ctx.beginPath(); ctx.arc(x, floorY + 9, 8.5, Math.PI, 0); ctx.fill();
  }
  // かべのリボン
  for (const s of [WALL_L, WALL_R]){
    ctx.fillStyle = TH.ribbon[0];
    ctx.beginPath(); ctx.ellipse(s, 170, 7, 5, -0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s, 170, 7, 5, 0.4, 0, 7); ctx.fill();
    ctx.fillStyle = TH.ribbon[1];
    ctx.beginPath(); ctx.arc(s, 170, 3, 0, 7); ctx.fill();
  }
  ctx.restore();

  drawRiseGlow();

  // ガイド
  if (state === "play" && held){
    ctx.save();
    ctx.setLineDash([4,8]); ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(150,120,140,.28)";
    ctx.beginPath(); ctx.moveTo(held.x, held.y + held.r); ctx.lineTo(held.x, floorY); ctx.stroke();
    ctx.restore();
  }

  // たま
  for (const b of balls){
    if (b.dead) continue;
    ctx.save();
    // **すりぬけの あいだ だけ 絵を ずらす。** translate で ずらすので
    // この 下の コードは b.y を そのまま つかって よい
    const dy = drawY(b) - b.y;
    if (dy) ctx.translate(0, dy);
    // かげ
    ctx.globalAlpha = .1;
    ctx.fillStyle = "#7a5a66";
    ctx.beginPath(); ctx.ellipse(b.x + b.r*.1, b.y + b.r*.9, b.r*.8, b.r*.22, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.translate(b.x, b.y);
    if (b.sparkle){
      // にじいろの わ と まわる ほし
      const rr = b.r + 7;
      ctx.save();
      ctx.globalAlpha = .35 + .25*Math.sin(time*6);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(0, 0, rr + 5, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 4.5; ctx.lineCap = "round";
      for (let i = 0; i < RAINBOW.length; i++){
        const a0 = time*2.2 + i*(Math.PI*2/RAINBOW.length);
        ctx.strokeStyle = RAINBOW[i];
        ctx.beginPath();
        ctx.arc(0, 0, rr, a0, a0 + Math.PI*2/RAINBOW.length * .82);
        ctx.stroke();
      }
      for (let i = 0; i < 4; i++){
        const a0 = -time*3.1 + i*Math.PI/2;
        ctx.save();
        ctx.translate(Math.cos(a0)*(rr + 8), Math.sin(a0)*(rr + 8));
        ctx.rotate(a0*2);
        ctx.fillStyle = RAINBOW[(i*2) % RAINBOW.length];
        star(0, 0, b.r*.22 + 2);
        ctx.restore();
      }
      ctx.restore();
    }
    ctx.rotate(Math.max(-.5, Math.min(.5, b.ang)) * .5);
    // **けっか画面まで 出しっぱなしに しない。**
    // `b.danger` は `state === "play"` の ループでしか 減らない ので、
    // ゲームオーバーの しゅんかんの 値で **凍る**。結果画面で
    // **ラインを こえた子 ぜんぶが ずっと 赤く 点滅した ままに なって いた**
    // （2026-09-17 に 発見。見送った子が 走る うしろで これが 鳴って いた）。
    // 決着の 2.2びょうだけ のこして、あとは `overMarkT` と 一緒に 引く。
    const dangerVis = state === "play" ? 1 : Math.min(1, overMarkT / .6);
    if (b.danger > .2 && dangerVis > 0){
      ctx.save();
      ctx.globalAlpha = (.35 + .35*Math.sin(time*12)) * dangerVis;
      ctx.strokeStyle = "#ff5f83"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0, b.r+4, 0, 7); ctx.stroke();
      ctx.restore();
    }
    const zz = eyeShut(b);
    if (zz > 0){ const br = breathOf(b); ctx.scale(br, br); }   // 寝息（静止させない）
    const ea = eyeAmt(b), yw = yawnOf(b);
    drawCreature(ctx, b.tier, b.r, b.phase + time*.6, ea, b.sq, smileAmt(b), surpAmt(b), b.surpKind,
                 zz, yw > 0 ? drowsyOf(ea) : 0, yw);
    ctx.restore();
  }

  drawUnderShade();

  // もっている子
  if (state === "play" && held){
    // **おとせない 列は ここで くもらせる。**
    // さいしょ 点線ガイドと 同じ ブロック（もっと 前の レイヤー）に 書いて いて、
    // **カゴに 上から 塗りつぶされて 1度も 見えて いなかった**。
    // もって いる子と 同じ レイヤーに 置くこと。
    if (noDropT > 0){
      // **下じきと 同系色に しない こと。** さいしょ 紫がかった 灰 `#6E5568` に して、
      // よぞら・ほしぞら（紫の 空）で **ほとんど 見えなかった**。
      // かざりの 色・カゴの 色と まったく 同じ 失敗。
      // 赤は 明るい カゴ（クリーム）でも 暗い 空でも 色あいが ちがうので 両方で 読める。
      ctx.save();
      const a = Math.min(1, noDropT / .45);
      ctx.globalAlpha = a * .26;
      ctx.fillStyle = "#D9436E";
      const bx = noDropX - noDropR - 6, bw = (noDropR + 6) * 2;
      ctx.fillRect(bx, DANGER - 10, bw, floorY - DANGER + 10);
      // ふちも 引く。ぬりだけだと うすい 画面で 消える
      ctx.globalAlpha = a * .70;
      ctx.strokeStyle = "#D9436E"; ctx.lineWidth = 2.5;
      ctx.setLineDash([7, 5]);
      ctx.strokeRect(bx + 1.25, DANGER - 9, bw - 2.5, floorY - DANGER + 8);
      ctx.setLineDash([]);
      ctx.restore();
    }

    // おとせなかった ときは よこに ぷるぷる させる（だんだん おさまる）
    const nx = noDropT > 0 ? Math.sin(noDropT*58) * noDropT * 13 : 0;
    const hy = held.y + Math.sin(time*4)*2.5;
    // のこりじかんリング
    const fr = Math.max(0, Math.min(1, holdT / holdSpan));
    const rr = held.r + 8;
    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(held.x + nx, hy, rr, 0, 7); ctx.stroke();
    const hot = holdT < 1.6;
    ctx.strokeStyle = hot
      ? `rgba(255,80,110,${.6+.4*Math.sin(time*16)})`
      : (holdT < 3 ? "#ffb14d" : "#7fd6f5");
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(held.x + nx, hy, rr, -Math.PI/2, -Math.PI/2 + Math.PI*2*fr);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(held.x + nx, hy);
    if (hot){ const k = 1 + .04*Math.sin(time*22); ctx.scale(k, 2-k); }
    // **もって いる子も 一緒に 眠る。** ここだけ `blinkAmt` を 直に 見て いて、
    // みんなが 目を とじる 中で 1人だけ ぱっちり 起きて いた
    const hz = eyeShut(held), hea = eyeAmt(held), hyw = yawnOf(held);
    drawCreature(ctx, held.tier, held.r, held.phase + time*.6, hea, 0, smileAmt(held), surpAmt(held), held.surpKind,
                 hz, hyw > 0 ? drowsyOf(hea) : 0, hyw);
    ctx.restore();
  }

  // エフェクト
  // さきに「はしる子の ひかり」だけを ぜんぶ えがく。
  // 1つずつ ひかり→体 の順で えがくと、うしろの子の ひかりが
  // 前の子の 体を 白く 消してしまう（実際に そうなっていた）。
  for (const f of fx){
    if (f.t !== "run") continue;
    const k = 1 - f.age/f.life;
    const fade = k > .86 ? (1-k)/.14 : 1;
    const pop  = Math.min(1, f.age / .16);
    const sc   = (f.s || 1.8) * (0.55 + 0.45*pop);
    const hop  = Math.abs(Math.sin(f.age*14 + f.ph)) * 13;
    const R    = TIERS[LAST].r;
    ctx.save();
    ctx.globalAlpha = Math.max(0, fade) * .55;
    ctx.translate(f.x, f.y - hop);
    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, R*sc*1.9);
    gl.addColorStop(0,  "rgba(255,255,255,.75)");
    gl.addColorStop(.45,"rgba(255,255,255,.35)");
    gl.addColorStop(1,  "rgba(255,255,255,0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, R*sc*1.9, 0, 7); ctx.fill();
    ctx.restore();
  }

  for (const f of fx){
    const k = 1 - f.age/f.life;
    ctx.save();
    if (f.t === "p"){
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = f.c;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r*k, 0, 7); ctx.fill();
    } else if (f.t === "r"){
      ctx.globalAlpha = Math.max(0, k*.8);
      ctx.strokeStyle = f.c; ctx.lineWidth = 4*k + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1-f.r0)*(1-k), 0, 7); ctx.stroke();
    } else if (f.t === "h"){
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = "#ff8fb0";
      drawHeart(ctx, f.x, f.y, 7*k + 3);
    } else if (f.t === "st"){
      ctx.globalAlpha = Math.max(0, k);
      ctx.save();
      ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.fillStyle = f.c;
      star(0, 0, f.s * (.4 + .6*k));
      ctx.restore();
    } else if (f.t === "run"){
      // なかよく かけていく ひよこ。
      // 山の上に かさなるので、うしろに やわらかい ひかりを しいて 見わけられるように する
      const fade = k > .86 ? (1-k)/.14 : 1;
      const pop  = Math.min(1, f.age / .16);                 // ぽんっと 出てくる
      const sc   = (f.s || 1.8) * (0.55 + 0.45*pop);
      const hop  = Math.abs(Math.sin(f.age*14 + f.ph)) * 13;  // 元気な ステップ
      const R    = TIERS[LAST].r;
      ctx.globalAlpha = Math.max(0, fade);
      ctx.save();
      ctx.translate(f.x, f.y - hop);

      // あしもとの かげ（うくのではなく、じめんを けって はしっている）
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade) * .16;
      ctx.fillStyle = "#8a5f70";
      ctx.beginPath();
      ctx.ellipse(0, hop + R*sc*.95, R*sc*.7, R*sc*.16, 0, 0, 7);
      ctx.fill();
      ctx.restore();

      ctx.scale(sc, sc);
      ctx.rotate(f.dir * (.14 + Math.sin(f.age*14 + f.ph) * .12));
      drawCreature(ctx, LAST, R, f.age*3 + f.ph, 1, 0, 1, 0, 1);
      ctx.restore();
    } else if (f.t === "zz"){
      const k2 = Math.max(0, k);
      ctx.globalAlpha = k2 > .75 ? (1-k2)/.25 : k2/.75;     // ふわっと 出て ふわっと 消える
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(Math.sin(f.age*2.4) * .18);
      const sc = f.s * (.8 + .4*(1-k2));
      ctx.font = `bold ${(15*sc).toFixed(1)}px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif`;
      ctx.textAlign = "center";
      ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.95)";
      ctx.strokeText("z", 0, 0);
      ctx.fillStyle = "#8f78c4"; ctx.fillText("z", 0, 0);
      ctx.textAlign = "start";
      ctx.restore();
    } else if (f.t === "txt"){
      const rise = Math.min(1, f.age/.2);
      ctx.globalAlpha = Math.max(0, k > .7 ? 1 : k/.7);
      ctx.textAlign = "center";
      ctx.font = `bold ${16 + 4*rise}px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.lineJoin = "round";
      ctx.strokeText(f.s, f.x, f.y);
      ctx.fillStyle = "#F2789A";
      ctx.fillText(f.s, f.x, f.y);
      ctx.textAlign = "start";
    } else if (f.t === "ln"){
      ctx.globalAlpha = Math.max(0, k) * .75;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - Math.sign(f.vx)*f.len, f.y);
      ctx.stroke();
    } else if (f.t === "fl"){
      // 光過敏の 目やすは「1びょうに3かいまで・輝度差10%まで」。
      // .55 だと 暗いテーマで 33% ふれるので .22 に おとしてある。
      ctx.globalAlpha = Math.max(0, k*k) * .22;
      ctx.fillStyle = "#fffbe6";
      ctx.fillRect(0, 0, CW, CH);
    }
    ctx.restore();
  }

  drawOverMark();
  drawOhirune();
  drawCountdown();
  drawChainText();
  drawClearText();

  ctx.restore();
  miniTick++;
  if (miniDirty()){ drawNext(); drawKeep(); }
  if (state === "title") drawTitleArt();
  if (uiShockT > 0 || uiShockWait > 0){
    drawRisePreview();
    renderChainBar(uiSurp());
  }
}

/* せり上がりの しゅんかん、ゆかの下が ひかる */
function drawRiseGlow(){
  if (riseGlow <= 0) return;
  const top = floorY + 2, bot = CH - 2, h = bot - top;
  if (h < 3) return;
  const k = 1 - riseGlow / RISE_GLOW_T;        // 0 → 1
  const a = Math.sin(Math.PI * Math.min(1, k*1.12));   // ふわっと 出て きえる
  if (a <= 0.01) return;

  const L = WALL_L - 5, W = (WALL_R - WALL_L) + 10;
  ctx.save();
  roundRect(ctx, 0, 0, CW, CH, 20); ctx.clip();

  // 下から わきあがる ひかり
  const grd = ctx.createLinearGradient(0, bot, 0, top);
  grd.addColorStop(0,  `rgba(255,255,255,0)`);
  grd.addColorStop(.45, `rgba(255,246,205,${.5*a})`);
  grd.addColorStop(1,  `rgba(255,255,255,${.92*a})`);
  ctx.fillStyle = grd;
  ctx.fillRect(L, top, W, h);

  // のぼる ひかりの すじ
  const N = 9;
  for (let i = 0; i < N; i++){
    const ph = i * 1.7;
    const bx = L + (i + .5) * (W / N) + Math.sin(time*2 + ph) * 5;
    const bw = 5 + 9 * (.5 + .5*Math.sin(time*3.4 + ph));
    const bh = h * (.35 + .65 * Math.min(1, k*1.5 + .15*Math.sin(ph)));
    const bg = ctx.createLinearGradient(0, bot, 0, bot - bh);
    bg.addColorStop(0, `rgba(255,255,255,${.55*a})`);
    bg.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.fillStyle = bg;
    ctx.fillRect(bx - bw/2, bot - bh, bw, bh);
  }

  // ゆかの すぐ下の まぶしい すじ
  ctx.fillStyle = `rgba(255,255,255,${.95*a})`;
  ctx.fillRect(L, top, W, 2 + 7*a);
  ctx.fillStyle = `rgba(255,236,150,${.7*a})`;
  ctx.fillRect(L, top + 2 + 7*a, W, 2 + 5*a);

  ctx.restore();
}

/* すその 絵。**かべ・クッションより 前**に よぶ こと
   （あとに よぶと のぼって くる子が クッションの 上に のって、
   「ゆかの 前を 通って いる」ように 見える）。 */
/* **うすい子は「1枚の 絵」に してから 貼る こと。**（2026-09-22・作者の 実機写真から）
   `globalAlpha` を かけた まま `drawCreature` を よぶと、**図形ごとに** 背景と まざる。
   耳の うち 体と かさなる ぶんは 2回 まざって こく なり、
   体から はみ出した ぶんは 1回 しか まざらない ので **そこだけ すけて 見えた**
   （パンダの 黒い 耳が 灰色に、ブタと きつねの 耳から しましまが すけて いた）。
   いちど 不とうめいで 紙に えがいて、その 紙を うすく 貼れば むらが 出ない。

   **紙は 1枚を 使いまわす こと。** 毎フレーム 作ると 電力の 予算が こわれる。
   いちばん 大きい子（r=64）に 合わせて 1回 とる。耳は 1.22r（線の ふとさこみで
   1.25r）まで はみ出す ので、よゆうを 見て 2.8r 角。
   **`dpr` を 忘れない こと。** 本体の ctx は `setTransform(dpr,…)` で
   ゲームの ものさしに して ある ので、紙も 同じに しないと ぼける。

   〔やらなかった 道〕**うすくするのを やめる**（`globalAlpha` を 外す）。
   1行で すむし すけも 消えるが、床下の 子が くっきり 手前に 見えて、
   設計判断6-E(14)「遠くに いる」という 見せ方が 消える。戻す なら そこを 承知で。 */
let farCv = null, farCtx = null, farS = 0;
function farDraw(dst, tier, rr, x, y, alpha){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const need = Math.ceil(rr * 2.8) + 4;
  if (!farCv || farS < need || farCv.width !== farS * dpr){
    farS = Math.max(need, Math.ceil(64 * 2.8) + 4);
    farCv = document.createElement("canvas");
    farCv.width = farS * dpr; farCv.height = farS * dpr;
    farCtx = farCv.getContext("2d");
  }
  farCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  farCtx.clearRect(0, 0, farS, farS);
  farCtx.save();
  farCtx.translate(farS / 2, farS / 2);
  drawCreature(farCtx, tier, rr, tier * 1.3, 1, 0, 0, 0, 1);
  farCtx.restore();
  dst.globalAlpha = alpha;
  dst.drawImage(farCv, x - farS / 2, y - farS / 2, farS, farS);
  dst.globalAlpha = 1;
}
function drawUnderFloor(){
  if (state === "title") return;
  const top = floorY, bot = CH + SKIRT;
  // **カゴの 下じきは `ensurePanel` が すそまで 焼いて いる。** ここでは 影だけ。
  ctx.save();
  roundRect(ctx, WALL_L, top, WALL_R - WALL_L, bot - top, 14);
  ctx.clip();
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, "rgba(96,74,88,.05)");
  g.addColorStop(1, "rgba(96,74,88,.17)");
  ctx.fillStyle = g;
  ctx.fillRect(WALL_L, top, WALL_R - WALL_L, bot - top);

  // のぼって くる子
  if (state === "play" && spawnRows){
    if (liftT > 0){
      // riseRow が もう 本物を 作って いる。ここでは 何も しない
      // （本物は たまの ループで、ずらして えがかれる）
    } else if (nextRow && nextRow.items.length){
      // **よこく。** せり上がる RISE_PEEK 秒前から すその 下ぎりぎりに 顔を 出し、
      // 時計が 進むほど ゆかへ 近づく。**とうちゃく地点は「ゆかの すぐ下」**
      // ＝ riseRow が `nb.lift = 2r` で つづきを 引きつぐ ばしょ。
      /* **いつも 見えて いる こと。** 予告の 見本（小さい キャンバス）を
         やめた ので、「つぎに 誰が 来るか」を 伝えるのは ここだけに なった。
         まだ 遠い あいだは すその 下に **小さく まるごと えがいて** 停めて おき、
         RISE_PEEK 秒前から のぼりはじめる。 */
      {
        /* 〔やって みて だめだった 道〕**頭を 何px 出すか**で 調整する やりかた。
           20px 決め打ち → ゆかした 54px の 端末で 画面の 上 13px、
           かたまりに しか 見えない → 半分（27px＝画面18px）に 増やした →
           それでも 作者の 実機で「だめかな」。**戻さない こと。**
           らいおんは たて128px。ゆかしたが 54px しか ない 端末では
           **何px 出しても 顔（目）は 入らない**── 量の 問題では なかった。 */
        /* 【2026-09-19 その2】**頭を 出す 量**では なく **遠近**で 見せる。
           実機（iPhone SE3・ゆかした 54px）を 見て もらったら
           「だめかな」── 半分（27px）出しても 出るのは たてがみと 耳の 先だけで、
           **目が 一つも 見えない**。らいおんは たて128px も あるので、
           ゆかしたが 54px しか ない 端末では **どう 頭を 出しても 顔は 入らない**。
           なので 遠い あいだは **まるごと 小さく** えがいて、近づく ほど 大きく する。
           * 遠い とき ＝ 顔が まるごと ゆかしたに 入る 大きさ（たて＝ゆかしたの 8わり）
           * 近づく ほど 1.0 に もどり、**とうちゃくは いままでと 同じ**
             （頭の てっぺんが ゆかの 線、＝ riseRow が 引きつぐ ばしょ）
           のぼる きょりは 短く なるが、**大きく なる こと じたいが 近づく 動き**に
           なるので、「じわじわ 近づく」は のこる。
           かわりに **ぜんぶの 子が 遠くでは 同じくらいの 大きさ**に 見える。
           これは わざと ── ここは「つぎに 誰が 来るか」の 知らせなので、
           大きさの ちがいより **顔が 分かる ほう**を 取った。 */
        const band = bot - floorY;
        const left = Math.max(0, riseT);
        const u = left >= RISE_PEEK ? 0 : 1 - left / RISE_PEEK;   // 0 → 1
        /* **なめらか（smoothstep）に しては いけない。** あれは おわりで
           速さが 0 に なる ので、すりぬけの しゅんかんに いきなり 加速して
           見え、「ポンっ」が のこる。おわりに 向かって 速くする。
           すそが 32 → 80 に なって のぼる きょりが 41 → 82px に ふえた ので、
           u*u*u（さいごの 3秒に かたまる）から **u*u** に ゆるめた。 */
        const e = u*u;
        const off = nextRow.off;
        for (const o of nextRow.items){
          const t = TIERS[o.t], r = t.r;
          /* 上を .85 で 止めて あるのは **大きさの 順番を こわさない** ため。
             1.0 まで 許すと、ゆかしたが 広い 端末で こあら（たて72）だけ
             等身大の まま、らいおん（たて128）が .64 に なって
             **ちいさい子の ほうが 大きく 見える**。
             みんな すこしずつ 小さい ほうが「遠くに いる」に も なる。 */
          const kFar = Math.max(.30, Math.min(.85, (band * .80) / (r * 2)));
          const k  = kFar + (1 - kFar) * e;        // 遠い → 近い で 1.0 に もどる
          const rr = r * k;
          /* **頭の てっぺん**で 合わせる こと。まんなかで 合わせると
             大きく なる ぶん だけ てっぺんが 上に はみ出して、
             ゆかを くぐる まえに 顔が 出て しまう。 */
          const topEnd   = floorY;                 // ← ここは 変えない
          const topStart = bot - r * kFar * 2;     // すその そこに ぴたりと 置く
          const top = topStart + (topEnd - topStart) * e;
          const cy = top + rr;
          if (top > bot) continue;
          // **`globalAlpha` を かけて drawCreature を よばない こと**（耳が すける）。
          // 上の farDraw の コメントを 見ること。
          ctx.save();
          farDraw(ctx, o.t, rr, off + o.x, cy, .62 + .38 * e);
          ctx.restore();
        }
      }
    }
  }
  ctx.restore();
}
/* ゆかより 下に はみ出して いる ものを くらくして、クッションを 描きなおす。
   **たまを えがいた あとに よぶ こと。** これが ないと、すりぬけて いる子が
   クッションの 上に べったり 乗って 見える。 */
function drawUnderShade(){
  if (state === "title") return;
  const top = floorY, bot = CH + SKIRT;
  ctx.save();
  roundRect(ctx, WALL_L, top, WALL_R - WALL_L, bot - top, 14);
  ctx.clip();
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, "rgba(96,74,88,.05)");
  g.addColorStop(1, "rgba(96,74,88,.22)");
  ctx.fillStyle = g;
  ctx.fillRect(WALL_L, top, WALL_R - WALL_L, bot - top);
  ctx.restore();
  // クッションを もういちど 上に。**下に 何も いない ときは やらない**
  // （毎フレーム 22個の 弧。電力の 予算を むだに しない）
  if (liftT <= 0 && !(spawnRows && state === "play" && riseT < RISE_PEEK)) return;
  const warn2 = riseT < 3 && state === "play";
  ctx.fillStyle = warn2 ? `rgba(255,150,180,${.55+.45*Math.sin(time*14)})` : TH.cush;
  for (let x = WALL_L + 9; x < WALL_R - 2; x += 17){
    ctx.beginPath(); ctx.arc(x, floorY + 9, 8.5, Math.PI, 0); ctx.fill();
  }
}

/* いま 絵を どれだけ 下に ずらすか（0=定位置）。
   すりぬけの あいだ だけ 効く。**中の 座標は 触らない こと。** */
function liftAmt(b){
  if (liftT <= 0) return 0;
  const e = liftT / LIFT_SEC;                 // 1 → 0
  const k = e*e*(3 - 2*e);                    // なめらかに 減速して 定位置へ
  if (b.lift) return b.lift * k;              // 下から のぼって くる子
  return liftH * k;                           // 積んであって 押し上げられた子
}
/* すりぬけ中の 見た目の y。
   **のぼって くる子 いがいは ゆかより 下に えがかない。**
   ずらすと 一瞬 クッションに めりこんで「沈んで いる」ように 見える。 */
function drawY(b){
  const y = b.y + liftAmt(b);
  return b.lift ? y : Math.min(y, floorY - b.r);
}

/* ラインを こえている あいだの カウントダウン */
function drawCountdown(){
  if (state !== "play" || overCount >= OVER_GRACE) return;
  const t = Math.max(0, overCount);
  const p = t / OVER_GRACE;
  const cx = CW/2, cy = DANGER + 92, R = 40;
  const pulse = .5 + .5*Math.sin(time*11);
  const urgent = t <= 2;

  ctx.save();
  // うしろの まる
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,120,150,${.35 + .3*pulse})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();

  // へっていく わ
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(255,205,218,.9)"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(cx, cy, R - 6, 0, 7); ctx.stroke();
  ctx.strokeStyle = urgent ? `rgba(255,40,80,${.75 + .25*pulse})` : "#FF6E92";
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.arc(cx, cy, R - 6, -Math.PI/2, -Math.PI/2 + Math.PI*2*p);
  ctx.stroke();

  // すうじ（1びょう ごとに ぽん と 大きく）
  const n = Math.max(1, Math.ceil(t));
  const grow = 1 + .22 * Math.max(0, 1 - (Math.ceil(t) - t) * 5);
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(grow, grow);
  ctx.font = 'bold 38px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = 8; ctx.strokeStyle = "#ffffff";
  ctx.strokeText(n, 0, 3);
  ctx.fillStyle = urgent ? "#FF1F52" : "#FF4D77";
  ctx.fillText(n, 0, 3);
  ctx.restore();

  ctx.restore();

  // 「あぶない！」は こえている子の すぐ よこに
  const w = dangerBall;
  if (!w) return;
  ctx.save();
  ctx.font = 'bold 14px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tw = ctx.measureText("あぶない！").width;
  const pw = tw + 16, ph = 21;
  const side = w.x < CW/2 ? 1 : -1;                       // ひろい方に よせる
  let lx = w.x + side * (w.r + 10 + pw/2);
  lx = Math.max(pw/2 + 6, Math.min(CW - pw/2 - 6, lx));
  const ly = Math.max(ph/2 + 6, w.y - w.r*.15);

  // まるい印
  ctx.strokeStyle = `rgba(255,45,85,${.55 + .45*pulse})`;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(w.x, w.y, w.r + 6, 0, 7); ctx.stroke();
  // つなぎ線
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(lx - side*pw/2, ly);
  ctx.lineTo(w.x + side*(w.r + 3), ly);
  ctx.stroke();
  // ふきだし
  ctx.fillStyle = "rgba(255,255,255,.96)";
  roundRect(ctx, lx - pw/2, ly - ph/2, pw, ph, ph/2); ctx.fill();
  ctx.strokeStyle = `rgba(255,45,85,${.7 + .3*pulse})`; ctx.lineWidth = 2.5;
  roundRect(ctx, lx - pw/2, ly - ph/2, pw, ph, ph/2); ctx.stroke();
  ctx.fillStyle = "#FF2D55";
  ctx.fillText("あぶない！", lx, ly + 1);
  ctx.restore();
}

/* ゲームオーバー：こえた子を いちばん手前で 指ししめす。
   **出しっぱなしに しない（2026-09-17）。** けっか画面は 見送った子が
   よこに 走る 場に した のに、その うしろで **赤い輪が ずっと 点滅し、
   動物が 1匹 名ざしで 囲まれた まま**だった ── ストアの スクショで
   「気の どくに 見える」として 避けた 構図 そのもの。
   知らせる 値うちが あるのは 死んだ しゅんかん だけ なので 2.2びょうで 引く。
   **「やめる」で 終えた ときは はじめから 出さない。**
   こえて いないのに「こえちゃった！」は ただの 嘘だった。 */
/* おためし：おひるね中の 画面 */
function drawOhirune(){
  if (!ohPhase) return;
  const A = Math.max(zzzAmt, 1 - timeAmt);       // 下じきは スローダウンから すっと 入る
  if (A <= .003) return;
  ctx.save();
  ctx.fillStyle = `rgba(60,48,80,${(.17*A).toFixed(3)})`;
  ctx.fillRect(0, 0, CW, CH);

  // ことばは **ずらせる ときだけ** 出す。眠りに 入る あいだは 絵だけを 見せる
  if (ohPhase >= 4){
    const show = ohPhase === 4 ? 1 : zzzAmt;
    ctx.globalAlpha = show;
    const p = ohPhase === 4 ? Math.max(0, Math.min(1, ohT / OHIRUNE_SEC)) : 1;
    const bw = CW - 80, bx = 40, by = DANGER + 30;
    ctx.fillStyle = "rgba(255,255,255,.75)";
    roundRect(ctx, bx, by, bw, 9, 5); ctx.fill();
    ctx.fillStyle = "#b79bdf";
    roundRect(ctx, bx, by, bw * p, 9, 5); ctx.fill();
    ctx.textAlign = "center";
    ctx.font = 'bold 20px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
    ctx.lineJoin = "round"; ctx.lineWidth = 6; ctx.strokeStyle = "#ffffff";
    // **「おひるね中」。**（2026-09-20・作者）「おひるね」だけだと
    //  見出しに 見えて、いま 止まって いる ことが 伝わらない。
    ctx.strokeText("おひるね中", CW/2, by - 14);
    ctx.fillStyle = "#7a5ba6"; ctx.fillText("おひるね中", CW/2, by - 14);
    ctx.font = 'bold 12px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeText("そっと うごかせるよ", CW/2, by + 28);
    ctx.fillStyle = "#6b5470"; ctx.fillText("そっと うごかせるよ", CW/2, by + 28);
    ctx.textAlign = "start";
  }
  if (dragB && !dragB.dead){
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(dragB.x, dragB.y, dragB.r + 6, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function drawOverMark(){
  if (state !== "over" || overMarkT <= 0) return;
  let worst = overBall && balls.includes(overBall) ? overBall : null;
  if (!worst) for (const b of balls) if (!worst || b.y - b.r < worst.y - worst.r) worst = b;
  if (!worst || worst.y - worst.r >= DANGER) return;

  const bl = .55 + .45*Math.sin(time*7);
  const col = `rgba(255,60,100,${.8*bl + .2})`;
  ctx.save();
  ctx.globalAlpha = Math.min(1, overMarkT / .6);      // さいごの 0.6びょうで すっと 引く

  // まるい印
  ctx.strokeStyle = col; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(worst.x, worst.y, worst.r + 7, 0, 7); ctx.stroke();

  const txt = "こえちゃった！";
  ctx.font = 'bold 12px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  const pw = ctx.measureText(txt).width + 20, ph = 24;
  const upper = worst.y - worst.r - 20;
  const up = upper > 108;                       // 上に すきまが あるか
  const ly = up ? upper : worst.y + worst.r + 28;
  const lx = Math.max(pw/2 + 8, Math.min(CW - pw/2 - 8, worst.x));

  // ゆびさし
  ctx.strokeStyle = col; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(lx, ly + (up ? ph*.5 : -ph*.5));
  ctx.lineTo(worst.x, worst.y + (up ? -worst.r - 8 : worst.r + 8));
  ctx.stroke();

  // ふきだし（下の絵を かくして 読めるように）
  ctx.fillStyle = "rgba(255,255,255,.96)";
  roundRect(ctx, lx - pw/2, ly - ph/2, pw, ph, ph/2); ctx.fill();
  ctx.strokeStyle = "rgba(255,90,125,.9)"; ctx.lineWidth = 2.5;
  roundRect(ctx, lx - pw/2, ly - ph/2, pw, ph, ph/2); ctx.stroke();

  ctx.fillStyle = "#FF3C64";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(txt, lx, ly + 1);
  ctx.restore();
}

/* ど〜ん！と ぜんけし */
function drawClearText(){
  if (!clearFx) return;
  const k = clearFx.age / clearFx.life;
  if (k >= 1){ clearFx = null; return; }
  const pop = k < .14 ? .3 + 5.6*k : 1 + .09*Math.sin(clearFx.age*17);
  const alpha = k > .78 ? Math.max(0, (1 - k)/.22) : 1;
  const size = 62;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(CW/2, DANGER + 190);
  ctx.rotate(Math.sin(clearFx.age*9) * .05);
  ctx.scale(pop, pop);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";

  const label = "ぜんけし！";
  ctx.font = `bold ${size}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`;
  ctx.fillStyle = "rgba(150,110,130,.22)";
  ctx.fillText(label, 4, 6);
  ctx.lineWidth = size*.26; ctx.strokeStyle = "#ffffff";
  ctx.strokeText(label, 0, 0);

  const grd = ctx.createLinearGradient(-size*2, 0, size*2, 0);
  RAINBOW.forEach((c, i) => grd.addColorStop(i/(RAINBOW.length-1), c));
  ctx.fillStyle = grd;
  ctx.fillText(label, 0, 0);

  // まわりを まわる ほし
  for (let i = 0; i < 8; i++){
    const a = clearFx.age*3.6 + i*(Math.PI*2/8);
    const rr = size*2.1 + Math.sin(clearFx.age*8 + i)*size*.18;
    ctx.save();
    ctx.translate(Math.cos(a)*rr, Math.sin(a)*rr*.42);
    ctx.rotate(a*2);
    ctx.fillStyle = RAINBOW[i % RAINBOW.length];
    star(0, 0, size*.2);
    ctx.restore();
  }

  ctx.font = `bold ${size*.3}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`;
  ctx.lineWidth = size*.1; ctx.strokeStyle = "#ffffff";
  const sub = clearFx.n + "人 全消し ＋" + Math.ceil(clearFx.n/3) + "点";   // 実加算（clearAll）と そろえる
  ctx.strokeText(sub, 0, size*.82);
  ctx.fillStyle = "#7a6154";
  ctx.fillText(sub, 0, size*.82);
  ctx.restore();
}

/* ど〜ん！と れんさ数 */
function drawChainText(){
  if (!chainFx) return;
  const live = chainFx.live;
  const k = chainFx.age / chainFx.life;
  if (!live && k >= 1){ chainFx = null; return; }
  // ほけん：れんさが とだえているのに live のまま のこっていたら 消す
  if (live && chainT <= 0){ chainFx = null; return; }
  const n = chainFx.n;
  const cols = chainColors(n);

  // でてくる → ぷるぷる → きえる（のびてる あいだは 消えない）
  const pop = (chainFx.age < .13 ? .4 + 4.6*chainFx.age : 1 + .07*Math.sin(chainFx.age*20))
              * (live ? .78 : 1);
  const alpha = (!live && k > .78) ? Math.max(0, (1 - k)/.22) : 1;
  const size = (live ? 34 : 46) + Math.min(26, (n - CHAIN_MIN)*5);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(CW/2, DANGER + 252);
  ctx.rotate(Math.sin(chainFx.age*11) * .05);
  ctx.scale(pop, pop);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";

  const label = live ? (n + " 連鎖") : (n + " 連鎖!!");
  ctx.font = `bold ${size}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`;

  // かげ
  ctx.fillStyle = "rgba(150,110,130,.22)";
  ctx.fillText(label, 3, 5);
  // しろふち
  ctx.lineWidth = size*.24; ctx.strokeStyle = "#ffffff";
  ctx.strokeText(label, 0, 0);
  ctx.lineWidth = size*.1; ctx.strokeStyle = cols[cols.length-1];
  ctx.strokeText(label, 0, 0);
  // なかみ
  const grd = ctx.createLinearGradient(0, -size*.6, 0, size*.6);
  grd.addColorStop(0, cols[cols.length-1]);
  grd.addColorStop(.45, cols[0]);
  grd.addColorStop(1, cols[1] || cols[0]);
  ctx.fillStyle = grd;
  ctx.fillText(label, 0, 0);

  // まわりで まわる ほし
  const ns = Math.min(8, 3 + (n - CHAIN_MIN));
  for (let i = 0; i < ns; i++){
    const a = chainFx.age*3.4 + i*(Math.PI*2/ns);
    const rr = size*1.9 + Math.sin(chainFx.age*7 + i)*size*.16;
    ctx.save();
    ctx.translate(Math.cos(a)*rr, Math.sin(a)*rr*.46);
    ctx.rotate(a*2);
    ctx.fillStyle = cols[i % cols.length];
    star(0, 0, size*.2);
    ctx.restore();
  }

  if (!live && chainFx.bonus){
    if (n >= 6){
      ctx.font = `bold ${size*.34}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`;
      ctx.lineWidth = size*.11; ctx.strokeStyle = "#ffffff";
      const sub = n >= 8 ? "しんじられない！！" : "すごい！";
      ctx.strokeText(sub, 0, size*.76);
      ctx.fillStyle = cols[0];
      ctx.fillText(sub, 0, size*.76);
    }
    const by = size * (n >= 6 ? 1.12 : .82);
    ctx.font = `bold ${size*.28}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`;
    ctx.lineWidth = size*.1; ctx.strokeStyle = "#ffffff";
    ctx.strokeText(chainFx.bonus, 0, by);
    ctx.fillStyle = "#5FAE7A";
    ctx.fillText(chainFx.bonus, 0, by);
  }
  ctx.restore();
}

function surpAmt(b){
  if (!b || b.surpT <= 0) return 0;
  const inT = b.surpDur - b.surpT;
  return Math.max(0, Math.min(1, Math.min(inT/.07, b.surpT/.3)));
}
function makeShock(b, wait, dur, kind){
  b.surpWait = wait; b.surpQ = dur; b.surpKindQ = kind || 1;
  b.smileT = 0;
  b.smileNext = wait + dur + rnd(.05, .6);
}
function stepFace(b, dt){
  b.blink -= dt;
  if (b.blink <= 0){ b.blinkT = .13; b.blink = rnd(2.2, 7); }
  if (b.blinkT > 0) b.blinkT -= dt;
  if (b.surpWait > 0){
    b.surpWait -= dt;
    if (b.surpWait <= 0 && b.surpQ > 0){
      b.surpT = b.surpQ; b.surpDur = b.surpQ; b.surpQ = 0;
      b.surpKind = b.surpKindQ;
    }
  }
  if (b.surpT > 0) b.surpT -= dt;
  b.smileNext -= dt;
  if (b.smileNext <= 0 && b.smileT <= 0 && b.surpT <= 0 && b.surpQ <= 0)
    makeSmile(b, rnd(1.0, 1.9));
  if (b.smileT > 0) b.smileT -= dt;
}

function smileAmt(b){
  if (!b || b.smileT <= 0) return 0;
  const inT = b.smileDur - b.smileT;
  return Math.max(0, Math.min(1, Math.min(inT/.18, b.smileT/.28)));
}
function makeSmile(b, d){
  b.smileT = d; b.smileDur = d; b.smileNext = rnd(6, 16);
}

function blinkAmt(b){
  if (b.blinkT > 0) {
    const p = 1 - b.blinkT / .13;
    return Math.abs(p*2 - 1) < .9 ? Math.max(.05, Math.abs(p*2-1)) : 1;
  }
  return 1;
}

function cloud(x, y, r){
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 7);
  ctx.arc(x + r*.85, y + r*.15, r*.72, 0, 7);
  ctx.arc(x - r*.85, y + r*.2, r*.6, 0, 7);
  ctx.fill();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r);
  g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);
  g.arcTo(x, y, x+w, y, r);
  g.closePath();
}
function drawHeart(g, x, y, s){
  g.save(); g.translate(x, y); g.scale(s/10, s/10);
  g.beginPath();
  g.moveTo(0, 4);
  g.bezierCurveTo(-9, -3, -5, -10, 0, -5);
  g.bezierCurveTo(5, -10, 9, -3, 0, 4);
  g.fill(); g.restore();
}

/* ============================================================
   ながれ
   ============================================================ */
/* **けっか画面では、その回に 見送った子が よこに 走る（2026-09-17）。**
   さいごに 目に 入るのが 「詰まった 盤面 ＋ もう いっぱい…」 だった。
   ストアの スクショで「動物を 詰め込んで 気の どくに 見える」として 避けた
   まさに その 構図が、**毎ゲームの 締めくくり**に なって いた。
   見送りが 看板の ゲームなら、締めは その回に 送りだした子たち であるべき。

   **1人も 見送れなかった 回は 何も 出さない。** 出す ものが ないのが
   正しい（つぎは 見たい、に なる）。空の 行列を でっちあげない こと。
   **音は 出さない。** 決着の 音と かさなる。
   **走るのは よこ。** 上へ 浮かせない（設計判断3）。 */
let paradeN = 0, paradeI = 0, paradeT = 0, paradeDir = 1;
const PARADE_GAP = 88;               // ひと組 2ひきの あいだ。popFx と 同じ 値
function startParade(){
  paradeN = Math.min(pops * 2, 8);     // 1かいの 見送りで 2ひき。多すぎても 8ひきで 止める
  paradeI = 0; paradeT = .9;           // 決着の 音が 鳴りおわってから
  paradeDir = 1;
}
function stopParade(){ paradeN = 0; paradeI = 0; }
function stepParade(dt){
  overMarkT = Math.max(0, overMarkT - dt);
  if (paradeN <= 0 || state !== "over") return;
  paradeT -= dt;
  if (paradeT > 0) return;
  if (paradeI >= paradeN){                    // ひとめぐり したら 間を おいて 反対がわから また
    paradeI = 0; paradeDir = -paradeDir; paradeT = 2.6; return;
  }
  // **山の 上を 走らせる。** けっか画面の 盤面は 定義上 いっぱいなので、
  // 高さを 決めうちに すると 積みあがった子に まぎれて 見えなく なる（popFx と 同じ りくつ）。
  let top = CH;
  for (const b of balls) if (!b.dead && b.y - b.r < top) top = b.y - b.r;
  const lane = Math.max(64, Math.min(DANGER + 30, top - 34));      // 64 より 上には 行かせない（見切れる）
  const dir = paradeDir;
  const sp = 205;
  const x0 = dir > 0 ? -44 : CW + 44;
  // **2ひきを ひと組で、同じ むきに 出す。**
  // 1ぴきずつ むきを 反転させて いた ころは、見送り1回（＝2ひき）の 回で
  // **左の子は 左へ、右の子は 右へ 走って 画面の まんなかで すれちがって いた**。
  // 設計判断3 は「**なかよく** よこに 走って 去る」で、読まれ方まで 決めて ある ところ。
  // いちばん 守るべき 絵が、けっか画面の 行列の 中で こわれて いた（2026-09-17 に 発見）。
  // むきを 変えるのは **ひとめぐりごと**。ひと組の 中では 変えない こと。
  for (let k = 0; k < 2 && paradeI < paradeN; k++, paradeI++){
    const back = k * PARADE_GAP;                       // うしろの子は そのぶん 手前から
    fx.push({ t:"run", x: x0 - dir*back, y: lane, y0: lane, lane,
              vx: dir * sp, s: 1.5 - k*.05, ph: k * 1.15, dir,
              life: (CW + 110 + back) / sp, age: 0, puff: 0 });
  }
  paradeT = 1.0;                              // つぎの 組まで。組と 組は はっきり あける
}

function update(dt){
  const raw = dt;
  /* **すりぬけの 絵の ずらしは、おひるねより 前で 減らす こと。**（2026-09-19 マージ）
     これを 下（おひるねの 早期 return より あと）に 置くと、せり上がりの
     直後に おひるねが 始まった とき **絵が ずれた まま 凍る**。
     おひるね中は 指で 玉を つかめる のに、つかむ 判定は 本当の y を 見るので、
     **見えて いる ばしょと つかめる ばしょが 最大 128px ずれる**。
     ここで 減らせば ずれは どんなに 長くても 0.7秒で 消える。 */
  if (liftT > 0){ liftT = Math.max(0, liftT - raw); if (liftT === 0) for (const b of balls) b.lift = 0; }
  /* **画面ゆれ と UI の びっくりは、おひるねより 前で 生の dt で 減らす こと。**
     （2026-09-20・作者「昼寝中に全消しすると、演出が昼寝中ずっと継続してる」）
     もとは おひるねの 早期 return より **あと**に あった ので、
     眠って いる あいだ `shake` が 減らず、**全消しの 16 が そのまま 居すわって
     画面が 9秒ちかく ゆれつづけて いた**（実測：おひるねの あいだ ずっと 16）。
     `clearFx` や つぶつぶは `stepFx(raw)` で ちゃんと 消えて いた ので、
     **のこって いたのは ゆれだけ**だった ── それが いちばん 目につく。
     ゆれも びっくり顔も **ゲームの 時間では なく 画面の 都合**なので、
     `timeAmt` では なく 生の dt で 減らすのが 正しい。 */
  shake *= Math.pow(.02, raw);
  stepUiShock(raw);
  stepOhirune(raw);                      // 段どりは 生の dt（ここだけは 止まらない）
  // ③ねむる ④おひるね ⑤めざめ は **時間が 完全に 止まって いる**。
  // ただし 寝息と zzz は 動かす（静止させると 一時停止に 見える）。
  if (ohPhase >= 3 && ohPhase <= 5 && state === "play"){
    if (ohPhase === 4) stepFreeze(raw);
    stepFx(raw);
    return;
  }
  dt = raw * timeAmt;
  time += dt;
  landCool = Math.max(0, landCool - dt);
  heartCool = Math.max(0, heartCool - dt);
  riseGlow = Math.max(0, riseGlow - dt);
  stepFx(dt);
  stepParade(dt);          // けっか画面の 行列（state !== "play" でも うごく）

  for (const b of balls){
    b.age += dt;
    stepFace(b, dt);
    b.sqv += (-b.sq) * 55 * dt;
    b.sqv *= Math.pow(.02, dt);
    b.sq += b.sqv * dt;
  }
  if (held) stepFace(held, dt);

  if (state !== "play") return;

  elapsed += dt;
  if (lvBackCool > 0) lvBackCool -= dt;
  const lv = levelAt(elapsed - levelAdj);
  if (lv !== level){
    const down = lv < level;
    level = lv;
    gravity = gravityAt();
    ring(CW/2, CH/2, 260, down ? "#b8f0c8" : "#ffd0e2");
    if (down){
      beep(1180, .14, "triangle", .09);
      setTimeout(() => beep(880, .16, "triangle", .08), 110);
      setTimeout(() => beep(660, .2, "sine", .07), 230);
    } else {
      beep(880, .12, "triangle", .08);
      setTimeout(() => beep(1180, .14, "triangle", .07), 110);
    }
    updateRiseBar();
  }

  riseT -= dt;
  if (riseT <= 0){
    riseRow();
    riseSpan = riseInterval();
    riseT = riseSpan;
  }

  step(dt);
  balls = balls.filter(b => !b.dead);

  const c = balls.length;
  if (c !== cur){
    cur = c;
    if (cur > runBest) runBest = cur;
    if (scoreNow() > best) best = scoreNow();
    updateHUD();
    if (scoreNow() > bestRef()) setBestRef(scoreNow());   // おわらなくても 記録は のこす
  }

  // おだいの しんちょく
  raiseMission("collect", cur);      // お題が出てからの さいだい同時数
  let nBear = 0;
  for (const b of balls) if (b.tier === 0) nBear++;
  raiseMission("bear", nBear);
  for (let i = 0; i < missions.length; i++){
    const m = missions[i];
    if (m && !m.done && m.id === "live"){
      const v = elapsed - m.t0;
      if (v > m.prog){ m.prog = v; if (m.prog >= m.need) completeMission(i); }
    }
  }
  if (chainT > 0){
    chainT -= dt;
    if (chainT <= 0){
      if (chain >= CHAIN_MIN) chainFinale(chain, chainX, chainY);
      chain = 0;
    }
  }

  for (let i = 0; i < missions.length; i++){
    const m = missions[i];
    if (m && m.done){
      m.doneT -= dt;
      if (m.doneT <= 0){
        missions[i] = newMission();      // ここで はじめて 入れ替わる
        msEls[i].classList.remove("clear");
        renderMissions();
      }
    }
  }

  msTick += dt;
  if (msTick > .12){ msTick = 0; renderMissions(); updateRiseBar(); }
  // 「やめる」の かくにんは しばらくで もどる
  if (giveUpArm > 0){
    giveUpArm -= dt;
    if (giveUpArm <= 0 && giveUpBtn){ giveUpBtn.textContent = "やめる";
                                      giveUpBtn.classList.remove("arm"); }
  }
  hudTick += dt;
  if (hudTick > .5){                                    // じかん点が のびるので さだんに 更新
    hudTick = 0;
    const sc = scoreNow();
    if (sc > best) best = sc;
    if (sc > bestRef()) setBestRef(sc);
    updateHUD();
  }
  saveTick += dt;
  if (saveTick > 10){ saveTick = 0; saveRec(); }          // 10びょうごとに 保存

  dropLock = Math.max(0, dropLock - dt);
  if (!held && dropLock <= 0){
    held = newHeld(queue.shift());
    holdSpan = holdLimit(); holdT = holdSpan; tickAt = -1;
    keepUsed = false;
    refillQueue();
  }
  if (held){
    const t = TIERS[held.tier];
    held.x += (clampX(aimX, t.r) - held.x) * Math.min(1, dt*18);
    // かんがえじかん
    holdT -= dt;
    const sec = Math.ceil(holdT);
    if (sec <= 3 && sec >= 1 && sec !== tickAt){
      tickAt = sec;
      beep(620 + (4-sec)*130, .07, "square", .06);
    }
    if (holdT <= 0){
      shake = Math.max(shake, 3);
      beep(300, .12, "sawtooth", .07);
      // ねらいが 塞がって いても かならず どこかに 落とす（上の forcedDropX を 見ること）
      aimX = forcedDropX(held.r, held.tier);
      drop();
    }
  }

  // 上限ライン：こえたら OVER_GRACE びょうの ゆうよ
  let danger = false, worst = null;
  for (const b of balls){
    const sp = Math.hypot(b.vx, b.vy);
    // おちついて つみあがった子だけを かぞえる。
    // とんでいる子・のぼっている子を かぞえると カウントダウンが 誤爆する
    // **列ごとの 落下判定は `age` を 見ない。** ここが 分かれ目。
    //   `overLine`（OVER の カウントダウン用）は 0.8びょうの 猶予を もつ。
    //   とんで いる子・はねた子で **カウントダウンが 誤爆する**のを ふせぐ ため。
    //   ところが 列の 判定に そのまま つかうと、**着地して 止まって いるのに
    //   まだ 0.8びょう たって いない子が「いない」ことに なり、
    //   ちがう子でも 素通りで 落とせて しまう**（実測：見た目で こえて いる列への
    //   26回中 6回＝23% が すりぬけ。どれも age 0.48〜0.50・速さ1 の 静止中）。
    //   遊ぶ人には「上に のって いる子」に しか 見えないので、理くつが 通らない。
    //   止まって いるか どうか（sp / vy）だけで きめる。
    b.colOver = (b.y - b.r < DANGER && sp < 90 && b.vy > -10);
    if (b.y - b.r < DANGER && b.age > .8 && sp < 90 && b.vy > -10){
      b.overLine = true;                       // OVER の カウントダウン用
      b.danger = Math.min(1.6, b.danger + dt*2);
      danger = true;
      if (!worst || b.y - b.r < worst.y - worst.r) worst = b;
    } else {
      b.overLine = false;
      b.danger = Math.max(0, b.danger - dt*2);
    }
  }
  dangerBall = danger ? worst : null;
  if (danger){
    safeT = 0;
    overCount -= dt;
    const sec = Math.max(0, Math.ceil(overCount));
    if (sec !== tickSec){
      tickSec = sec;
      if (sec > 0) beep(560 + (OVER_GRACE - sec)*90, .11, "square", .1);
    }
    if (overCount <= 0){
      overBall = worst;
      gameOver();
      return;
    }
  } else {
    safeT += dt;
    if (safeT > .6 && overCount < OVER_GRACE){
      overCount = OVER_GRACE; tickSec = -1;
      if (safeT < .8) beep(1046, .14, "sine", .07);   // セーフの あいず
    }
  }
  overTimer = danger ? overTimer + dt : 0;
}

function clampX(x, r){
  return Math.max(WALL_L + r + 1, Math.min(WALL_R - r - 1, x));
}

/* ============================================================
   おとせるか どうかの 判定（列ごと）
   ============================================================ */
// 満杯の ところへ おとすと、めりこみ解消が あき場所まで はじき飛ばして しまう。
// それを ふせぐ ための 判定。
//
// **ばんめん ぜんたいを 止めては いけない。** さいしょは
// `dangerBall != null`（＝どこか 1か所でも ラインを こえたら ぜんぶ 止める）に して
// いたが、はしの 1列だけ 高く なった ときに **まだ ひろく 空いて いるのに
// どこにも おとせない** という 手づまりに なった。カウントダウン中に
// 崩しに いけないのは ゲームとして 理不尽。
//
// いまは **おとそうと して いる 列だけ** 見る。よそが つまって いても、
// 空いて いる ところには おとせる。
// じゃまに するのは `b.overLine`（＝OVER 判定と 同じ 基準で ラインを こえて
// おちついて いる子）だけ。とんでいる子・のぼっている子は かぞえない。
// **この きじゅんを 独自の ものに しないこと**（はやすぎ／おそすぎで どちらも こわれる）。
function columnBlocked(x, r, tier){
  // よこが かさなる 子の うち、**いちばん 上の子**＝さきに ぶつかる子 を さがす。
  let top = null;
  for (const b of balls){
    if (!b.colOver || b.merging || b.dead) continue;
    if (Math.abs(b.x - x) >= b.r + r) continue;     // よこが かさならない ＝ その子は 関係ない
    if (top === null || b.y < top.y) top = b;
  }
  if (!top) return false;

  // **おなじ子なら 落とせる。** ぶつかった しゅんかん 合体して 1つ 小さく なるので、
  // 山を ふやすのでは なく へらす。つまった ときの 逃げ道に なり、
  // 「同じ子を 見つける」という この ゲームの 本筋が そのまま 助けに なる。
  // 下に べつの子が いても 見ない。さきに さわるのは 上の子 だけなので。
  return top.tier !== tier;
}

/* かんがえじかんが きれた ときの おとしどころ。
   **時間切れで `drop()` が はやおわりすると、何も 起きない。**
   `holdT` は マイナスの ままなので **毎フレーム**「ブー」が 鳴って 画面が ゆれ、
   しかも **塞がった列を ねらい つづければ 時間切れが 効かない**（時間を かせげる）。
   時間切れは 止まる ことへの 罰なので、**かならず どこかに 落とす**。
   いちばん 近い あいて いる ところへ ずらす。
   どこも だめ＝ばんめんが 満杯の ときは、そのまま 落として 決着に まかせる。 */
function forcedDropX(r, tier){
  const x0 = clampX(aimX, r);
  if (!columnBlocked(x0, r, tier)) return x0;
  for (let d = 8; d <= CW; d += 8){
    for (const x of [x0 - d, x0 + d]){
      const xc = clampX(x, r);
      if (!columnBlocked(xc, r, tier)) return xc;
    }
  }
  return x0;
}

function drop(){
  if (state !== "play" || !held) return;
  
  // おとそうと して いる 列が つまって いたら おとさない（ほかの 列は おとせる）
  const dropX = clampX(aimX, held.r);
  if (columnBlocked(dropX, held.r, held.tier)){
    beep(330, .15, "sine", .05);      // 「ここには おとせない」の あいず（音）
    noDropT = .45; noDropX = dropX; noDropR = held.r;   // 　〃　（絵）
    return;
  }

  // つぎを 落とした しゅんかん、いまの れんさは そこで おしまい。
  // 「1回の落下が ひきおこした 連続合体」だけを れんさと かぞえる
  if (chain > 0){
    if (chain >= CHAIN_MIN) chainFinale(chain, chainX, chainY);
    chain = 0; chainT = 0;
  }

  const b = held;
  b.x = dropX;              // 上で もとめた ものを つかう（判定と 落ちる ばしょを そろえる）
  b.vy = 60;
  b.age = 0;
  balls.push(b);
  held = null;
  dropLock = dropDelay();
  drops++;
  bumpMission("drop");
  updateHUD();
  beep(560 - b.tier*30, .06, "sine", .07);
}

function gameOver(byUser){
  state = "over";
  saveCarry();                   // やりかけの おだいを ここで ディスクに 置く
  shake = byUser ? 0 : 9;
  overMarkT = byUser ? 0 : 2.2;  // 「こえちゃった！」は しゅんかん だけ
  startParade();                 // その回に 見送った子が よこに 走る
  toastEl.classList.remove("show");
  if (byUser){
    [784, 988, 1175].forEach((f, i) => setTimeout(() => beep(f, .18, "triangle", .09), i*110));
  } else {
    // のこぎり波の 下降（ブブー）は、絵と 文言で ていねいに やわらげた 負けを
    // 音だけで ひっくり返していた。まるい音の やさしい ためいきに する。
    [523, 466, 392].forEach((f, i) =>
      setTimeout(() => beep(f, .26, "sine", .075, .85), i*150));   // ためいきは 下がる
  }
  const sc = scoreNow();
  // にじいろの 回は 記録に 残さない（上の SHIRITORI の 説明を 見ること）。
  // ⭐も ふやさない。かいすうだけ かぞえる。
  const isRec = !rainbowRun && sc > bestRef();
  if (isRec) setBestRef(sc);
  if (!rainbowRun) stampTotal += stamps;
  plays++;
  saveRec();
  // 称号に とどいたら、あいことばの 入口を ひとつ 教える。
  // **結果画面には 出さない。** ここは もう 8項目 あり、記録更新の ときは
  // 「きろくを ほぞん」まで 増えて いちばん 混む。点数が うもれる。
  // 出すのは タイトルに もどった とき。よみこみの ボタンが そこに あるので、
  // **つかう場所の となりで 言える。**
  checkRankHint();
  if (isRec) setTimeout(() => { [784,988,1175,1568].forEach((f,i) =>
    setTimeout(() => beep(f, .2, "triangle", .12), i*90)); }, 420);

  // **称号は その回の 点数では なく いままでの さいこうで 出す。**
  //  `rankOf(sc)` だと、さいこう60点の人が 0点で 終えた とき
  //  「まめまる はじめました／つぎの目標：15点」と **降格の 表示**に なって いた。
  //  ヒント側は 生涯ベストを 見て いた ので 基準も 食いちがって いた。
  //  その回の 出来は 見出しと 点数が 伝える。称号は 身分。
  const topBest = Math.max(bestEver, bestFreeEver);
  const next = nextGoal(topBest);
  const nm = nearestMission();      // やりかけの おだい（持ちこす ので 出す）
  overlay.classList.remove("hidden");
  overlay.classList.add("result");
  overlay.innerHTML = `
    <div class="panel">
      <h1>${rainbowRun ? "にじいろ おつかれさま！ 🌈"
            : isRec ? "新しい記録！ 🎉" : (byUser ? "おつかれさま！" : "もう いっぱい…")}</h1>
      <div class="big">${sc} <span style="font-size:16px">点</span></div>
      <p class="rank">${rankOf(topBest)}</p>
      <p>次の目標：${next}</p>
      <p class="ms-got">⭐ お題 ${stamps}個 達成${
        chainBest >= 2 ? " ／ 最大 " + chainBest + "連鎖" : ""}</p>
      ${nm ? `<p class="ms-left">お題の達成状況は 次のゲームに続きます</p>` : ""}${
        rainbowRun ? '<p style="font-size:10px;color:#92687c">🌈 にじいろ（記録には残りません）</p>' : ""}
      <div class="btnrow">
        <button class="btn" id="againBtn">もう一度</button>
        <button class="btn sub" id="quitBtn">終わる</button>
      </div>
      ${isRec ? '<button class="link" id="saveNow">記録を保存（メモに貼っておくと安心）</button>' : ""}
    </div>`;
  document.getElementById("againBtn").addEventListener("click", start);
  document.getElementById("quitBtn").addEventListener("click", showTitle);
  const sn = document.getElementById("saveNow");
  if (sn) sn.addEventListener("click", openSave);
  updateRiseBar();
}

const saveDlg  = document.getElementById("save");

const saveMsg  = document.getElementById("saveMsg");

function myCode(){
  return btoa(unescape(encodeURIComponent(JSON.stringify(
    { b: bestEver, f: bestFreeEver, s: stampTotal, p: plays }))));
}
function openSave(){
  saveCode.value = myCode();
  loadCode.value = "";
  saveMsg.textContent = "";

}

function copyCode(){
  const v = saveCode.value;
  const done = () => { saveMsg.textContent = "コピーしました！"; };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(done).catch(fallback);
  } else fallback();
  function fallback(){
    saveCode.focus();
    saveCode.setSelectionRange(0, v.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    saveMsg.textContent = ok ? "コピーしました！" : "長押ししてコピーしてね";
  }
}
/* かならず 0以上の 整数に する（なにが きても こわれないように） */
function safeNum(x){
  const n = Math.floor(Number(x));
  if (!isFinite(n) || n < 0) return 0;
  return Math.min(n, 999999);
}
/* ============================================================
   隠しコマンド「あいことば」
   ------------------------------------------------------------
   きろくの よみこみ欄は、ふだん コード以外を 入れると
   「もじれつが ちがうみたい…」と 出るだけ。そこに ことばを 仕込んで ある。
   **記録には いっさい さわらない。** 出るのは ことばと 絵の うごきだけ。
   足すなら この ひょうに 1行 足すだけで よい。
   「ひみつ」は **しりとりの ヒント**に して、隠しコマンドどうしを つないで ある。
   ============================================================ */
const SECRET_WORDS = {
  "まめまる":   () => { hopAll(true); return "呼んだ？"; },
  "ひみつ":     () => "名前を並べてしりとりができるよ",
  "しりとり":   () => "6匹つながるのは 1とおりだけ。「ん」で終わるよ",
  "ありがとう": () => { hopAll(true); return "こちらこそ ありがとう！"; },
  // ほしぞらは 解放ずみ なら えらべる。まだなら ヒントだけ。
  "ほしぞら":   () => starUnlocked ? pinTheme("ほしぞら") : "空はなでると出るよ",

  // シークレットの あいことばの ヒント。**3語を そのまま ならべるだけ**に する。
  // 1つずつ 試して みる ところまでが 遊びなので、どれが どの子かは 言わない。
  // ひらがなと カタカナの どちらで 打っても 当たるように して ある。
  "しーくれっと": () => "ユニコーン い たつ ？",
  "シークレット": () => "ユニコーン い たつ ？",

  // --- シークレットの なかま。解放すると えらび画面に ずっと 出る ---
  "い":         () => gainChar("いのしし"),
  "ユニコーン": () => gainChar("ユニコーン"),
  "たつ":       () => gainChar("ドラゴン"),
};

/* シークレットを 解放して、その場で えらび画面を 見せる。
   「解放しました」と 出すだけでは **どこで つかえるのか わからない**
   （ほしぞらで 同じ ことを 言われた）。だから 少し おいて
   えらび画面を ひらき、あたらしい子が ならんで いる ところを 見せる。 */
function gainChar(nm){
  const isNew = unlockChar(nm);
  setTimeout(() => { closeSave(); showCharSelect(); }, 1100);
  return isNew ? nm + " が仲間になったよ！ 🎉"
               : nm + " はもう仲間だよ";
}

function loadFromCode(){
  const v = (loadCode.value || "").trim();
  if (!v){ saveMsg.classList.remove("hit"); saveMsg.textContent = "文字列を貼り付けてね"; return; }
  // あいことばが さきに 当たるか みる（コードの かたち検査より 前）
  const say = (txt) => {
    saveMsg.textContent = "🌸 " + txt;
    // **クラスを 外して 1回 レイアウトを 読んでから 付けなおす。**
    // そうしないと 2回目の あいことばで アニメーションが 走らない
    // （おだいの `.ms.done` と まったく 同じ 形）。
    saveMsg.classList.remove("hit"); void saveMsg.offsetWidth;
    saveMsg.classList.add("hit");
    loadCode.value = "";
    beep(660, .1, "triangle", .08);
    setTimeout(() => beep(880, .14, "triangle", .08), 110);
  };
  if (Object.prototype.hasOwnProperty.call(SECRET_WORDS, v)){
    say(SECRET_WORDS[v]());
    return;
  }
  // **けしきの 名前は そのまま あいことばに なる。**
  // ゆきのひ／あめあがり／くものうえ だけで なく、はれのひ や さくら など
  // ぜんぶ 効く。ひょうに 書き足す ひつようは ない（themePool を 見て いる）。
  // 解放前の ほしぞらは pool に いない ので ここでは 当たらない。
  const pinned = pinTheme(v);
  if (pinned){ say(pinned); return; }
  if (v.length > 400){ saveMsg.classList.remove("hit"); saveMsg.textContent = "文字列が長すぎます"; return; }
  if (!/^[A-Za-z0-9+/=]+$/.test(v)){ saveMsg.classList.remove("hit"); saveMsg.textContent = "文字列が違うみたい…"; return; }
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(v))));
    if (!o || typeof o !== "object" || Array.isArray(o)) throw 0;
    if (typeof o.b !== "number") throw 0;
    bestEver     = Math.max(bestEver,     safeNum(o.b));
    bestFreeEver = Math.max(bestFreeEver, safeNum(o.f));
    stampTotal = Math.max(stampTotal, safeNum(o.s));
    plays      = Math.max(plays,      safeNum(o.p));
    best = Math.max(best, bestRef());
    saveRec(); updateHUD();
    // **タイトルの 表示も つくりなおす。**
    // ここを 忘れて いて、よみこんだ あと さいこう点が 画面に 出ず、
    // モードの ボタンを 押して はじめて 出て いた（paint が そこでしか
    // よばれて いなかった）。さいこう点・称号・⭐・かいすう・
    // 「えらべるよ」の ひとこと、ぜんぶ ここで 直る。
    if (titlePaint) titlePaint();
    saveCode.value = myCode();
    saveMsg.textContent = "読み込みました！ 最高 " + bestRef() + "点";
  } catch(e){
    saveMsg.textContent = "文字列が違うみたい…";
  }
}

/* タイトルの え（なかまが ならんで まってる） */
const TAW = 282, TAH = 118, TGY = 100;
let tctx = null;
/* ならぶ いちと 大きさ（だれが 立つかは まいかい ランダム） */
const TITLE_SLOTS = [
  { x: 40,  r:20, ph:0.0 },
  { x:120,  r:34, ph:1.3 },
  { x:190,  r:25, ph:2.4 },
  { x:236,  r:17, ph:3.6 },
  { x:266,  r:13, ph:5.0 },
];
let TITLE_CAST = [];
function rollTitleCast(){
  const idx = TIERS.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--){          // シャッフル
    const j = (Math.random() * (i + 1)) | 0;
    const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  const flip = Math.random() < .5;                    // ときどき 左右を いれかえ
  TITLE_CAST = TITLE_SLOTS.map((s, i) => {
    const pad = s.r * 1.2 + 3;                        // みみが 画面の外に 出ないように
    const x = Math.max(pad, Math.min(TAW - pad, flip ? TAW - s.x : s.x));
    return { t: idx[i], x, r: s.r, ph: s.ph + rnd(0, 1.6), hop0: -9 };
  });
}

/* ============================================================
   隠しコマンド「なでる」
   ------------------------------------------------------------
   タイトルの 絵の 子を つつくと ぴょこんと 跳ねる。
   **7回で 隠しテーマ「ほしぞら」が 出るように なる**（ずっと のこる）。
   かぞえる のは のべ回数で、同じ子を 7回でも よい。

   跳ねる 高さは `time` から その場で 出す（`hop0` に 跳ね はじめた 時刻を 入れる）。
   別に タイマーを 持たない こと：タイトルの 絵は
   ゲーム画面とは べつの コマ数で まわって いるので、
   dt を かぞえると ずれる。
   ============================================================ */
const PET_GOAL = 7, HOP_SEC = .42;
/* **「のべ7回」は ほんとうに のべ。** 変数だけで もって いた ころは
   ページを 読みなおすと 0に もどって いた。4回つついて 閉じ、
   つぎの日に 3回 つついても 一生 とどかない。
   下の「跳ねる子が ふえて いく」しかけも、もどされると 意味を なくす。 */
let petCount = 0;
try { petCount = Math.max(0, Math.min(PET_GOAL,
        parseInt(localStorage.getItem("mamemaru-pet") || "0", 10) || 0)); } catch(e){}
function hopOne(c){ if (c) c.hop0 = time; }
function hopAll(stagger){
  (TITLE_CAST || []).forEach((c, i) => { c.hop0 = time + (stagger ? i*.07 : 0); });
}
function hopY(c){                       // いまの 跳ね上がり（px、上が マイナス）
  const k = (time - c.hop0) / HOP_SEC;
  return (k >= 0 && k < 1) ? -Math.sin(k*Math.PI) * c.r * .8 : 0;
}
function petAt(px, py){
  if (!TITLE_CAST) return;
  let hit = null, bestD = 1e9;
  for (const c of TITLE_CAST){
    const cy = TGY - c.r;               // えがく ときの 中心（bob は 誤差の うち）
    const d = Math.hypot(px - c.x, py - cy);
    if (d < c.r * 1.25 && d < bestD){ bestD = d; hit = c; }
  }
  if (!hit) return;
  hopOne(hit);
  beep(560 + ((Math.random()*4)|0)*90, .07, "sine", .06);
  if (starUnlocked) return;             // もう 出して あるなら かぞえない
  petCount++;
  try { localStorage.setItem("mamemaru-pet", String(petCount)); } catch(e){}

  /* **4回目から 跳ねる子が ふえて いく。**
     6回目までは 画面に 何も 出て いなかった ので、ぐうぜん 2〜3回 つついた人は
     そこで 止まって いた。**数字は 出さない**：「あと2かい」と 書くと
     秘密が 作業表に なる（`しーくれっと` で 3語だけ ならべたのと 同じ りくつ）。
     かわりに **手ごたえが 広がって いく**ことで「何か たまって いる」と 伝える。
     つついた子から よこへ 順に 伝わるので、**ぜんいん 同時に 跳ぶ 7回目**
     （`hopAll`）とは はっきり 別の 見え方に なる。 */
  const spread = petCount - 3;                       // 4回目 → 1匹、5回目 → 2匹…
  if (spread > 0 && petCount < PET_GOAL){
    const near = (TITLE_CAST || [])
      .filter(c => c !== hit)
      .sort((a, b) => Math.abs(a.x - hit.x) - Math.abs(b.x - hit.x))
      .slice(0, spread);
    near.forEach((c, i) => { c.hop0 = time + (i + 1) * .09; });   // さざ波に する
  }
  if (petCount >= PET_GOAL){
    starUnlocked = true;
    try { localStorage.setItem("mamemaru-star", "1"); } catch(e){}
    hopAll(true);
    [784, 988, 1175, 1568].forEach((f, i) =>
      setTimeout(() => beep(f, .2, "triangle", .11), i*95));
    // **解放した ことが わかる ように、つぎの ゲームを その けしきに する。**
    // 「いつか ランダムで 出ます」だけでは 解放されたのか どうか わからない。
    pinTheme("ほしぞら");
    showPetMsg("🌟 ほしぞら が出るようになったよ！ 次のゲームは ほしぞら");
  }
}
function showPetMsg(txt){
  const el2 = document.getElementById("petMsg");
  if (!el2) return;
  el2.textContent = txt;
  el2.classList.remove("hidden");
}
function initTitleArt(){
  rollTitleCast();                                    // まいかい ちがう なかまが 出る
  const c = document.getElementById("titleCv");
  if (!c){ tctx = null; return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = TAW*dpr; c.height = TAH*dpr;
  tctx = c.getContext("2d");
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // つつけるように する。タイトルは 作りなおされる ので 毎回 つけなおす。
  // CSS で よこはばが 変わる ので、見た目の 大きさから もとの ものさしに 直す。
  c.style.cursor = "pointer";
  // **2回 つけない こと。** initTitleArt() は bindTitleButtons() と
  // hideCharSelect() の 両方から よばれる。canvas は 同じ ものが のこる ので、
  // まもらないと 1回 つつくと 2回 かぞえて しまう。
  if (!c.dataset.petBound){
  c.dataset.petBound = "1";
  c.addEventListener("pointerdown", (e) => {
    const rc = c.getBoundingClientRect();
    if (!rc.width || !rc.height) return;
    petAt((e.clientX - rc.left) * (TAW / rc.width),
          (e.clientY - rc.top)  * (TAH / rc.height));
  });
  }
}
function drawTitleArt(){
  if (!tctx || state !== "title") return;
  const g = tctx;
  g.clearRect(0, 0, TAW, TAH);

  // じめん
  g.fillStyle = "#ffe2ee";
  g.fillRect(0, TGY, TAW, TAH - TGY);
  g.fillStyle = "#ffd2e4";
  for (let x = 0; x < TAW; x += 13){
    g.beginPath(); g.arc(x + 6.5, TGY + 1, 6.5, Math.PI, 0); g.fill();
  }

  // ふわふわ かざり
  for (let i = 0; i < 5; i++){
    const px = 24 + i*58 + Math.sin(time*.8 + i)*7;
    const py = 26 + Math.sin(time*1.1 + i*2)*9;
    g.globalAlpha = .5 + .3*Math.sin(time*1.6 + i);
    if (i % 2){ g.fillStyle = "#ffc0d6"; drawHeart(g, px, py, 6); }
    else { g.fillStyle = "#fff0b0"; g.save(); g.translate(px, py);
           g.beginPath();
           for (let j = 0; j < 10; j++){
             const a = -Math.PI/2 + j*Math.PI/5, rr = (j%2) ? 2.2 : 5.5;
             const qx = Math.cos(a)*rr, qy = Math.sin(a)*rr;
             if (j) g.lineTo(qx, qy); else g.moveTo(qx, qy);
           }
           g.closePath(); g.fill(); g.restore(); }
    g.globalAlpha = 1;
  }

  // なかまたち
  for (const c of TITLE_CAST){
    const s = Math.sin(time*.75 + c.ph);
    const sm = s > .72 ? Math.min(1, (s - .72)/.12) : 0;         // ときどき わらう
    const bs = Math.sin(time*1.9 + c.ph*3.1);
    const bl = (!sm && bs > .965) ? .05 : 1;                      // ときどき まばたき
    const bob = Math.sin(time*1.4 + c.ph*1.7) * 1.6;
    g.save();
    g.globalAlpha = .1; g.fillStyle = "#8a5f70";
    g.beginPath(); g.ellipse(c.x, TGY + 1, c.r*.8, c.r*.18, 0, 0, 7); g.fill();
    g.globalAlpha = 1;
    g.translate(c.x, TGY - c.r + bob + hopY(c));      // つつかれると ぴょこん
    drawCreature(g, c.t, c.r, c.ph + time*.4, bl, 0, sm, 0, 1);
    g.restore();
  }
}

  // drawCreature は TIERS[i] を 見る。見本は 9体 ぜんぶ えがきたいので

  const tiersBackup = TIERS.slice();
  while (TIERS.length) TIERS.pop();

  ALL_CHARACTERS.forEach((char, idx) => {
    // **まだ 解放して いない シークレットは カードを 作らない。**
    // かくすだけ（display:none）に すると、開発者ツールで 見えて しまう ほか、
    // `paintCount()` の カード数と ずれる。そもそも 作らない こと。
    if (!isUsable(char)) return;
    const card = document.createElement("div");
    // **まだ 1回も 遊んで いない子に しるしを つける。**
    // 18体 いるのに 1ゲームで 見えるのは 6体だけ。ここが 図鑑の 役を する。
    card.className = "charCard" + (char.secret ? " secretCard" : "")
                   + (playedChars.includes(char.name) ? "" : " newChar");

    const cvs = document.createElement("canvas");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = 64 * dpr; cvs.height = 64 * dpr;
    const g = cvs.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // ゲーム本体と おなじ えがき方。見本なので 表情は わらいがお固定。
    try {
      g.save(); g.translate(32, 32);
      drawCreature(g, idx, 26, idx * 1.3, 1, 0, .6, 0, 1);
      g.restore();
    } catch(e){
      g.fillStyle = char.body;
      g.beginPath(); g.arc(32, 32, 24, 0, 7); g.fill();
    }

    const nm = document.createElement("div");
    nm.className = "name"; nm.textContent = char.name;

    const ck = document.createElement("div");
    ck.className = "checkmark";

    card.appendChild(cvs); card.appendChild(nm); card.appendChild(ck);
    card.dataset.ci = String(idx);          // ALL_CHARACTERS の ばんごう
    card.addEventListener("click", () => {
      if (selected.has(idx)){
        selected.delete(idx); card.classList.remove("selected");
      } else if (selected.size < 6){
        selected.add(idx); card.classList.add("selected");
      } else {
        return;
      }
      paintCount();
    });
    grid.appendChild(card);
  });

  // TIERS を もとに もどす（もどし忘れると ゲームが こわれる）
  while (TIERS.length) TIERS.pop();
  tiersBackup.forEach(c => TIERS.push(c));
  LAST = TIERS.length - 1;

  // **まだ 遊んで いない子が 何人 いるか。** カードの しるしだけでは
  // 「その色は 何の いみ？」で 終わる ので、ことばを ひとつ そえる。
  {
    const hintEl = document.getElementById("charHint");
    const yet = ALL_CHARACTERS.filter(c => isUsable(c) && !playedChars.includes(c.name)).length;
    if (hintEl) hintEl.textContent = yet > 0
      ? `先に選んだ子ほど大きくなります ／ ● は まだ遊んでいない ${yet}人`
      : "先に選んだ子ほど大きくなります";
  }

  // addEventListener だと よびなおすたび 二重に つく
  selectBtn.onclick = () => {
    if (selected.size !== 6) return;
    const chars = Array.from(selected).map(i => ALL_CHARACTERS[i]);
    selectedTiers = chars;
    customChars = true;                 // もう ひとことは 出さない
    try {
      localStorage.setItem("mamemaru-selected-chars",
                           JSON.stringify(chars.map(c => c.name)));
    } catch(e){}
    hideCharSelect();
  };

  const cancelBtn = document.getElementById("charCancelBtn");
  if (cancelBtn) cancelBtn.onclick = () => {
    // **なにも 保存しない。** `selectedTiers` を さわらないので
    // まえの 顔ぶれが そのまま のこる（`hideCharSelect` が それを 描きなおす）。
    hideCharSelect();
  };

  paintCount();
}

function showCharSelect(){
  const layer = document.getElementById("charSelectOverlay");
  if (!layer) return;
  layer.classList.remove("hidden");
  charSelectOpen = true;
  initCharSelect();
}

function hideCharSelect(){
  const layer = document.getElementById("charSelectOverlay");
  if (layer) layer.classList.add("hidden");
  charSelectOpen = false;
  // えらんだ セットで しんかの図を えがきなおす
  if (selectedTiers && selectedTiers.length === 6) applySelectedTiers();
  try { paintLastName(); } catch(e){}
  try { fitCanvas(); initTitleArt(); initChainBar(); renderLadder(); } catch(e){}
  /* **タイトルの 中身を そとから 変えたら `titlePaint()` を よぶ こと。**
     ここを 呼んで いなかった ため、えらび直して しりとりを 解いても
     **「🌈 にじいろ中」の 行が 消えなかった**（2026-09-22）。
     `loadFromCode()` で 同じ ことを やった 前例が ある（最高点が 画面に 出なかった）。 */
  try { if (titlePaint) titlePaint(); } catch(e){}
}

/* タイトルの 文の 中の「いちばん ちいさい子」を、じっさいに えらばれた
   6番目の子の 名前に 入れかえる（`<span class="lastName">`）。
   ひよこ 決めうちの 文だったが、顔ぶれを えらべる ように なって 嘘に なった。
   HTML には 名前ではなく「いちばん ちいさい子」を 書いて おくこと。
   ここが 動かなくても 意味の 通る 文が のこる。
   よぶ ところは 2つ：`bindTitleButtons()`（タイトルを 組みなおした あと）と
   `hideCharSelect()`（えらび終わった あと）。 */
function paintLastName(){
  const t = TIERS[TIERS.length - 1];
  if (!t || !t.name) return;
  document.querySelectorAll(".lastName").forEach(e => { e.textContent = t.name; });
}

// えらんだ セットを TIERS に うつす（参照は そのまま）
function applySelectedTiers(){
  if (!selectedTiers || selectedTiers.length !== 6) return;
  while (TIERS.length) TIERS.pop();
  // もとの r は 見本用の 目やす。ばんめんでは はしごの 大きさに そろえる。
  // そろえないと 下の段の ほうが 大きい ことが おきて
  //「くっつくと ちいさくなる」が こわれる。
  selectedTiers.forEach((c, i) => TIERS.push(Object.assign({}, c, { r: SIZE_LADDER[i] })));
  LAST = TIERS.length - 1;
  generateDropPool();
}

function loadSelectedChars(){
  try {
    const saved = localStorage.getItem("mamemaru-selected-chars");
    if (!saved) return false;
    const names = JSON.parse(saved);
    const chars = names.map(n => ALL_CHARACTERS.find(c => c.name === n))
                       .filter(Boolean);
    if (chars.length === 6){ selectedTiers = chars; return true; }
  } catch(e){}
  return false;
}

/* けしきの 図鑑を えがく。**タイトルは innerHTML で 作りなおされる**ので、
   1回 書いて おわりに せず paint() から 毎回 よぶ こと。
   **色は DOM で 組みたてる。`innerHTML` に 名前を 入れない。** */
function paintDex(id, isNew){
  const el = document.getElementById(id || "themeDex");
  if (!el) return;
  const pool = themePool();
  const got = pool.filter(t => seenThemes.includes(t.nm)).length;
  el.textContent = "";
  const lb = document.createElement("span");
  lb.className = "lb" + (isNew ? " nw" : "");
  // **けしきの 名前は ここでも 出さない。** そのまま あいことば なので、
  // ならべて 見せると 称号の ごほうびで 1つずつ 教える しかけが 無意味に なる。
  lb.textContent = isNew ? `✨ あたらしい けしき ${got} / ${pool.length}`
                         : `けしき ${got} / ${pool.length}`;
  el.appendChild(lb);
  for (const t of pool){
    const i = document.createElement("i");
    if (seenThemes.includes(t.nm)){
      // 空の 色を そのまま 使う。どの けしきか 色で 思いだせる
      i.style.background = `linear-gradient(160deg, ${t.sky[0]}, ${t.sky[2]})`;
      i.style.boxShadow = "0 1px 0 rgba(190,170,180,.35)";
    } else {
      i.className = "no";
    }
    el.appendChild(i);
  }
}

function bindTitleButtons(){
  // **はじめての人に えらび画面を 出さない こと。**
  // さいしょは いきなり 15枚の カードを 出して いたが、まだ 一度も 遊んで いない人には
  // どの子が どう うごくかも、順番が どう 効くかも わからない。**えらぶ 手がかりを
  // 持って いない人に 決めさせて いた。** おまけに「まめまる」の 第一印象が
  // 遊びでは なく **設定画面**に なって いた。
  // いまは もとの 6体で そのまま はじめて、えらべる ことは 1回 遊んだ あとに
  // 下の #pickHint で そっと 知らせる。
  if (!selectedTiers){
    customChars = loadSelectedChars();
    if (!customChars) selectedTiers = DEFAULT_TIERS.slice();
    applySelectedTiers();
  }

  paintLastName();

  const sb = document.getElementById("startBtn");
  if (sb) sb.addEventListener("click", start);
  const cb = document.getElementById("codeBtn");
  if (cb) cb.addEventListener("click", openSave);
  const eb = document.getElementById("editCharBtn");
  if (eb) eb.addEventListener("click", showCharSelect);
  initTitleArt();
  initChainBar();
  const btns = document.querySelectorAll("#modes .mode");
  const info = document.getElementById("modeInfo");
  const rec = document.getElementById("myRec");
  const paint = () => {
    btns.forEach(o => o.classList.toggle("on",
      (o.getAttribute("data-m") === "1") === spawnRows));
    if (info) info.textContent = spawnRows
      ? "床が上がり、下からもまめまるが増えてくる"
      : "床が少しずつ上がってくる";
    best = bestRef();
    // つみあがっている かんじが 見えるように、記録と 称号と ⭐を 出す
    if (rec){
      const b = bestRef();
      rec.innerHTML = b > 0
        ? `最高 ${b}点 ／ ${rankOf(b)}<span> ／ ⭐${stampTotal}・${plays}回目</span>`
        : `<span>まずは ${RANK_STEPS[0]}点を目指そう</span>`;
    }
    paintDex();
    // 1回でも 遊んで いて、まだ じぶんで えらんだ ことが ない人にだけ 出す
    const hint = document.getElementById("pickHint");
    if (hint) hint.classList.toggle("hidden", !(plays >= 1 && !customChars));
    /* **にじいろ中の 知らせ。**（2026-09-22）
       にじいろは 1ゲーム限りでは なく、**しりとりの 並びで いる あいだ ずっと**
       つづく（`start()` が 毎回 `isShiritori(selectedTiers)` で 見なおす）。
       そのあいだ 記録は 1つも 残らない のに、遊んで いる 最中に それが 分かる
       表示が どこにも なかった。**順番が 効いて いる ことを 知らないと、
       同じ6体を えらび直しても 戻れない** ので、戻り方まで ここで 言う。 */
    const rb = document.getElementById("rainbowMsg");
    if (rb){
      const on = isShiritori(selectedTiers);
      rb.classList.toggle("hidden", !on);
      if (on) rb.textContent =
        "🌈 にじいろ中・記録は残りません（選びなおすと戻る）";
    }
    // まだ 出して いない ヒントが あれば、ここで はじめて「出した」ことに する
    const hm = document.getElementById("hintMsg");
    if (pendingHint && hm){
      titleHintMsg = pendingHint;
      pendingHint = null;
      hintsGiven++;
      try { localStorage.setItem("mamemaru-hint", String(hintsGiven)); } catch(e){}
    }
    if (titleHintMsg && hm){                      // タイトルは 作りなおされる ので 毎回
      hm.textContent = titleHintMsg; hm.classList.remove("hidden");
    }
    updateHUD();
  };
  titlePaint = paint;      // よみこみ などからも よべる ように しておく
  btns.forEach(b => {
    b.addEventListener("click", () => {
      spawnRows = b.getAttribute("data-m") === "1";
      try { localStorage.setItem("mamemaru-spawn", spawnRows ? "1" : "0"); } catch(e){}
      paint();
      beep(spawnRows ? 880 : 660, .09, "triangle", .08);
    });
  });
  paint();
}
