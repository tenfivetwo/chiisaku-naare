const born = [];
function stepFx(dt){
  if (chainFx) chainFx.age += dt;
  if (clearFx) clearFx.age += dt;
  born.length = 0;
  for (const f of fx){
    f.age += dt;
    if (f.t === "p"){ f.vy += 620*dt; f.x += f.vx*dt; f.y += f.vy*dt; }
    if (f.t === "h"){ f.y += f.vy*dt; }
    if (f.t === "st"){ f.vy += 480*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.rotv*dt; }
    if (f.t === "txt"){ f.y += f.vy*dt; f.vy *= 0.94; }
    if (f.t === "zz"){ f.x += f.vx*dt; f.y += f.vy*dt; f.vy *= .992; }
    if (f.t === "run"){
      f.x += f.vx*dt;
      // さいしょの 0.28びょうで 山から とび出して、はしる高さへ
      const up = Math.min(1, f.age / 0.28);
      f.y = f.y0 + (f.lane - f.y0) * (1 - (1-up)*(1-up));
      // あしもとに すなぼこりを のこす
      f.puff -= dt;
      if (f.puff <= 0 && f.age < f.life*.8){
        f.puff = .075;
        born.push({ t:"p", x: f.x - f.dir*14, y: f.y + 15 + rnd(-3,3),
                    vx: -f.dir*rnd(30,110), vy: rnd(-70,-10),
                    r: rnd(2.5,5.5), life: rnd(.24,.44), age:0, c:"#FFFFFF" });
      }
    }
    if (f.t === "ln"){ f.x += f.vx*dt; }
  }
  fx = fx.filter(f => f.age < f.life);
  if (born.length) for (const b of born) fx.push(b);
}

/* ============================================================
   キャラ描画（ふわふわ）
   ============================================================ */
// もこもこ輪郭（ひつじ用）。正弦波は 山を ふやすほど 細く 深く なって
// とがって 見える（ふかさ÷はば が 0.6 を こえると ギザギザ）。
// かわりに まるを ぐるっと ならべて、となりと 交わる ところで つないで いく。
// こうすると 山が 円弧に なるので ふかさ÷はば が 0.24 に なり もこもこ する。
function puffPath(g, r, n, rpFrac, phase){
  // phase を まわす 角に つかっては いけない。
  // 正弦波の 輪郭では phase は 山が ゆっくり 波うつ ための ずれ だが、
  // ここで 同じ ことを すると まる 11こが まとめて まわり、
  // からだごと 回転して 見える（いちど やって しまった）。
  // いきた かんじは 「まるの 大きさが すこし ふくらむ」 で 出す。
  const rp = r * rpFrac * (1 + .055*Math.sin(phase));
  const rc = r - rp;              // そとの はしは いつも r
  const D  = Math.PI*2 / n;
  const d  = 2 * rc * Math.sin(D/2);
  if (rp <= d/2){                 // つながらない ときは 正弦波に にげる
    fluffPath(g, r, n, rpFrac*.5, phase);
    return;
  }
  const phi = Math.acos((d/2) / rp);   // 交点の 中心からの ずれ角
  const H = Math.PI/2;
  g.beginPath();
  for (let i = 0; i < n; i++){
    const th = i*D;                    // ← phase を たさない
    const cx = Math.cos(th)*rc, cy = Math.sin(th)*rc;
    // となりの 中心への むきは th ± (D/2 + 90度)。
    // そとがわの 交点は そこから phi を 「ひいた」 ほう（数値で たしかめた）。
    const a0 = th - D/2 - H + phi;     // まえの まるとの 交点
    const a1 = th + D/2 + H - phi;     // つぎの まるとの 交点
    g.arc(cx, cy, rp, a0, a1);
  }
  g.closePath();
}

function fluffPath(g, r, bumps, amp, phase){
  // でこぼこ 1つあたり 4点あれば なめらかに 見える（ちいさい子は 点を へらす）
  const steps = Math.max(24, Math.min(96, Math.round(Math.max(r * 1.0, bumps * 4))));
  g.beginPath();
  for (let i = 0; i <= steps; i++){
    const a = i/steps * Math.PI*2;
    const rr = r * (1 - amp + amp*Math.sin(a*bumps + phase));
    const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
    if (i === 0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.closePath();
}

/* ============================================================
   わらいがお（かわいさ重視：口はちいさく、目はぱっちりのまま）
   ============================================================ */
const MC = "#8C5A5E";        // やわらかい口の色
const TG = "#FFA6BA";        // した

function starG(g, x, y, s){
  g.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI/2 + i*Math.PI/5, rr = (i%2) ? s*.44 : s;
    const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
    if (i) g.lineTo(px, py); else g.moveTo(px, py);
  }
  g.closePath(); g.fill();
}
function noteG(g, x, y, s){
  g.beginPath(); g.ellipse(x - s*.26, y + s*.52, s*.34, s*.26, -.35, 0, 7); g.fill();
  g.beginPath();
  g.moveTo(x + s*.02, y + s*.52); g.lineTo(x + s*.02, y - s*.6);
  g.lineTo(x + s*.5, y - s*.34); g.lineTo(x + s*.5, y - s*.08);
  g.lineTo(x + s*.2, y - s*.28); g.lineTo(x + s*.2, y + s*.52);
  g.closePath(); g.fill();
}

/* ============================================================
   かおの「くち・はな」の きまり。**ここが 唯一の 出どころ。**

   まえは「この かおは くちを えがかない」の 判定が
     ①ふだんの かお ②びっくりの かお ③せり上がりの かお
   の 3か所に ばらばらに 書いて あって、表情を ふやすたびに
   ぞうに 口が 生えた（`T.face === "elephant"` の 書き忘れ）。
   表情を ふやす ときは、この 関数を 呼ぶだけ に すること。
   あたらしく「口の ない子」を 出す ときも ここに 1行 足せば すむ。
   ============================================================ */
function mouthRule(T){
  // くちを いっさい えがかない かお（ぞう＝はなが くちの ばしょを とおる）
  const noMouth = (T.face === "elephant");
  // すでに 大きな はなが あって、はなの すじだけ 足す かお
  // すでに 大きな はなが あって、はなの すじだけ 足す かお
  const bigNose = (T.face === "pig" || T.face === "koala" || T.face === "cow" ||
                   T.face === "boar");
  return {
    noMouth,
    bigNose,
    // ちいさな 黒い はなの 点を 置かない かお
    noNoseDot: noMouth || bigNose || T.face === "cat" || T.face === "dog",
    // くちの たかさ。大きな はなの 下に くる 子は 下げる
  };
}

/* ちいさく にっこりした 口もと */
function drawSmileMouth(g, T, r){
  // 口の ない かおは ここで 打ち切る。T.sm の 書きまちがいでも 口は 生えない。
  if (mouthRule(T).noMouth) return;
  g.lineCap = "round"; g.lineJoin = "round";
  switch (T.sm){

    case "none": break;     // 口を えがかない（mouthRule でも 止めて ある）

    case "grin": {          // しろくま：ちいさく ぱくっ
      const my = r*.17, w = r*.135, h = r*.155;
      g.fillStyle = MC;
      g.beginPath();
      g.moveTo(-w, my);
      g.quadraticCurveTo(-w*.55, my - r*.045, 0, my - r*.04);
      g.quadraticCurveTo(w*.55, my - r*.045, w, my);
      g.quadraticCurveTo(0, my + h, -w, my);
      g.closePath(); g.fill();
      g.fillStyle = TG;
      g.beginPath();
      g.moveTo(-w*.5, my + h*.42);
      g.quadraticCurveTo(0, my + h*1.0, w*.5, my + h*.42);
      g.closePath(); g.fill();
      break;
    }

    case "nihera": {        // ぱんだ：ふにゃっと にへら
      const my = r*.21;
      g.strokeStyle = MC; g.lineWidth = Math.max(1.1, r*.052);
      g.beginPath();
      g.moveTo(-r*.155, my - r*.035);
      g.quadraticCurveTo(-r*.075, my + r*.075, 0, my + r*.025);
      g.quadraticCurveTo(r*.075, my + r*.075, r*.155, my - r*.035);
      g.stroke();
      break;
    }

    case "tooth": {         // くま：まえ歯 ちょこん
      const my = r*.19, w = r*.12, h = r*.13;
      g.fillStyle = MC;
      g.beginPath();
      g.moveTo(-w, my);
      g.quadraticCurveTo(0, my - r*.05, w, my);
      g.quadraticCurveTo(0, my + h, -w, my);
      g.closePath(); g.fill();
      g.fillStyle = "#FFFFFF";     // ちいさい まえ歯 ひとつ
      g.beginPath();
      g.moveTo(-w*.3, my - r*.018);
      g.lineTo(w*.3, my - r*.018);
      g.quadraticCurveTo(w*.3, my + h*.42, 0, my + h*.42);
      g.quadraticCurveTo(-w*.3, my + h*.42, -w*.3, my - r*.018);
      g.closePath(); g.fill();
      break;
    }

    case "tongue": {        // いぬ：ちろっと べろ
      const my = r*.25;
      g.strokeStyle = MC; g.lineWidth = Math.max(1, r*.046);
      g.beginPath();
      g.moveTo(-r*.125, my - r*.03);
      g.quadraticCurveTo(0, my + r*.085, r*.125, my - r*.03);
      g.stroke();
      g.fillStyle = TG;
      g.beginPath();
      g.moveTo(-r*.055, my + r*.035);
      g.quadraticCurveTo(0, my + r*.2, r*.055, my + r*.035);
      g.quadraticCurveTo(0, my + r*.075, -r*.055, my + r*.035);
      g.closePath(); g.fill();
      break;
    }

    case "bunny": {         // うさぎ：Y の口が きゅっと あがる
      const my = r*.2;
      g.strokeStyle = MC; g.lineWidth = Math.max(1, r*.046);
      g.beginPath(); g.moveTo(0, my - r*.115); g.lineTo(0, my - r*.03); g.stroke();
      g.beginPath();
      g.moveTo(-r*.15, my - r*.075);
      g.quadraticCurveTo(-r*.07, my + r*.05, 0, my - r*.025);
      g.quadraticCurveTo(r*.07, my + r*.05, r*.15, my - r*.075);
      g.stroke();
      break;
    }

    case "cow": {           // うし：はなづらの 下に ちいさく
      const my = r*.62;
      g.strokeStyle = MC; g.lineWidth = Math.max(1.1, r*.05); g.lineCap = "round";
      g.beginPath();
      g.moveTo(-r*.10, my - r*.03);
      g.quadraticCurveTo(0, my + r*.07, r*.10, my - r*.03);
      g.stroke();
      break;
    }

    case "koala": {         // こあら：大きな はなの 下に ちいさく
      const my = r*.62;
      g.strokeStyle = MC; g.lineWidth = Math.max(1.1, r*.05); g.lineCap = "round";
      g.beginPath();
      g.moveTo(-r*.10, my - r*.03);
      g.quadraticCurveTo(0, my + r*.07, r*.10, my - r*.03);
      g.stroke();
      break;
    }

    case "piggy": {         // ぶた：はなの 下に ちょこんと
      const my = r*.58;
      g.strokeStyle = MC; g.lineWidth = Math.max(1.1, r*.05);
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(-r*.115, my - r*.03);
      g.quadraticCurveTo(0, my + r*.07, r*.115, my - r*.03);
      g.stroke();
      break;
    }

    case "nyan": {          // ねこ：ふわっと ω
      const my = r*.21;
      g.strokeStyle = MC; g.lineWidth = Math.max(1.1, r*.05);
      g.beginPath();
      g.arc(-r*.085, my, r*.09, Math.PI*.02, Math.PI*.98);
      g.moveTo(r*.175, my);
      g.arc(r*.085, my, r*.09, Math.PI*.02, Math.PI*.98);
      g.stroke();
      break;
    }

    default: {              // ひよこ／めじろ：くちばし ちょこっと ぱか
      const my = r*.16;
      // beakA/beakB で 色を 変えられる（めじろは くろ）
      // した（あいた ところ）。ほそながい くちばしの 子は はばも ほそく する。
      const bw = T.beakLong ? .062 : .115, bh = T.beakLong ? .17 : .25;
      g.fillStyle = T.beakA || "#E07A20";
      g.beginPath();
      g.moveTo(-r*bw, my + r*.075);
      g.lineTo(r*bw, my + r*.075);
      g.quadraticCurveTo(0, my + r*bh, -r*bw, my + r*.075);
      g.closePath(); g.fill();
      g.fillStyle = T.beakB || "#FF9E3D";
      g.beginPath();
      if (T.beakLong){
        // とりらしく ほそく、すこし 下に そらせる。
        // まえは はば .085r・ながさ .30r・まっくろ で、かおの まんなかに
        // くろい やじるしが ある ように 見えて いた。ほそく 短く して、
        // ふちを なめらかな 曲線に する と くちばしに 見える。
        g.moveTo(-r*.058, my - r*.09);
        g.quadraticCurveTo(-r*.030, my + r*.10, r*.005, my + r*.21);
        g.quadraticCurveTo( r*.045, my + r*.09, r*.058, my - r*.09);
        g.closePath(); g.fill();
        g.strokeStyle = T.beakA || "#E07A20";
        g.lineWidth = Math.max(1, r*.024);
        g.beginPath();
        g.moveTo(-r*.058, my - r*.09); g.lineTo(r*.058, my - r*.09);
        g.stroke();
      } else {
        g.moveTo(-r*.135, my + r*.06);
        g.lineTo(r*.135, my + r*.06);
        g.lineTo(0, my - r*.13);
        g.closePath(); g.fill();
      }
      break;
    }
  }
}

/* よこに ふわっと出る かざり */
function drawAccent(g, T, r, a, phase){
  const bob = Math.sin(phase*3.1)*r*.05;
  g.save();
  g.globalAlpha = .92*a;
  switch (T.acc){
    case "heart2":
      g.fillStyle = "#FF8FB4"; drawHeart(g, -r*.9, -r*.66 + bob, r*.2);
      g.fillStyle = "#FFB9D0"; drawHeart(g,  r*.92, -r*.44 - bob, r*.14);
      break;
    case "heart":
      g.fillStyle = "#FF8FB4"; drawHeart(g, r*.92, -r*.6 + bob, r*.19);
      break;
    case "note":
      g.fillStyle = "#8FBEEA"; noteG(g, r*.94, -r*.56 + bob, r*.24);
      break;
    case "star":
      g.fillStyle = "#FFD86B"; starG(g, r*.96, -r*.58 + bob, r*.2);
      g.fillStyle = "#FFEBA8"; starG(g, -r*.9, -r*.4 - bob, r*.12);
      break;
    default:
      sparkle4(g, -r*.92, -r*.6 + bob, r*.2, "rgba(255,236,140,.95)");
      sparkle4(g,  r*.95, -r*.4 - bob, r*.13, "rgba(255,255,255,.9)");
  }
  g.restore();
}

function sparkle4(g, x, y, s, col){
  g.fillStyle = col;
  g.beginPath();
  g.moveTo(x, y - s);
  g.quadraticCurveTo(x + s*.16, y - s*.16, x + s, y);
  g.quadraticCurveTo(x + s*.16, y + s*.16, x, y + s);
  g.quadraticCurveTo(x - s*.16, y + s*.16, x - s, y);
  g.quadraticCurveTo(x - s*.16, y - s*.16, x, y - s);
  g.fill();
}

/* おどろいた ときの まわりの かざり */
function drawShock(g, r, a, phase){
  g.save();
  g.globalAlpha = .95*a;
  const bob = Math.sin(phase*9)*r*.03;
  // ！マーク
  g.save();
  g.translate(r*.92, -r*.66 + bob); g.rotate(.2);
  g.fillStyle = "#FF7E9B";
  g.beginPath();
  g.moveTo(-r*.05, -r*.2); g.lineTo(r*.05, -r*.2);
  g.lineTo(r*.032, r*.04); g.lineTo(-r*.032, r*.04);
  g.closePath(); g.fill();
  g.beginPath(); g.arc(0, r*.135, r*.048, 0, 7); g.fill();
  g.restore();
  // ぽわっと でる まる
  g.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < 3; i++){
    const ang = Math.PI*1.05 + i*0.3;
    const dd = r*(1.02 + i*.06);
    g.beginPath();
    g.arc(Math.cos(ang)*dd, Math.sin(ang)*dd - bob, r*(.075 - i*.016), 0, 7);
    g.fill();
  }
  g.restore();
}

/* せり上がりで びっくりした ときの かざり（あせ＋もちあがる線） */
function drawShock2(g, r, a, phase){
  g.save();
  g.globalAlpha = .95*a;
  const bob = Math.sin(phase*11)*r*.025;
  // あせ
  g.save();
  g.translate(r*.86, -r*.6 + bob);
  g.fillStyle = "#8FD4F5";
  g.beginPath();
  g.moveTo(0, -r*.22);
  g.quadraticCurveTo(r*.135, -r*.02, r*.115, r*.075);
  g.quadraticCurveTo(r*.075, r*.2, 0, r*.2);
  g.quadraticCurveTo(-r*.075, r*.2, -r*.115, r*.075);
  g.quadraticCurveTo(-r*.135, -r*.02, 0, -r*.22);
  g.closePath(); g.fill();
  g.fillStyle = "rgba(255,255,255,.85)";
  g.beginPath(); g.ellipse(-r*.04, r*.055, r*.032, r*.048, -.3, 0, 7); g.fill();
  g.restore();
  // もちあげられてる線
  g.strokeStyle = "rgba(255,255,255,.85)";
  g.lineWidth = Math.max(1, r*.045); g.lineCap = "round";
  for (let i = -1; i <= 1; i++){
    const lx = i*r*.4;
    g.beginPath();
    g.moveTo(lx, r*1.02 + Math.abs(i)*r*.06);
    g.lineTo(lx, r*1.02 + Math.abs(i)*r*.06 + r*(.22 - Math.abs(i)*.06));
    g.stroke();
  }
  g.restore();
}

function drawCreature(g, tier, r, phase, blinkAmt, sq, sm, su, sk, zz, dw, yw){
  zz = zz || 0;                 // ねむり ぐあい（0..1）
  dw = dw || 0;                 // ねむそう（0..1）まぶたが 下りてくる
  yw = yw || 0;                 // あくび（0..1）
  const T = TIERS[tier];
  const MR = mouthRule(T);      // くち・はなの きまり（唯一の 出どころ。上の 関数を 見ること）
  sm = sm || 0;
  const suv = su || 0;
  const kind = sk || 1;
  const bounce = (sm > 0 && suv <= 0) ? 1 + .035*Math.sin(phase*6.4)*sm : 1;
  // びっくり＝たてに のびる ／ せり上がり＝ぺたっと ちぢむ
  const stretch = kind === 2 ? 1 - .12*suv : 1 + .13*suv;
  const sy = (1 + sq) * bounce * stretch;
  const sx = (1 - sq*0.75) / (bounce*.5 + .5) / (stretch*.55 + .45);
  g.save();
  if (suv > 0) g.rotate(Math.sin(phase*(kind === 2 ? 23 : 17)) * (kind === 2 ? .05 : .03) * suv);
  else if (sm > 0) g.rotate(Math.sin(phase*2.9) * .075 * sm);   // ふりふり
  g.scale(sx, sy);

  // みみ（うしろ）
  g.lineWidth = Math.max(1, r*0.045);
  g.strokeStyle = T.line;

  // みみの そとがわは ふつう body。earA が あれば そちらを つかう
  // （ぱんだの 黒いみみ など）。earL で ふちの 色も 変えられる。
  if (T.earL){ g.strokeStyle = T.earL; }
  if (T.ear === "round"){
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.62, -r*.68);
      g.fillStyle = T.earA || T.body;
      g.beginPath(); g.arc(0,0, r*.34, 0, 7); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath(); g.arc(0, r*.04, r*.17, 0, 7); g.fill();
      g.restore();
    }
  } else if (T.ear === "long"){
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.30, -r*1.12); g.rotate(s*0.13);
      g.fillStyle = T.earA || T.body;
      g.beginPath(); g.ellipse(0,0, r*.17, r*.78, 0, 0, 7); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath(); g.ellipse(0, r*.02, r*.085, r*.58, 0, 0, 7); g.fill();
      g.restore();
    }
  } else if (T.ear === "cat"){
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.56, -r*.62); g.rotate(s*0.25);
      g.fillStyle = (T.mike && s > 0) ? T.mikeA : (T.earA || T.body);   // みけは 右みみが オレンジ
      g.beginPath();
      g.moveTo(-r*.26, r*.2); g.lineTo(0, -r*.36); g.lineTo(r*.26, r*.2);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath();
      g.moveTo(-r*.13, r*.14); g.lineTo(0, -r*.16); g.lineTo(r*.13, r*.14);
      g.closePath(); g.fill();
      g.restore();
    }
  } else if (T.ear === "cow"){
    // つの（ちいさく、やさしい 色。とがらせない）
    g.fillStyle = "#F2E3C8";
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.31, -r*.88); g.scale(s, 1); g.rotate(-.30);
      g.beginPath();
      g.moveTo(-r*.085, r*.12);
      g.quadraticCurveTo(-r*.10, -r*.20, r*.05, -r*.25);
      g.quadraticCurveTo(r*.13, -r*.18, r*.085, r*.12);
      g.closePath(); g.fill(); g.stroke();
      g.restore();
    }
    // よこに はりだした たれみみ。ぶちと つながる みぎがわは 黒い
    for (const s of [-1, 1]){
      const dark = (s > 0);
      g.save(); g.translate(s*r*.80, -r*.30); g.scale(s, 1); g.rotate(.34);
      g.fillStyle   = dark ? (T.cowA || "#3B3330") : (T.earA || T.body);
      g.strokeStyle = dark ? (T.cowA || "#3B3330") : T.line;
      g.beginPath(); g.ellipse(0, 0, r*.38, r*.20, 0, 0, 7); g.fill(); g.stroke();
      g.fillStyle = dark ? "#D98FA6" : T.earIn;
      g.beginPath(); g.ellipse(r*.03, 0, r*.24, r*.11, 0, 0, 7); g.fill();
      g.restore();
    }
    g.strokeStyle = T.line;
  } else if (T.ear === "koala"){
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.72, -r*.22);
      g.fillStyle = T.earIn;
      g.beginPath();
      for (let i = 0; i <= 44; i++){
        const a = i/44*Math.PI*2;
        const rr = r*.50 * (1 - .11 + .11*Math.sin(a*9));
        const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
        if (i === 0) g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = T.earA || T.body;
      g.beginPath(); g.arc(0, 0, r*.28, 0, 7); g.fill();
      g.restore();
    }
  } else if (T.ear === "pig"){
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.58, -r*.66); g.rotate(s*0.34);
      g.fillStyle = T.earA || T.body;
      g.beginPath();
      g.moveTo(-r*.26, r*.20);
      g.quadraticCurveTo(-r*.24, -r*.20, r*.02, -r*.30);
      g.quadraticCurveTo(r*.22, -r*.16, r*.26, r*.20);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath();
      g.moveTo(-r*.13, r*.15);
      g.quadraticCurveTo(-r*.11, -r*.08, r*.01, -r*.16);
      g.quadraticCurveTo(r*.11, -r*.06, r*.13, r*.15);
      g.closePath(); g.fill();
      g.restore();
    }
  } else if (T.ear === "shiba"){
    // しばの 立ちみみ。ねこより はば広で、さきが すこし まるい
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.58, -r*.66); g.rotate(s*0.18);
      g.fillStyle = T.earA || T.body;
      g.beginPath();
      g.moveTo(-r*.30, r*.22);
      g.quadraticCurveTo(-r*.20, -r*.30, 0, -r*.40);
      g.quadraticCurveTo(r*.20, -r*.30, r*.30, r*.22);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath();
      g.moveTo(-r*.15, r*.16);
      g.quadraticCurveTo(-r*.09, -r*.12, 0, -r*.20);
      g.quadraticCurveTo(r*.09, -r*.12, r*.15, r*.16);
      g.closePath(); g.fill();
      g.restore();
    }
  } else if (T.ear === "elephant"){
    // ぞうの おおきな たれみみ。
    // ここは 2どしくじっている ので 理由を のこす：
    //   1) そとの はしが 1.02r しか なく、ほとんどが からだに かさなって いた
    //   2) earA を body と ほぼ 同じ 色に して いたので とけて 見えなかった
    // → はしを たれみみ(floppy) と 同じ 1.22r まで 出し、色も はっきり 分ける。
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.80, -r*.12); g.scale(s, 1);
      g.fillStyle = T.earA || T.shade;
      g.beginPath();
      // 上は ひろく、下に いくほど すぼんで たれる
      g.moveTo(-r*.26, -r*.56);
      g.quadraticCurveTo(r*.34, -r*.62, r*.42, -r*.14);
      g.quadraticCurveTo(r*.48,  r*.30, r*.16,  r*.56);
      g.quadraticCurveTo(-r*.06, r*.70, -r*.20, r*.46);
      g.quadraticCurveTo(-r*.30, r*.10, -r*.26, -r*.56);
      g.closePath(); g.fill(); g.stroke();
      // みみの うちがわ（ふちを のこして ひとまわり 小さく）
      g.fillStyle = T.earIn;
      g.beginPath();
      g.moveTo(-r*.14, -r*.42);
      g.quadraticCurveTo(r*.22, -r*.46, r*.28, -r*.10);
      g.quadraticCurveTo(r*.32,  r*.22, r*.08,  r*.40);
      g.quadraticCurveTo(-r*.06, r*.48, -r*.12, r*.30);
      g.quadraticCurveTo(-r*.18, r*.04, -r*.14, -r*.42);
      g.closePath(); g.fill();
    g.restore();
    }
  } else if (T.ear === "fox"){
    // きつねの みみ。しばより 高く ほそく、さきが とがって いて 先が くろい。
    // しばの まるい 立ちみみと はっきり 分ける ための かたち。
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.52, -r*.74); g.rotate(s*0.20);
      g.fillStyle = T.earA || T.body;
      g.beginPath();
      g.moveTo(-r*.24, r*.26);
      g.lineTo(0, -r*.62);
      g.lineTo(r*.24, r*.26);
      g.closePath(); g.fill(); g.stroke();
      // さきの くろ
      g.fillStyle = T.earTip || "#3B3330";
      g.beginPath();
      g.moveTo(-r*.105, -r*.24);
      g.lineTo(0, -r*.62);
      g.lineTo(r*.105, -r*.24);
      g.closePath(); g.fill();
      // 内がわ
      g.fillStyle = T.earIn;
      g.beginPath();
      g.moveTo(-r*.115, r*.18);
      g.lineTo(0, -r*.28);
      g.lineTo(r*.115, r*.18);
      g.closePath(); g.fill();
      g.restore();
    }
  } else if (T.ear === "boar"){
    // うり坊：ちいさい 立ちみみ。さきが こい。1.10r いない
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.56, -r*.70); g.rotate(s*0.22);
      g.fillStyle = T.earA || T.body;
      g.beginPath();
      g.moveTo(-r*.19, r*.20); g.lineTo(0, -r*.34); g.lineTo(r*.19, r*.20);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = T.earTip || T.line;
      g.beginPath();
      g.moveTo(-r*.085, -r*.06); g.lineTo(0, -r*.34); g.lineTo(r*.085, -r*.06);
      g.closePath(); g.fill();
      g.restore();
    }
  } else if (T.ear === "unicorn"){
    // **たてがみは ここで えがく（＝体の うしろ）。**
    // かおの 段で えがいて、ねもとを 体の色の まるで ふさいで いた ときは、
    // その まるの ふちが そのまま 見えて、**もこもこ輪郭の 中に
    // つるんとした 円が 浮いて いる** ように なった。
    // うしろに 置けば、体の もこもこ輪郭が そのまま ねもとを かくす。
    {
      // **ひだりへ ながす。ふっさりと。**
      // まうえに そろえて 7つ ならべて いた ときは、たてがみでは なく
      // **色の ついた ぼうし**に 見えた。いまは 13房 ×2そう かさねて、
      // ひだり(9時の 方向)から あたまの 上まで 弧を えがく。
      // **さいだいの のび は .88 + .245*1.25 = 1.19r（1.22r を こえない）。**
      const MANE = ["#FF9EC0","#FFB6A8","#FFD79A","#FFF2A6","#B8EBBE","#A8D9F2","#C6BCF5"];
      const N = 13, A0 = -Math.PI*0.97, A1 = -Math.PI/2 + .45;
      for (let layer = 0; layer < 2; layer++){
        for (let i = 0; i < N; i++){
          const a = A0 + (A1 - A0) * (i + (layer ? .5 : 0)) / (N - 1);
          const len = 1.25 - i * .033;               // ひだりほど ながい
          const d   = layer ? .95 : .88;
          const sc  = layer ? .74 : 1;
          g.fillStyle = MANE[(i + layer*3) % MANE.length];
          g.save();
          g.translate(Math.cos(a) * r * d, Math.sin(a) * r * d);
          g.rotate(a + Math.PI/2);
          g.beginPath(); g.ellipse(0, 0, r*.135*(layer?.85:1), r*.245*len*sc, 0, 0, 7); g.fill();
          g.restore();
        }
      }
    }
    // みみ：ほそい 木の葉がた。つのの じゃまを しないよう そとに ひらく
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.62, -r*.62); g.rotate(s*0.55);
      g.fillStyle = T.earA || T.body;
      g.beginPath();
      g.moveTo(0, r*.26);
      g.quadraticCurveTo(-r*.16, -r*.08, 0, -r*.34);
      g.quadraticCurveTo(r*.16, -r*.08, 0, r*.26);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath();
      g.moveTo(0, r*.16);
      g.quadraticCurveTo(-r*.075, -r*.04, 0, -r*.24);
      g.quadraticCurveTo(r*.075, -r*.04, 0, r*.16);
      g.closePath(); g.fill();
      g.restore();
    }
  } else if (T.ear === "floppy"){
    // そと(earA)＋内がわ(earIn) の 2色。1色の ぬりつぶしに すると、
    // 色が こいとき「大きな 黒い かたまり」に なって 体より 目立った。
    // 内がわは そとがわへ ずらして 置く。ここは 体の うしろに 描かれるので、
    // まんなかに 置くと 体に かくれて 見えない。
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.90, -r*.30); g.scale(s, 1); g.rotate(0.42);
      g.fillStyle = T.earA || T.earIn;
      g.beginPath(); g.ellipse(0,0, r*.26, r*.45, 0, 0, 7); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath(); g.ellipse(r*.055, r*.02, r*.145, r*.29, 0, 0, 7); g.fill();
      g.restore();
    }
  } else if (T.ear === "tuft"){
    g.fillStyle = T.earA || T.body; g.strokeStyle = T.line;
    for (const o of [-.22, .22]){
      g.beginPath();
      g.arc(r*o, -r*1.0, r*.125, 0, 7);
      g.fill(); g.stroke();
    }
    // まんなかは くるんと した アホ毛。ちいさくても シルエットで わかる
    g.save();
    g.strokeStyle = T.line; g.lineCap = "round"; g.lineWidth = Math.max(1.3, r*.075);
    g.beginPath();
    g.moveTo(0, -r*.96);
    g.quadraticCurveTo(r*.06, -r*1.24, r*.20, -r*1.20);
    g.quadraticCurveTo(r*.28, -r*1.17, r*.23, -r*1.08);
    g.stroke();
    g.restore();
    g.fillStyle = T.earA || T.body; g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*0.045);
    g.beginPath(); g.arc(0, -r*.98, r*.115, 0, 7); g.fill(); g.stroke();
  }

  // からだ
  const grd = g.createRadialGradient(-r*.3, -r*.35, r*.1, 0, 0, r*1.05);
  grd.addColorStop(0, T.hi || "#ffffff");     // くろい子は 白いツヤだと うきすぎる
  grd.addColorStop(.35, T.body);
  grd.addColorStop(1, T.shade);
  g.fillStyle = grd;
  g.strokeStyle = T.line;
  g.lineWidth = Math.max(1, r*0.05);
  // puff が あれば まるを ならべた もこもこ輪郭。なければ これまでの 正弦波。
  if (T.puff) puffPath(g, r, T.fluff, T.puff, phase);
  else        fluffPath(g, r, T.fluff, T.amp, phase);
  g.fill(); g.stroke();

  // ぱんだ模様（まるっこく、ちょっと ちいさめ）
  // ひつじ：もこもこ（＝体の輪郭）は ベージュ のまま、
  // その 内がわに くろい かおの 円を のせる。つくりは らいおんと 同じ。
  // つのは かおの 円より さきに えがいて、根もとを 隠す。
  // きつね：しばの かおを 色ちがいで つかうと 犬にしか 見えない。
  //   ちがいは 3つ。たてに ながい とがった マズル／ほおの ふさ毛／
  //   まろまゆを つけない こと。まろまゆは しばの いちばんの とくちょう なので
  //   きつねに つけると そこで 犬に 見える。
  if (T.face === "fox"){
    const TAN = T.tan || "#FFF2E2";
    g.fillStyle = TAN;
    // ほおの ふさ毛：ふちに そって とがった 3まいずつ
    for (const s of [-1,1]){
      g.save(); g.translate(s*r*.60, r*.10); g.scale(s, 1);
      for (const k of [-1, 0, 1]){
        g.save(); g.rotate(k*0.36 + 0.10);
        g.beginPath();
        g.moveTo(0, -r*.13);
        g.quadraticCurveTo(r*.26, -r*.07, r*.40, 0);
        g.quadraticCurveTo(r*.26,  r*.07, 0,  r*.13);
        g.closePath(); g.fill();
        g.restore();
      }
      g.restore();
    }
    // たてに ながい マズル（しばの まるい ものと 分ける）
    g.beginPath();
    g.moveTo(-r*.27, r*.16);
    g.quadraticCurveTo(-r*.30, r*.52, 0, r*.70);
    g.quadraticCurveTo(r*.30, r*.52, r*.27, r*.16);
    g.quadraticCurveTo(0, r*.04, -r*.27, r*.16);
    g.closePath(); g.fill();
    // ひたいの 白い すじ
    g.save(); g.globalAlpha = .45;
    g.beginPath(); g.ellipse(0, -r*.34, r*.13, r*.26, 0, 0, 7); g.fill();
    g.restore();
  }

  if (T.face === "sheep"){
    // かおの 大きさは amp では なく faceR で きめる。
    // もこもこ輪郭に した ことで amp は 輪郭に つかわれなく なった ため。
    const R = r * (T.faceR || (1 - 2*T.amp));
    // つの（きいろ／うずまき）
    for (const sd of [-1, 1]){
      g.save(); g.translate(sd*R*.72, -R*.52); g.scale(sd, 1);
      g.lineCap = "round";
      const hp = () => {
        g.beginPath();
        g.moveTo(-R*.06, -R*.10);
        g.quadraticCurveTo(R*.34, -R*.06, R*.30, R*.22);
        g.quadraticCurveTo(R*.26, R*.44, R*.04, R*.36);
      };
      g.strokeStyle = T.hornL || "#C9992B";      // ふち
      g.lineWidth = Math.max(1.4, r*.155); hp(); g.stroke();
      g.strokeStyle = T.hornC || "#F7D157";      // きいろ 本体
      g.lineWidth = Math.max(1, r*.105);  hp(); g.stroke();
      g.restore();
    }
    // かおの 円（くろ）
    const gf = g.createRadialGradient(-R*.28, -R*.32, R*.1, 0, 0, R*1.05);
    gf.addColorStop(0, T.faceB);
    gf.addColorStop(.45, T.faceB);
    gf.addColorStop(1, T.faceS);
    g.fillStyle = gf; g.strokeStyle = T.faceL; g.lineWidth = Math.max(1, r*.038);
    g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill(); g.stroke();
    // マズル（うすい ベージュ）
    g.fillStyle = T.muzzle || "#E9D9BC";
    g.beginPath(); g.ellipse(0, r*.30, r*.26, r*.17, 0, 0, 7); g.fill();
  }

  // めじろ：とりだと わかる 手がかりを 3つ かさねる。
  //   おばね（うしろに ちょこん）／はね（ひよこと 同じ かたち）／
  //   目のまわりの 細い 白わっか。わっかを 太くすると 目玉が 大きく 見えて
  //   とりに 見えなくなるので ほそいまま にする こと。
  if (T.face === "mejiro"){
    g.save();
    g.fillStyle = T.wingC || T.shade; g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*.05);
    // おばね：ひだり下へ ななめに 出す。
    // まえは (-.62r, .52r) から 内がわ むきに はえて いて、さきが 体の 中で
    // 終わって いた（＝ぜんぜん 見えて いなかった）。いまは 45度 そとむきに 出し、
    // いちばん さきが 中心から 1.19r。**1.22r を こえない こと**（となりの子に かぶる）。
    g.save(); g.translate(-r*.56, r*.42); g.rotate(Math.PI*0.82);
    for (const k of [-1, 0, 1]){
      g.save(); g.rotate(k*0.22);
      g.beginPath();
      g.moveTo(0, -r*.075);
      g.quadraticCurveTo(r*.34, -r*.045, r*.50, 0);
      g.quadraticCurveTo(r*.34, r*.045, 0, r*.075);
      g.closePath(); g.fill(); g.stroke();
      g.restore();
    }
    g.restore();
    // はね：ほおの 下、体の ふちの すこし 内がわに たたんで つける。
    // ふちの ぎりぎりに 置くと もこもこ輪郭に まぎれて 見えない。
    for (const s2 of [-1,1]){
      g.save(); g.translate(s2*r*.72, r*.46); g.scale(s2, 1); g.rotate(.60);
      g.beginPath();
      g.moveTo(-r*.03, -r*.15);
      g.quadraticCurveTo(r*.22, -r*.10, r*.19, r*.13);
      g.quadraticCurveTo(r*.10, r*.23, -r*.04, r*.12);
      g.closePath(); g.fill(); g.stroke();
      // はねの すじ 2本
      g.globalAlpha = .5; g.lineWidth = Math.max(1, r*.026);
      g.beginPath();
      g.moveTo(r*.01, -r*.07); g.quadraticCurveTo(r*.14, -r*.01, r*.14, r*.09);
      g.moveTo(-r*.01, r*.01); g.quadraticCurveTo(r*.09, r*.05, r*.09, r*.13);
      g.stroke(); g.globalAlpha = 1;
      g.restore();
    }
    // おなかの うすい ところ
    g.fillStyle = T.hi || T.shade;
    g.beginPath(); g.ellipse(0, r*.46, r*.40, r*.24, 0, 0, 7); g.fill();
    g.restore();
    // 目のまわりの 白わっか（ほそく／目に ぴったり）
    g.strokeStyle = "#FFFFFF"; g.lineWidth = Math.max(1, r*.05);
    for (const s2 of [-1,1]){
      g.beginPath(); g.arc(s2*r*.33, -r*.02, r*.185, 0, 7); g.stroke();
    }
  }

  // ぞう：はなは 顔の 内がわで 完結させる。
  // 外に のばすと ぎゅうぎゅうの ばんめんで となりと ぶつかって 読めなくなる
  // （CLAUDE.md に ある とおり、こあらの はなと 同じ かんがえ方）。
  if (T.face === "elephant"){
    // ぞうの はな。まえは ただの かたまりで ぞうに 見えなかった。
    // ぞうらしさは「上が ふとく 下が ほそい」「しわの すじ」「さきが まく」の 3つ。
    // 外に のばすと ぎゅうぎゅうの ばんめんで となりと ぶつかるので
    //   たては r*.74 まで、よこは r*.30 まで に おさめて ある。
    g.save();
    g.lineCap = "round"; g.lineJoin = "round";

    // はなの すじ道（上から さきへ）。さきは みぎに まく。
    const P = [
      [ 0.00, 0.02], [-0.05, 0.26], [ 0.00, 0.48],
      [ 0.10, 0.63], [ 0.21, 0.57]
    ].map(([x,y]) => [x*r, y*r]);

    const seg = (i, w, col) => {
      g.strokeStyle = col; g.lineWidth = Math.max(1, w);
      g.beginPath();
      g.moveTo(P[i][0], P[i][1]);
      g.quadraticCurveTo(P[i+1][0], P[i+1][1], P[i+2][0], P[i+2][1]);
      g.stroke();
    };

    // ふち → 本体 の 順で かさねて、ふとさを だんだん ほそく する
    for (const [ci, cw] of [[0, .34], [2, .25]]){
      seg(ci, r*cw, T.line);
    }
    for (const [ci, cw] of [[0, .27], [2, .18]]){
      seg(ci, r*cw, T.shade);
    }
    // さきの まき
    g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*.17);
    g.beginPath(); g.moveTo(P[3][0], P[3][1]); g.lineTo(P[4][0], P[4][1]); g.stroke();
    g.strokeStyle = T.shade; g.lineWidth = Math.max(1, r*.11);
    g.beginPath(); g.moveTo(P[3][0], P[3][1]); g.lineTo(P[4][0], P[4][1]); g.stroke();

    // しわの すじ（ぞうの はなだと わかる いちばんの 手がかり）
    g.strokeStyle = T.line; g.globalAlpha = .55;
    const wr = [[0.13, .125], [0.28, .115], [0.43, .10], [0.56, .085]];
    for (const [ty, hw] of wr){
      const y = ty*r;
      const x = (ty < .3 ? -0.035 : (ty - .30) * 0.30) * r;
      g.lineWidth = Math.max(1, r*.026);
      g.beginPath();
      g.moveTo(x - hw*r, y - r*.02);
      g.quadraticCurveTo(x, y + r*.03, x + hw*r, y - r*.02);
      g.stroke();
    }
    g.globalAlpha = 1;
    g.restore();
  }

  if (T.face === "panda"){
    // マズル（muzzle:"..." を 持つ子だけ）。たぬき用。
    // こい ぶち＋こい 体 だけだと 顔ぜんたいが 茶の かたまりに 見えるので、
    // くちの まわりだけ 明るく して 面を 割る。ぶちより 先に 描く（ぶちが 上）。
    if (T.muzzle){
      g.fillStyle = T.muzzle;
      g.beginPath(); g.ellipse(0, r*.29, r*.34, r*.22, 0, 0, 7); g.fill();
    }
    // patchC で 目のまわりの 色を 変えられる（たぬきは こげ茶）
    g.fillStyle = T.patchC || "#3B3330";
    for (const s of [-1,1]){
      g.save(); g.translate(s*r*.355, r*.012); g.rotate(s*0.2);
      g.beginPath(); g.ellipse(0,0, r*.325, r*.36, 0, 0, 7); g.fill();
      g.restore();
    }
    // みみの リボン（ribbon:true の子だけ）
    if (T.ribbon){
    g.save();
    g.translate(r*.78, -r*.92); g.rotate(-.35);
    g.fillStyle = "#FF9EC0";
    g.beginPath(); g.ellipse(-r*.115, 0, r*.105, r*.078, -.45, 0, 7); g.fill();
    g.beginPath(); g.ellipse( r*.115, 0, r*.105, r*.078,  .45, 0, 7); g.fill();
    g.fillStyle = "#FFC2D8";
    g.beginPath(); g.arc(0, 0, r*.055, 0, 7); g.fill();
    g.restore();
    }
  }
  // みけの ぶち。
  // 目（eyeX=r*.33, eyeY=-r*.02）に かからない ところにだけ 置く。
  // 目の上に もようを のせると 表情が 消える（ぱんだ・くろしばで 学んだ）。
  if (T.mike){
    g.save();
    g.fillStyle = T.mikeA;                                   // オレンジ：右うえ（みみと つながる）
    g.beginPath(); g.ellipse(r*.44, -r*.58, r*.36, r*.30, .22, 0, 7); g.fill();
    g.beginPath(); g.ellipse(-r*.56, r*.56, r*.22, r*.17, -.3, 0, 7); g.fill();   // 左した に ちいさく
    g.fillStyle = T.mikeB;                                   // くろ：左うえ（すこし ちいさめ）
    g.beginPath(); g.ellipse(-r*.40, -r*.60, r*.28, r*.23, -.26, 0, 7); g.fill();
    g.restore();
  }
  // らいおん：たてがみ（＝体の輪郭）の 内がわに、なめらかな かおの 円を のせる。
  // 円の 大きさは r*(1-2*amp) ＝ たてがみの「谷」と ちょうど 接する 大きさ。
  // ここを 大きく すると 谷から かおが はみ出し、小さく すると ほっぺが たてがみに 乗る。
  if (T.face === "lion"){
    const R = r * (1 - 2*T.amp);
    // みみ（かおの 円より 先に えがいて、下半分を 隠す）
    for (const s of [-1, 1]){
      g.save(); g.translate(s*r*.44, -r*.66);
      g.fillStyle = T.faceB; g.strokeStyle = T.faceL; g.lineWidth = Math.max(1, r*.035);
      g.beginPath(); g.arc(0, 0, r*.155, 0, 7); g.fill(); g.stroke();
      g.fillStyle = T.earIn;
      g.beginPath(); g.arc(0, r*.02, r*.08, 0, 7); g.fill();
      g.restore();
    }
    // かおの 円
    const gf = g.createRadialGradient(-R*.3, -R*.35, R*.1, 0, 0, R*1.05);
    gf.addColorStop(0, "#ffffff");
    gf.addColorStop(.35, T.faceB);
    gf.addColorStop(1, T.faceS);
    g.fillStyle = gf; g.strokeStyle = T.faceL; g.lineWidth = Math.max(1, r*.038);
    g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill(); g.stroke();
    // マズル（ふたこぶ）
    g.fillStyle = "#FFF3DC";
    for (const s of [-1, 1]){
      g.beginPath(); g.ellipse(s*r*.135, r*.275, r*.175, r*.145, 0, 0, 7); g.fill();
    }
  }
  // うしの ぶち：顔の みぎ 4わりほどを まとめて 黒く する。
  // そとがわの ふちは もこもこの 輪郭を そのまま なぞる。丸で 近似すると
  // ふちに 白い すきまが 出たり 黒が はみ出したり するので、この計算を 外さないこと。
  if (T.face === "cow"){
    g.save();
    g.fillStyle = T.cowA || "#3B3330";
    const a0 = -Math.PI*0.60, a1 = Math.PI*0.34, N = 44;
    g.beginPath();
    for (let i = 0; i <= N; i++){
      const a = a0 + (a1 - a0) * i / N;
      const rr = r * (1 - T.amp + T.amp*Math.sin(a*T.fluff + phase));
      const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    // 内がわは やわらかい なみ線で とじる（まっすぐには 切らない）
    g.bezierCurveTo(r*.16, r*.60, r*.22, r*.18, r*.06, -r*.16);
    g.bezierCurveTo(-r*.06, -r*.44, r*.04, -r*.72, -r*.31, -r*.95);
    g.closePath(); g.fill();
    // ひだり下に ちいさい ぶちを ひとつ（左右で つりあいを とる）
    g.beginPath(); g.ellipse(-r*.62, r*.52, r*.21, r*.15, -.38, 0, 7); g.fill();
    g.restore();
    // はなづら（うしの いちばんの とくちょう。よこ長で 大きい）
    g.fillStyle = "#FFC2D2";
    g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*.04);
    g.beginPath(); g.ellipse(0, r*.33, r*.30, r*.215, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = "#E39BAF";
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(s2*r*.115, r*.29, r*.042, r*.055, s2*.2, 0, 7); g.fill();
    }
    g.fillStyle = "rgba(255,255,255,.5)";
    g.beginPath(); g.ellipse(-r*.09, r*.24, r*.09, r*.045, -.28, 0, 7); g.fill();
  }
  // ひよこの ちいさな はね
  if (T.face === "chick"){
    g.save();
    g.fillStyle = T.shade; g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*.045);
    for (const s2 of [-1,1]){
      g.save(); g.translate(s2*r*.80, r*.26); g.scale(s2, 1); g.rotate(.28);
      g.beginPath();
      g.moveTo(-r*.02, -r*.20);
      g.quadraticCurveTo(r*.30, -r*.14, r*.26, r*.16);
      g.quadraticCurveTo(r*.14, r*.30, -r*.04, r*.16);
      g.closePath(); g.fill(); g.stroke();
      g.restore();
    }
    g.restore();
  }
  // こあらの はな。顔の 内がわで 完結する とくちょう なので、
  // ぎゅうぎゅうに つまっても 読める。
  if (T.face === "koala"){
    g.fillStyle = "#4A4340";
    g.beginPath();
    g.moveTo(0, r*.05);
    g.bezierCurveTo(-r*.235, r*.09, -r*.215, r*.45, 0, r*.47);
    g.bezierCurveTo(r*.215, r*.45, r*.235, r*.09, 0, r*.05);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,.30)";
    g.beginPath(); g.ellipse(-r*.075, r*.17, r*.065, r*.05, -.4, 0, 7); g.fill();
  }
  // ぶたの はな（大きな よこ長。あなと ツヤつき）
  /* ============================================================
     シークレットの 3体。**まだ ALL_CHARACTERS には 入れて いない**ので
     ふつうに 遊ぶ ぶんには ここは 一度も 通らない。
     定義は 下の SECRET_CHARACTERS。
     ============================================================ */

  // うり坊（いのししの こども）。**しま模様が いのち。**
  // こげ茶 だけだと くま・たぬきと 見分けが つかない ので、
  // クリームの よこじまで 模様として 分ける（うし・パンダ・ねこと 同じ 考え方）。
  if (T.face === "boar"){
    g.save();
    // うり坊の しま。**顔の はしに みじかい 線で 置く。**
    // よこ幅いっぱいの おびに したら、しま では なく
    // 「あごひげ」に 見えた（これは かお であって 体では ない）。
    g.fillStyle = T.tan || "#F2DFC2";
    g.globalAlpha = .92;
    for (const s2 of [-1, 1]) for (const [yy, ln] of [[-.46, .26], [-.22, .30], [.04, .26]]){
      g.save(); g.translate(s2*r*.66, r*yy); g.rotate(s2*0.42);
      g.beginPath(); g.ellipse(0, 0, r*ln*.5, r*.052, 0, 0, 7); g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
    g.restore();
    // はな（ぶたより ちいさく・こい色。まるく しすぎると ぶたに なる）
    g.fillStyle = T.snout || "#8E6B53";
    g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*.04);
    g.beginPath(); g.ellipse(0, r*.30, r*.215, r*.165, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = "#5C463C";
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(s2*r*.085, r*.31, r*.035, r*.05, 0, 0, 7); g.fill();
    }
    // きば 2本。**上むきに ちいさく。** 大きくすると こわい顔に なる
    // きば：はなの 両わきから 上むきに。ちいさすぎると なにか わからない
    g.fillStyle = "#FFFBF2"; g.strokeStyle = "#CFBBA0"; g.lineWidth = Math.max(.9, r*.026);
    for (const s2 of [-1,1]){
      g.save(); g.translate(s2*r*.235, r*.40); g.scale(s2, 1); g.rotate(-.22);
      g.beginPath();
      g.moveTo(-r*.055, r*.10);
      g.quadraticCurveTo(-r*.02, -r*.14, r*.045, -r*.19);
      g.quadraticCurveTo(r*.075, -r*.02, r*.055, r*.10);
      g.closePath(); g.fill(); g.stroke();
      g.restore();
    }
  }

  // ユニコーン。**むらさきは 15体で 空いて いた ゆいいつの 色。**
  // 角は 金。たてがみは にじいろ。どちらも 1.22r を こえない こと。
  if (T.face === "unicorn"){
    // **ながい はなづら。** これが ないと ただの まるい たまで、
    // 馬らしさが どこにも なかった（「なんだか わからない」と 言われた）。
    // **よこより たてを ながく する** のが きも。まるい マズルだと ねこに なる。
    g.fillStyle = T.muzzle || "#FFF4E4";
    g.beginPath(); g.ellipse(0, r*.30, r*.235, r*.315, 0, 0, 7); g.fill();
    // はなづらの ふち（うっすら）。面が 浮いて 見えないように
    g.save(); g.globalAlpha = .35; g.strokeStyle = T.line;
    g.lineWidth = Math.max(.8, r*.022);
    g.beginPath(); g.ellipse(0, r*.30, r*.235, r*.315, 0, 0, 7); g.stroke();
    g.restore();

    // **前がみ（まえに たらした たてがみ）。**
    // うしろの たてがみだけだと あたまの うしろで 完結して しまう。
    // ひたいに かかる 房を 3つ 足すと ぐっと 生きものに なる。
    {
      // ひたいに **はっきり かかる** ながさに する。
      // さきが -.58r あたりで 終わって いた ときは、うしろの たてがみに
      // まぎれて **前がみが あるのか わからなかった**。
      // 6ふさ・はば .12r で ふっさり させ、ひだりへ ながす
      // （うしろの たてがみと 向きを そろえる）。
      const FORE = [["#FF9EC0", -.50, -.74, .46, -.52], ["#FFB6A8", -.30, -.88, .62, -.36],
                    ["#FFD79A", -.09, -.95, .68, -.20], ["#FFF2A6",  .12, -.94, .64, -.04],
                    ["#B8EBBE",  .32, -.86, .54,  .12], ["#A8D9F2",  .48, -.72, .42,  .28]];
      for (const [col, x0, y0, len, tilt] of FORE){
        g.save(); g.translate(r*x0, r*y0); g.rotate(tilt);
        g.fillStyle = col;
        g.beginPath();
        g.moveTo(-r*.125, 0);
        g.quadraticCurveTo(-r*.105, r*len*.55, -r*.03, r*len);   // さきを ひだりへ
        g.quadraticCurveTo(r*.085, r*len*.55, r*.125, 0);
        g.closePath(); g.fill();
        g.restore();
      }
    }
    // たてがみ：あたまの ふちに そって にじの ふさを 5つ
    // つの：まんなか 上。さきは 1.20r（**1.22r を こえない**）
    g.save();
    const hg = g.createLinearGradient(0, -r*1.21, 0, -r*.76);
    hg.addColorStop(0, "#FFF0B8"); hg.addColorStop(1, T.hornC || "#F2C64E");
    g.fillStyle = hg; g.strokeStyle = T.hornL || "#C99A2B";
    g.lineWidth = Math.max(.9, r*.028); g.lineJoin = "round";
    // **ほそく ながく。** ふとくて みじかいと つのでは なく
    // 「おうかんの かざり」に 見える。さきは 1.21r（1.22r を こえない）。
    g.beginPath();
    g.moveTo(-r*.055, -r*.76); g.lineTo(0, -r*1.21); g.lineTo(r*.055, -r*.76);
    g.closePath(); g.fill(); g.stroke();
    // つのの うずまき 2本
    g.strokeStyle = "rgba(201,154,43,.75)"; g.lineWidth = Math.max(.8, r*.026);
    g.lineCap = "round";
    for (const yy of [-.90, -1.04]){
      const w = .048 * (yy < -1 ? .45 : .85);
      g.beginPath();
      g.moveTo(-r*w, r*yy);
      g.lineTo( r*w, r*(yy + .04));
      g.stroke();
    }
    g.restore();
    // ほおの ちいさな 星（まほうっぽさ）
    g.fillStyle = "rgba(255,255,255,.85)";
    sparkle4(g, r*.66, -r*.30, r*.10, "rgba(255,255,255,.9)");
  }

  // ドラゴン。**はねは つけない。** よこに 張り出すと ぎゅうぎゅうの ばんめんで
  // となりに かぶる（ぞうの はなと 同じ 理由）。つのと きばだけで 十分 読める。
  if (T.face === "dragon"){
    // せなかの とげ 3つ（あたまの 上。1.15r いない）
    g.fillStyle = T.spike || "#E9C46A"; g.strokeStyle = T.line;
    g.lineWidth = Math.max(.9, r*.032); g.lineJoin = "round";
    for (const [ox, sc] of [[-.30, .72], [0, 1], [.30, .72]]){
      g.beginPath();
      g.moveTo(r*(ox - .075*sc), -r*.90);
      g.lineTo(r*ox,             -r*(.90 + .22*sc));
      g.lineTo(r*(ox + .075*sc), -r*.90);
      g.closePath(); g.fill(); g.stroke();
    }
    // つの 2本。**ながい 2本ストロークに しない こと。**
    // ふとさの 変わらない ながい 線に して いた ときは、
    // つのでは なく **金色の バナナ／触角** に 見えた。
    // ねもとを ふとく・さきを ほそくした 三日月に する。さきは 1.13r いない。
    for (const s2 of [-1,1]){
      g.save(); g.translate(s2*r*.44, -r*.66); g.scale(s2, 1);
      g.fillStyle = T.hornC || "#F0D08A";
      g.strokeStyle = T.hornL || "#B8873A"; g.lineWidth = Math.max(.9, r*.030);
      g.lineJoin = "round";
      g.beginPath();
      // さきは 中心から 1.19r。**1.22r を こえない こと**（となりの子に かぶる）
      g.moveTo(-r*.10, r*.11);                                  // ねもと そと
      g.quadraticCurveTo(r*.09, -r*.09, r*.26, -r*.30);         // さきへ
      g.quadraticCurveTo(r*.15, -r*.08, r*.09, r*.10);          // うちがわを もどる
      g.closePath(); g.fill(); g.stroke();
      g.restore();
    }
    // マズル（はなづら）。**おなかの おびに しては いけない。**
    // よこ .46r・たて .30r の 大きな おびに して いた ときは、
    // かおの 下半分を おおって「あごひげ」に 見えた。これは かおで あって 体では ない。
    g.save();
    g.fillStyle = T.tan || "#FFF0CE";
    g.beginPath(); g.ellipse(0, r*.30, r*.30, r*.205, 0, 0, 7); g.fill();
    g.restore();
    // きば：くちの 両はしから 下に ちょこん。
    // はなと くちは ふつうの えがき方に まかせる（ここで 足すと ごちゃつく）。
    g.fillStyle = "#FFFBF2"; g.strokeStyle = "#DCCBAF"; g.lineWidth = Math.max(.8, r*.02);
    for (const s2 of [-1,1]){
      g.beginPath();
      g.moveTo(s2*r*.105, r*.28);
      g.lineTo(s2*r*.185, r*.28);
      g.lineTo(s2*r*.142, r*.45);
      g.closePath(); g.fill(); g.stroke();
    }
  }

  if (T.face === "pig"){
    // はなは すこし ちいさく・上へ。前は 顔が よこに 広がって「まんじゅう」に 見えていた
    g.fillStyle = "#FF9DB4";
    g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*.04);
    g.beginPath(); g.ellipse(0, r*.27, r*.255, r*.195, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = "#D96B87";
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(s2*r*.10, r*.28, r*.04, r*.055, 0, 0, 7); g.fill();
    }
    g.fillStyle = "rgba(255,255,255,.55)";
    g.beginPath(); g.ellipse(-r*.085, r*.19, r*.085, r*.042, -.28, 0, 7); g.fill();
    // つむじ（あたまの ちょこんとした 毛）。シルエットに とくちょうが 出る
    g.save();
    g.strokeStyle = T.line; g.lineCap = "round"; g.lineWidth = Math.max(1.4, r*.062);
    g.beginPath();
    g.moveTo(-r*.05, -r*.92);
    g.quadraticCurveTo(r*.14, -r*1.10, r*.16, -r*.96);
    g.quadraticCurveTo(r*.17, -r*.87, r*.07, -r*.90);
    g.stroke();
    g.restore();
    // くるんとした しっぽ（よこから ちょこっと のぞく）
    g.save();
    g.strokeStyle = T.line; g.lineCap = "round"; g.lineWidth = Math.max(1.3, r*.058);
    g.beginPath();
    g.moveTo(r*.92, r*.42);
    g.quadraticCurveTo(r*1.14, r*.34, r*1.08, r*.20);
    g.quadraticCurveTo(r*1.03, r*.10, r*.94, r*.17);
    g.stroke();
    g.restore();
  }
  // いぬのマズル
  if (T.face === "dog"){
    g.fillStyle = "#FFFBF2";
    g.beginPath(); g.ellipse(0, r*.28, r*.34, r*.25, 0, 0, 7); g.fill();
  }
  // くろしばの もよう。
  // くろい顔は そのままだと 表情が まったく 読めないので、
  // 「まろまゆ」と クリームの マズル・ほお で 目と口の まわりを 明るくする。
  // これは 見ばえの ためだけでなく、顔が 見えるように するための 必須の しかけ。
  if (T.face === "shiba"){
    const TAN = T.tan || "#F3E2C8";
    // ほお（左右の うすい クリーム）
    g.fillStyle = TAN;
    for (const s of [-1,1]){
      g.save(); g.globalAlpha = .55;
      g.beginPath(); g.ellipse(s*r*.66, r*.24, r*.20, r*.24, s*.25, 0, 7); g.fill();
      g.restore();
    }
    // マズル（口のまわり）
    g.fillStyle = TAN;
    g.beginPath(); g.ellipse(0, r*.34, r*.40, r*.28, 0, 0, 7); g.fill();
    // あごの下まで つなげる
    g.beginPath(); g.ellipse(0, r*.62, r*.26, r*.20, 0, 0, 7); g.fill();
    // 目のまわりを ほんのり 明るく（しろめが うきやすくなる）
    g.save(); g.globalAlpha = .30;
    for (const s of [-1,1]){
      g.beginPath(); g.ellipse(s*r*.355, r*.01, r*.26, r*.28, 0, 0, 7); g.fill();
    }
    g.restore();
    // まろまゆ（しばの いちばんの とくちょう）
    for (const s of [-1,1]){
      g.save(); g.translate(s*r*.355, -r*.44); g.rotate(s*0.26);
      g.beginPath(); g.ellipse(0, 0, r*.175, r*.125, 0, 0, 7); g.fill();
      g.restore();
    }
  }

  su = su || 0;
  const shock = su > .25;
  const happy = !shock && sm > .35;
  const A = happy ? Math.min(1, (sm - .35)/.3) : 0;
  const SA = shock ? Math.min(1, (su - .25)/.25) : 0;

  // ほっぺ（わらうと ぽっと大きく、ツヤも出る）
  g.fillStyle = happy ? "rgba(255,138,168,.62)"
              : (shock ? "rgba(255,164,186,.44)" : "rgba(255,150,175,.5)");
  const bw = r*(happy ? .19 : shock ? .135 : .15), bh = r*(happy ? .125 : shock ? .085 : .095);
  for (const s2 of [-1,1]){
    g.beginPath(); g.ellipse(s2*r*.58, r*.2, bw, bh, 0, 0, 7); g.fill();
  }
  if (happy){
    g.fillStyle = `rgba(255,255,255,${.75*A})`;
    for (const s2 of [-1,1]){
      g.beginPath(); g.ellipse(s2*r*.62, r*.17, r*.045, r*.028, -.3, 0, 7); g.fill();
    }
  }

  // め
  const eyeX = r*.33, eyeY = -r*.02;
  const eh = r*.135 * blinkAmt;
  // とじた目（まばたき）と にっこり目（^^）は「線」なので、
  // くらい ぶちの 上だと 消える。ぱんだ・たぬきは じっさい まばたきの あいだ
  // 目が まるごと 消えて いた（ふだんの 目は 白目＋黒目 なので 気づかなかった）。
  // ぶちの 上に 目が のる かおだけ 白い 線に する。
  //   ぱんだ face … 両目とも くろい ぶちの 上（たぬきも これ）
  //   うし   face … ぶちは 顔の みぎ 4わり なので みぎ目 だけ
  //   しば   face … 目の まわりは まろまゆ（明るい）なので 濃い線の まま
  const lidColor = (s2) =>
    (T.face === "panda" || (T.face === "cow" && s2 > 0)) ? "#FFFFFF" : "#4A3A33";
  for (const s2 of [-1,1]){
    const ex = s2*eyeX;
    const arc = happy && (T.eye === "arc" || (T.eye === "wink" && s2 < 0));
    if (arc){
      // にっこり ^ ^（ふとめ・やわらかいカーブ）
      g.strokeStyle = lidColor(s2);
      g.lineWidth = Math.max(1.3, r*.075);
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(ex - r*.14, eyeY + r*.075);
      g.quadraticCurveTo(ex, eyeY - r*.105, ex + r*.14, eyeY + r*.075);
      g.stroke();
    } else if (!happy && blinkAmt < .18){
      g.strokeStyle = lidColor(s2); g.lineWidth = Math.max(1, r*.055);
      g.beginPath();
      if (zz > .35){
        // **ねむり目。** まばたきの `⌒`（上に ふくらむ 弧）は、この ゲームの
        // **「わらい」の 形そのもの**で、眠って いるのに 笑って 固まって 見える
        // （作者の 指摘。2026-09-18）。ねむり は **ゆるく たれた ⌣** に する。
        g.moveTo(ex - r*.135, eyeY - r*.012);
        g.quadraticCurveTo(ex, eyeY + r*.085, ex + r*.135, eyeY - r*.012);
      } else {
        g.arc(ex, eyeY + r*.02, r*.12, Math.PI*1.12, Math.PI*1.88);
      }
      g.stroke();
    } else if (shock && kind === 2){
      // せり上がり：まんまるの しろめ＋てんてん（上を見てる）
      g.fillStyle = "#FFFFFF";
      g.beginPath(); g.ellipse(ex, eyeY, r*.15, r*.17, 0, 0, 7); g.fill();
      g.strokeStyle = "rgba(90,70,62,.5)"; g.lineWidth = Math.max(.8, r*.024);
      g.stroke();
      g.fillStyle = "#4A3A33";
      g.beginPath(); g.ellipse(ex, eyeY - r*.035, r*.05, r*.058, 0, 0, 7); g.fill();
    } else if (T.face === "panda" || T.face === "shiba" || T.face === "cow"){
      // ぱんだ・くろしば：くらい顔なので しろめ＋くろめ（きらきら）で うかせる
      const k = shock ? 1.34 : happy ? 1.18 : 1;
      const ky = shock ? 1 : (happy ? 1 : blinkAmt);
      g.fillStyle = "#FFFFFF";
      g.beginPath(); g.ellipse(ex, eyeY, r*.118*k, r*.145*k*ky, 0, 0, 7); g.fill();
      g.fillStyle = "#332C29";
      g.beginPath(); g.ellipse(ex + s2*r*.012, eyeY + r*.008, r*.078*k, r*.098*k*ky, 0, 0, 7); g.fill();
      g.fillStyle = "rgba(255,255,255,.98)";
      g.beginPath(); g.ellipse(ex - r*.03*k, eyeY - r*.042*k, r*.034*k, r*.04*k*ky, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(ex + r*.034*k, eyeY + r*.05*k, r*.018*k, r*.021*k*ky, 0, 0, 7); g.fill();
    } else {
      // ぱっちり（わらう／おどろくと 大きく、ハイライトも増える）
      const k = shock ? 1.36 : happy ? 1.18 : 1;
      const ry = shock ? r*.175 : happy ? r*.145 : eh;
      g.fillStyle = "#4A3A33";
      g.beginPath();
      g.ellipse(ex, eyeY - (happy ? r*.012 : 0), r*.105*k, ry*(shock?1:k), 0, 0, 7);
      g.fill();
      g.fillStyle = "rgba(255,255,255,.97)";
      g.beginPath();
      g.ellipse(ex - r*.04*k, eyeY - r*.058*k, r*.042*k, r*.05*k*((happy||shock)?1:blinkAmt), 0, 0, 7);
      g.fill();
      if (happy || shock){
        g.beginPath();
        g.ellipse(ex + r*.042*k, eyeY + r*.055*k, r*.026*k, r*.03*k, 0, 0, 7); g.fill();
      }
    }
    // ねむそう：**上から まぶたが 下りてくる**。目の たかさは 呼ぶ側で 縮める
    if (dw > .05 && !happy && !shock){
      g.strokeStyle = lidColor(s2);
      g.lineWidth = Math.max(1, r*.052);
      g.lineCap = "round";
      // **まぶたを 目の 上に うっすら 乗せない こと。** 大きな目の 上に 線が 乗ると
      // 眠気では なく **不機嫌（ジト目）**に 読める（実測で ふんだ）。
      // 呼ぶ側で 目の たかさを しっかり 縮めた うえで、まぶたは 目の 中ほどまで 下ろす。
      const ly = eyeY - r*.075 + r*.115 * dw;
      g.beginPath();
      g.moveTo(ex - r*.15, ly - r*.025);
      g.quadraticCurveTo(ex, ly + r*.06, ex + r*.15, ly - r*.025);
      g.stroke();
    }
  }

  if (shock && kind === 2){
    // せり上がり：ぷるぷる した くち
    const my = (T.face === "pig" || T.face === "boar") ? r*.58 : ((T.face === "koala" || T.face === "cow") ? r*.62 : r*.245);
    if (T.face === "chick"){
      g.save();
      g.translate(0, my - r*.03); g.rotate(Math.sin(phase*19)*.28);
      g.fillStyle = "#FF9E3D";
      g.beginPath();
      g.moveTo(-r*.13, -r*.03); g.lineTo(r*.13, -r*.03); g.lineTo(0, r*.15);
      g.closePath(); g.fill();
      g.restore();
    } else if (MR.noMouth){
      // 口の ない かお（ぞう）。mouthRule を 見ること
    } else {
      g.strokeStyle = MC; g.lineWidth = Math.max(1, r*.048);
      g.lineCap = "round"; g.lineJoin = "round";
      g.beginPath();
      g.moveTo(-r*.115, my);
      g.quadraticCurveTo(-r*.058, my - r*.062, 0, my);
      g.quadraticCurveTo(r*.058, my + r*.062, r*.115, my);
      g.stroke();
      if (!MR.noNoseDot){
        g.fillStyle = "#5C463C";
        g.beginPath(); g.ellipse(0, my - r*.115, r*.06, r*.043, 0, 0, 7); g.fill();
      }
    }
    if (T.face === "cat"){
      g.strokeStyle = "rgba(120,90,75,.55)"; g.lineWidth = Math.max(.8, r*.03);
      for (const s2 of [-1,1]) for (const o of [-.09, .04]){
        g.beginPath();
        g.moveTo(s2*r*.5, r*.15 + r*o);
        g.lineTo(s2*r*.92, r*.1 + r*o*1.6);
        g.stroke();
      }
    }
    drawShock2(g, r, SA, phase);
    g.restore();
    return;
  }

  if (shock){
    // ちいさく「わっ」と あいた口
    if (T.face === "chick"){
      g.fillStyle = "#FF9E3D";
      g.beginPath(); g.ellipse(0, r*.23, r*.085, r*.105, 0, 0, 7); g.fill();
      g.fillStyle = "#E07A20";
      g.beginPath(); g.ellipse(0, r*.27, r*.055, r*.045, 0, 0, 7); g.fill();
    } else if (MR.noMouth){
      // 口の ない かお（ぞう）。あけた口も えがかない。mouthRule を 見ること
    } else {
      const oy = (T.face === "pig" || T.face === "boar") ? r*.34 : ((T.face === "koala" || T.face === "cow") ? r*.38 : 0);
      g.fillStyle = MC;
      g.beginPath(); g.ellipse(0, r*.245 + oy, r*.072, r*.092, 0, 0, 7); g.fill();
      g.fillStyle = TG;
      g.beginPath(); g.ellipse(0, r*.275 + oy, r*.04, r*.036, 0, 0, 7); g.fill();
      if (!MR.noNoseDot){
        g.fillStyle = "#5C463C";
        g.beginPath(); g.ellipse(0, r*.13, r*.06, r*.043, 0, 0, 7); g.fill();
      }
    }
    if (T.face === "cat"){
      g.strokeStyle = "rgba(120,90,75,.55)"; g.lineWidth = Math.max(.8, r*.03);
      for (const s2 of [-1,1]) for (const o of [-.09, .04]){
        g.beginPath();
        g.moveTo(s2*r*.5, r*.15 + r*o);
        g.lineTo(s2*r*.92, r*.1 + r*o*1.6);
        g.stroke();
      }
    }
    drawShock(g, r, SA, phase);
    g.restore();
    return;
  }

  if (happy){
    drawSmileMouth(g, T, r);
    if (T.face === "cat"){        // ひげは わらっても そのまま
      g.strokeStyle = "rgba(120,90,75,.55)"; g.lineWidth = Math.max(.8, r*.03);
      for (const s2 of [-1,1]) for (const o of [-.09, .04]){
        g.beginPath();
        g.moveTo(s2*r*.5, r*.15 + r*o);
        g.lineTo(s2*r*.92, r*.1 + r*o*1.6);
        g.stroke();
      }
    }
    drawAccent(g, T, r, A, phase);
    g.restore();
    return;
  }

  // くち／くちばし
  if (yw > .02){
    // **あくび。** ここだけ 口を あける。ぞうは 口を えがかない（mouthRule）
    if (T.face === "chick" || T.beakLong){
      // くちばしを 上下に ひらく（まるい 穴に すると くちばしに 見えない）
      // **あくびの くちばしは よこにも ひろげる。** はば .15r の まま 上下に ひらくと
      // ほそながい オレンジの かたまりに 見えて、ひらいて いる ことが 読めない
      // **くちばしは 下あごが 下がる。上へは ひらかない。**
      // 上に ひらくと ねもと(.20r)と 目(-.02r)の あいだ .22r を こえて、
      // とがった さきが まゆの ところまで のびる（実際そう なった）
      // めじろ（beakLong）は ほそい くちばし。ひよこの はばで あけると
      // かおの はばの 半分に なって 別の とりに なる
      const lg = !!T.beakLong;
      const op = r*(lg ? .26 : .30)*yw;       // した あごが 下がる ぶん
      const bw = r*(lg ? (.058 + .075*yw) : (.15 + .10*yw));   // ねもとの はば
      const y0 = r*(lg ? .07 : .20);
      g.fillStyle = lg ? MC : "#C2410C";      // 口の 中。よこの さきを ちょうつがいに そろえる
      g.beginPath(); g.moveTo(-bw, y0 + op*.5); g.lineTo(0, y0);
      g.lineTo(bw, y0 + op*.5); g.lineTo(0, y0 + op); g.closePath(); g.fill();
      g.fillStyle = lg ? (T.beakB || "#4A423C") : "#FF9E3D";
      g.beginPath(); g.moveTo(-bw, y0); g.lineTo(bw, y0);
      g.lineTo(0, y0 - r*.06*yw); g.closePath(); g.fill();                 // うわ くちばし
      g.beginPath(); g.moveTo(-bw, y0 + op); g.lineTo(bw, y0 + op);
      g.lineTo(0, y0 + op + r*(lg ? .17 : .21)); g.closePath(); g.fill();  // した くちばし
    } else if (!MR.noMouth){
      const oy = (T.face === "pig" || T.face === "boar") ? r*.34
               : ((T.face === "koala" || T.face === "cow") ? r*.38 : 0);
      // はな（ω くちの ぶんは 出さない）
      if (!MR.bigNose && T.face !== "cat"){
        g.fillStyle = "#5C463C";
        const my0 = (T.face === "dog") ? r*.24 : r*.2;
        g.beginPath(); g.ellipse(0, my0 - r*.06, r*.07, r*.05, 0, 0, 7); g.fill();
      } else if (T.face === "cat"){
        g.fillStyle = "#E4728F";
        g.beginPath();
        g.moveTo(-r*.07, r*.1); g.lineTo(r*.07, r*.1); g.lineTo(0, r*.19);
        g.closePath(); g.fill();
      }
      // **あくびの 口は 行き先を きめて そこへ 寄せる。**
      // ふつうの ω の ばしょから すこし ふくらませる やり方だと、
      // 大きな はなの 子（こあら・うし・ぶた）で かおの 下から はみ出す。
      const bigN = (oy > 0);
      const tCy = bigN ? r*.645 : r*.400;   // 目の 下 .11r 〜 かおの 下 .86r に おさめる
      const tRx = bigN ? r*.240 : r*.290;
      const tRy = bigN ? r*.215 : r*.290;
      const cy0 = r*.30 + oy, mCy = cy0 + (tCy - cy0)*yw;
      const mRx = r*.075 + (tRx - r*.075)*yw;
      const mRy = r*.055 + (tRy - r*.055)*yw;
      g.fillStyle = MC;
      g.beginPath(); g.ellipse(0, mCy, mRx, mRy, 0, 0, 7); g.fill();
      g.fillStyle = TG;                      // した は 口の 下がわに 収まる
      g.beginPath(); g.ellipse(0, mCy + mRy*.46, mRx*.44, mRy*.32, 0, 0, 7); g.fill();
    }
  } else if (T.face === "chick"){
    g.fillStyle = "#FF9E3D";
    g.beginPath();
    g.moveTo(-r*.15, r*.2); g.lineTo(r*.15, r*.2); g.lineTo(0, r*.4);
    g.closePath(); g.fill();
  } else {
    const my = (T.face === "koala" || T.face === "cow") ? r*.62 : (T.face === "pig" ? r*.58 : (T.face === "boar" ? r*.56 : (T.face === "dog" ? r*.24 : r*.2)));
    // はな（ぶたは 大きな はなが すでに あるので えがかない）
    if (MR.bigNose){
      g.strokeStyle = "#5C463C"; g.lineWidth = Math.max(1, r*.045); g.lineCap = "round";
      g.beginPath();
      g.moveTo(-r*.10, my - r*.02);
      g.quadraticCurveTo(0, my + r*.06, r*.10, my - r*.02);
      g.stroke();
    } else if (MR.noMouth){
      // 口の ない かお（ぞう）。はな そのものが 顔の 中を とおる ので、
      // ここで 黒い はなを だすと 2つに なる。mouthRule を 見ること
    } else if (T.face !== "cat"){
      g.fillStyle = "#5C463C";
      g.beginPath(); g.ellipse(0, my - r*.06, r*.07, r*.05, 0, 0, 7); g.fill();
    } else {
      g.fillStyle = "#E4728F";
      g.beginPath();
      g.moveTo(-r*.07, my-r*.1); g.lineTo(r*.07, my-r*.1); g.lineTo(0, my-r*.01);
      g.closePath(); g.fill();
    }
    // ω くち（ぶたは 上で えがきおわっている／ぞうは はなが かさなる）
    if (!MR.bigNose && !MR.noMouth){
      g.strokeStyle = "#5C463C"; g.lineWidth = Math.max(1, r*.045);

let pinnedTheme = null;
function pinTheme(nm){
  const t = themePool().find(x => x.nm === nm);   // 解放前の ほしぞらは 見つからない
  if (!t) return null;
  pinnedTheme = t;
  return "次のゲームは「" + nm + "」だよ";
}

function pickTheme(){
  skyKey = ""; panKey = "";
  if (pinnedTheme){ TH = pinnedTheme; pinnedTheme = null; }
  else {
    let t = TH, guard = 0;
    while (t === TH && guard++ < 8) t = pick(themePool());   // ほしぞらは 解放後だけ 入る
    TH = t;
  }
  reseedDeco();
  document.body.style.background = TH.page;
}

function star(x, y, s){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI/2 + i*Math.PI/5;
    const rr = (i % 2) ? s*.44 : s;
    const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

let skyCv = null, skyCtx = null, skyKey = "";

function offCanvas(){
  const c = document.createElement("canvas");
  // **`SKIRT_MAX` で とる こと。** SKIRT は 端末に よって 変わるが、
  // キャンバスを 作りなおすのは 高い ので いちばん 大きい ぶんを 先に とる

  g.fillRect(0, 0, CW, CH);
